<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELORA Session Diagnostic</title><style>body{margin:0;background:#070a13;color:#edf1f8;font:15px Arial,Tahoma,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box}main{width:min(620px,100%);padding:26px;border:1px solid #26344f;border-radius:16px;background:#101827}h1{margin:0 0 12px;font-size:20px}p{line-height:1.8;color:#bac4d5}button{border:0;border-radius:10px;padding:12px 16px;background:#f0c65a;color:#15120a;font-weight:700;font-size:14px;cursor:pointer;margin:4px}button.alt{background:#b9c8e2}pre{direction:ltr;text-align:left;white-space:pre-wrap;background:#060a13;border:1px solid #26344f;border-radius:10px;padding:16px;min-height:88px;color:#bde8d1}small{color:#9eabba}</style></head><body><main><h1>بررسی Session و Logout</h1><p>ابتدا بعد از زدن دکمهٔ معمولی Logout در Dashboard، این صفحه را باز کن و فقط «بررسی Session فعلی» را بزن. این صفحه هیچ token، cookie یا password را نمایش نمی‌دهد.</p><button class="alt" id="check" type="button">بررسی Session فعلی</button><button id="logout" type="button">خروج و بررسی Session</button><pre id="result">آمادهٔ اجرا</pre><small>پس از ارسال نتیجه، این فایل را از public_html حذف کنید.</small></main><script>(function(){var result=document.getElementById('result'),check=document.getElementById('check'),logout=document.getElementById('logout');function req(p){return fetch(p,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.text().then(function(t){var d=null;try{d=JSON.parse(t)}catch(_){}return{status:r.status,code:d&&d.error&&d.error.code||''}})})}function fmt(label,x){return label+' HTTP: '+x.status+(x.code?' ('+x.code+')':'')}check.onclick=function(){check.disabled=true;result.textContent='در حال بررسی...';req('/api/v1/auth/refresh').then(function(x){result.textContent=fmt('Refresh current session',x)+'\n\nنتیجهٔ logout درست: 401 REFRESH_COOKIE_MISSING.'}).catch(function(e){result.textContent='Network error: '+e}).finally(function(){check.disabled=false})};logout.onclick=function(){logout.disabled=true;result.textContent='در حال بررسی...';req('/api/v1/auth/logout').then(function(a){return req('/api/v1/auth/refresh').then(function(b){return{a:a,b:b}})}).then(function(x){result.textContent=fmt('Logout',x.a)+'\n'+fmt('Refresh after logout',x.b)+'\n\nنتیجه درست: Logout = 200 و Refresh = 401.'}).catch(function(e){result.textContent='Network error: '+e}).finally(function(){logout.disabled=false})}})();</script></body></html>
