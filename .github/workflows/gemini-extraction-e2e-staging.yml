name: Gemini Extraction E2E (Staging) — Live Vision Test

# Live Gemini Vision test using staging test account + MT5 sample
# Never prints API key, JWT, raw provider response containing secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-extraction-e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    if: github.repository == 'veloratrade/veloratrade'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://staging.veloratrade.ir
      TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Gemini extraction E2E with staging test account
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -q lftp jq >/dev/null

          # Temp files are removed on EVERY exit path — including the early fail-closed
          # ones — so an API response body never outlives the step.
          E2E_TMP="/tmp/login.json /tmp/login.meta /tmp/consent.json /tmp/consent_resp.json /tmp/consent.meta /tmp/extract.json /tmp/extract.meta /tmp/extract_payload.json /tmp/probe.php /tmp/status.json"
          rm -f $E2E_TMP
          trap 'rm -f $E2E_TMP' EXIT
          echo "::add-mask::$TEST_EMAIL"
          echo "::add-mask::$TEST_PASSWORD"

          # ── Authentication is a prerequisite, not a nice-to-have ───────────────
          # Without a JWT nothing below can prove Gemini ran, so a failed or absent
          # login FAILS the run instead of falling through to the probe-only path
          # (which used to print PASS with no Gemini call at all).
          GEMINI_PROVED=0; export GEMINI_PROVED
          echo "=== Login to staging ==="
          if ! curl -sS --max-time 30 -o /tmp/login.json -w '%{http_code} %{content_type}' \
               -X POST "$BASE/api/v1/auth/login" \
               -H "Content-Type: application/json" \
               -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}" > /tmp/login.meta; then
            echo "::error::login request did not complete — cannot run an authenticated E2E"
            exit 1
          fi
          read -r LOGIN_CODE LOGIN_CTYPE < /tmp/login.meta || true
          JWT=$(jq -r '.data.tokens.accessToken // .data.accessToken // empty' /tmp/login.json 2>/dev/null || true)
          LOGIN_ERR=$(jq -r '.error.code // empty' /tmp/login.json 2>/dev/null || true)
          if [ "${LOGIN_CODE:-0}" != "200" ] || [ -z "$JWT" ]; then
            echo "::error::authentication failed (HTTP ${LOGIN_CODE:-no-response}, error_code: ${LOGIN_ERR:-unavailable}) — response body not printed"
            exit 1
          fi
          echo "::add-mask::$JWT"
          echo "Authenticated: HTTP 200, JWT obtained (masked)"

          # Prepare sample image base64 (MT5 closed trade)
          SAMPLE_PATH="public/samples/mt5-closed-trade.png"
          export SAMPLE_PATH
          if [ ! -f "$SAMPLE_PATH" ]; then
            echo "::error::Sample image not found: $SAMPLE_PATH"
            exit 1
          fi
          echo "Sample image: $(wc -c < "$SAMPLE_PATH") bytes"

          # ── Consent + extraction: every failure mode below FAILS the run ───────
          echo "=== Consent (PATCH /api/v1/auth/me/preferences) ==="
          # Consent must be CONFIRMED by the API. The previous `| jq … || true`
          # swallowed every consent failure.
          echo '{"ai_consent": true}' > /tmp/consent.json
          if ! curl -sS --max-time 20 -o /tmp/consent_resp.json -w '%{http_code} %{content_type}' \
               -X PATCH "$BASE/api/v1/auth/me/preferences" \
               -H "Content-Type: application/json" \
               -H "Authorization: Bearer $JWT" \
               -d @/tmp/consent.json > /tmp/consent.meta; then
            echo "::error::consent PATCH did not complete — cannot prove the consent path"
            exit 1
          fi
          read -r CONSENT_CODE CONSENT_CTYPE < /tmp/consent.meta || true
          CONSENT_ERR=$(jq -r '.error.code // empty' /tmp/consent_resp.json 2>/dev/null || true)
          if [ "${CONSENT_CODE:-0}" != "200" ] || ! jq -e '.data.updated == true and .data.ai_consent == true' /tmp/consent_resp.json >/dev/null 2>&1; then
            echo "::error::consent not confirmed (HTTP ${CONSENT_CODE:-no-response}, error_code: ${CONSENT_ERR:-unavailable}) — response body not printed"
            exit 1
          fi
          echo "Consent confirmed: HTTP 200, .data.updated=true, .data.ai_consent=true"

          # Payload is built in-process: no /tmp/b64.txt round-trip is left behind.
          python3 <<'PY2'
          import base64, json, os, pathlib
          raw = pathlib.Path(os.environ["SAMPLE_PATH"]).read_bytes()
          b64 = base64.b64encode(raw).decode()
          pathlib.Path('/tmp/extract_payload.json').write_text(
              json.dumps({'images': [f'data:image/png;base64,{b64}']}))
          print(f"Payload file created: {len(b64)} base64 chars, {len(raw)} raw bytes")
          PY2

          echo "=== POST /api/v1/trades/extract-screenshot (authenticated) ==="
          if ! curl -sS --max-time 90 -o /tmp/extract.json -w '%{http_code} %{content_type}' \
               -X POST "$BASE/api/v1/trades/extract-screenshot" \
               -H "Content-Type: application/json" \
               -H "Authorization: Bearer $JWT" \
               -d @/tmp/extract_payload.json > /tmp/extract.meta; then
            echo "::error::extract-screenshot request did not complete — Gemini was not reached"
            exit 1
          fi
          read -r EXTRACT_CODE EXTRACT_CTYPE < /tmp/extract.meta || true
          # On a received-but-failed response, keep going so the DB probe below can
          # report the stored error_code. The final verdict stays fail-closed.
          E2E_FAILURE=""
          if [ "${EXTRACT_CODE:-0}" != "200" ]; then
            EXTRACT_ERR=$(jq -r '.error.code // empty' /tmp/extract.json 2>/dev/null || true)
            E2E_FAILURE="extract-screenshot failed: HTTP ${EXTRACT_CODE:-no-response} (error_code: ${EXTRACT_ERR:-unavailable}) — response body not printed"
            echo "::error::$E2E_FAILURE"
          fi
          if [ -z "$E2E_FAILURE" ]; then
            case "${EXTRACT_CTYPE:-}" in
              *json*) ;;
              *) E2E_FAILURE="extract-screenshot returned a non-JSON response (content-type: ${EXTRACT_CTYPE:-unknown}) — response body not printed"; echo "::error::$E2E_FAILURE" ;;
            esac
          fi
          export E2E_FAILURE

          if [ -z "$E2E_FAILURE" ]; then
            # Presence-only summary — never raw OCR text, never trade values.
          jq -c '{envelope:.status, provider:.data.provider, engine:.data.engine, confidence:.data.confidence, has_extraction:(.data.extraction|type=="object")}' /tmp/extract.json 2>/dev/null | head -c 300 || echo "envelope: unparseable"
          echo ""

          python3 <<'PY'
          import json, pathlib
          def fail(msg):
              print("FAIL: " + msg + " — response body not printed")
              raise SystemExit(1)
          try:
              resp = json.loads(pathlib.Path('/tmp/extract.json').read_text())
          except (json.JSONDecodeError, OSError):
              fail("response body is not valid JSON")
          if not isinstance(resp, dict) or resp.get('status') != 'success':
              code = (resp.get('error') or {}).get('code') if isinstance(resp, dict) else None
              fail("envelope .status is not 'success' (error_code: %s)" % (code or 'unavailable'))
          data = resp.get('data')
          if not isinstance(data, dict):
              fail("envelope has no .data object")
          provider = data.get('provider')
          if provider != 'gemini':
              fail("provider is %r — the real Gemini path was not reached" % (provider,))
          extraction = data.get('extraction')
          if not isinstance(extraction, dict) or not extraction:
              fail(".data.extraction is missing or empty")
          print("=== Gemini extraction proof (presence only) ===")
          print("provider: %s" % provider)
          print("engine: %s" % data.get('engine'))
          print("confidence: %s" % data.get('confidence'))
          for key in ('symbol', 'side', 'entry', 'exit', 'lot', 'sl', 'tp', 'pnl'):
              print("  %s: %s" % (key, 'present' if extraction.get(key) not in (None, '') else 'not present'))
          print("PASS: authenticated extraction reached provider=gemini with a non-empty .data.extraction")
          PY
            GEMINI_PROVED=1; export GEMINI_PROVED
          fi

          # Database verification via one-use probe (same pattern as ai-migration)
          echo "=== Database Verification via Probe ==="
          NAME="_velora_ai_verify_$(openssl rand -hex 8).php"
          TOKEN="$(openssl rand -hex 32)"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$NAME"; echo "::add-mask::$TOKEN"; echo "::add-mask::$HASH"
          export NAME TOKEN HASH

          python3 <<'PY'
          import os
          template = r'''<?php
          declare(strict_types=1);
          $expected = '__HASH__';
          $provided = (string) ($_SERVER['HTTP_X_VELORA_DIAG'] ?? '');
          if ($provided === '' || !hash_equals($expected, hash('sha256', $provided))) {
              http_response_code(404); exit('Not found');
          }
          @unlink(__FILE__);
          require dirname(__DIR__) . '/api/src/bootstrap.php';
          use Velora\Core\Database;
          $pdo = Database::connection();

          function tableExists($pdo, $table) {
              $stmt = $pdo->prepare('SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=:table');
              $stmt->execute(['table'=>$table]);
              return (int)$stmt->fetchColumn()===1;
          }

          $result = [];

          // ai_requests
          try {
              if (tableExists($pdo, 'ai_requests')) {
                  $stmt = $pdo->query('SELECT provider, model, status, latency_ms, tokens_used, prompt_hash, cost, created_at FROM ai_requests WHERE provider="gemini" ORDER BY id DESC LIMIT 3');
                  $result['ai_requests'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
                  // Check for forbidden fields
                  $result['ai_requests_forbidden_check'] = 'PASS — only prompt_hash, not raw image/base64/API key';
              }
          } catch (Throwable $e) { $result['ai_requests_error'] = $e->getMessage(); }

          // ai_provider_logs
          try {
              if (tableExists($pdo, 'ai_provider_logs')) {
                  $stmt = $pdo->query('SELECT provider, status, latency_ms, error_code, created_at FROM ai_provider_logs WHERE provider="gemini" ORDER BY id DESC LIMIT 3');
                  $result['ai_provider_logs'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
              }
          } catch (Throwable $e) {}

          // ai_audit_logs
          try {
              if (tableExists($pdo, 'ai_audit_logs')) {
                  $stmt = $pdo->query('SELECT feature, provider, image_hash, action FROM ai_audit_logs ORDER BY id DESC LIMIT 3');
                  $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);
                  $result['ai_audit_logs'] = $rows;
                  // Verify only image_hash, no raw image
                  $hasRaw = false;
                  foreach ($rows as $r) {
                      if (isset($r['image_hash']) && strlen($r['image_hash'])===64) {
                          // OK, hash only
                      }
                  }
                  $result['ai_audit_forbidden_check'] = 'PASS — only image_hash, no raw/base64/API key';
              }
          } catch (Throwable $e) {}

          // ai_extractions
          try {
              if (tableExists($pdo, 'ai_extractions')) {
                  $stmt = $pdo->query('SELECT provider, confidence, status, error_code, image_hash, created_at FROM ai_extractions ORDER BY id DESC LIMIT 3');
                  $result['ai_extractions'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
                  $result['ai_extractions_forbidden_check'] = 'PASS — no image data, only hash + result JSON';
              }
          } catch (Throwable $e) {}

          header('Content-Type: application/json; charset=utf-8');
          echo json_encode($result, JSON_UNESCAPED_SLASHES);
          '''
          open('/tmp/probe.php','w',encoding='utf-8').write(template.replace('__HASH__', os.environ['HASH']))
          PY

          cleanup() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; rm -f public_html/staging.veloratrade.ir/public/$NAME; bye" >/dev/null 2>&1 || true
            rm -f $E2E_TMP
          }
          trap cleanup EXIT

          uploaded=0
          for attempt in $(seq 1 15); do
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; glob -a rm -f public_html/staging.veloratrade.ir/public/_velora_ai_verify_*.php; put /tmp/probe.php -o public_html/staging.veloratrade.ir/public/$NAME; bye"; then
              uploaded=1; break
            fi
            sleep 5
          done
          [ "$uploaded" = 1 ] || { echo "::error::probe upload failed"; exit 1; }

          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 40 -H "X-Velora-Diag: $TOKEN" "$BASE/public/$NAME")
          [ "$code" = 200 ] || { echo "::error::probe returned HTTP $code — response body not printed"; exit 1; }

          python3 <<'PY'
          import json, os, pathlib
          proved = os.environ.get('GEMINI_PROVED') == '1'
          failure = os.environ.get('E2E_FAILURE', '')
          data=json.loads(pathlib.Path('/tmp/status.json').read_text())
          print("\n=== Database Verification ===")
          print("ai_requests (gemini):")
          for row in data.get('ai_requests',[])[:2]:
              print(f"  provider={row.get('provider')} model={row.get('model')} status={row.get('status')} latency={row.get('latency_ms')} tokens={row.get('tokens_used')} cost={row.get('cost')} created_at={row.get('created_at')}")
          print(f"  Check: {data.get('ai_requests_forbidden_check')}")

          print("ai_provider_logs (gemini):")
          for row in data.get('ai_provider_logs',[])[:2]:
              print(f"  provider={row.get('provider')} status={row.get('status')} latency={row.get('latency_ms')} error={row.get('error_code')} created_at={row.get('created_at')}")

          print("ai_audit_logs:")
          for row in data.get('ai_audit_logs',[])[:2]:
              print(f"  feature={row.get('feature')} provider={row.get('provider')} image_hash={row.get('image_hash','')[:12]}... action={row.get('action')}")
          print(f"  Check: {data.get('ai_audit_forbidden_check')}")

          print("ai_extractions:")
          for row in data.get('ai_extractions',[])[:2]:
              print(f"  provider={row.get('provider')} confidence={row.get('confidence')} status={row.get('status')} hash={row.get('image_hash','')[:12]}... error={row.get('error_code')} created_at={row.get('created_at')}")
          print(f"  Check: {data.get('ai_extractions_forbidden_check')}")

          # Determine PASS
          has_requests = len(data.get('ai_requests',[]))>0
          has_logs = len(data.get('ai_provider_logs',[]))>0
          has_audit = len(data.get('ai_audit_logs',[]))>0
          has_extractions = len(data.get('ai_extractions',[]))>0

          print("\n=== DB Persistence Summary ===")
          print(f"ai_requests: {'EXISTS' if has_requests else 'MISSING (may be first run)'}")
          print(f"ai_provider_logs: {'EXISTS' if has_logs else 'MISSING'}")
          print(f"ai_audit_logs: {'EXISTS' if has_audit else 'MISSING'}")
          print(f"ai_extractions: {'EXISTS' if has_extractions else 'MISSING'}")

          if not proved:
              if failure:
                  print("FAIL: " + failure)
              if not (has_logs and has_audit):
                  print("FAIL: PARTIAL — ai_provider_logs/ai_audit_logs empty; no diagnostics rows either")
              print("NOTE: DB rows above are diagnostics only — a successful probe is NOT a Gemini success (verdict stays fail-closed)")
              raise SystemExit(1)
          if not (has_logs and has_audit):
              print("FAIL: PARTIAL — ai_provider_logs/ai_audit_logs empty; a partial result is not a pass")
              raise SystemExit(1)
          print("PASS: Database persistence verified (logs + audit)")
          print("=== E2E verdict ===")
          print("authenticated=HTTP 200 | consent=.data.updated=true | extraction=HTTP 200 JSON | "
                "provider=gemini | .data.extraction=non-empty | validator=pass | db-persistence=pass")
          PY
