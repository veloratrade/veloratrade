name: Extract 404 ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "404 (3).zip" -d temp_extract
          cp -r temp_extract/* .
          rm -rf temp_extract

      - name: Remove ZIP
        run: |
          rm -f "404 (3).zip"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract ZIP" || echo "No changes"
          git push
