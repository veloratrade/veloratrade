name: Velora CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One CI run per branch is enough. New pushes cancel obsolete browser jobs so
# they cannot consume Actions minutes for hours.
concurrency:
  group: velora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint and boot test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, openssl, curl, bcmath
          coverage: none

      - name: PHP syntax check (all files)
        run: |
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" > /tmp/lint.out 2>&1; then
              echo "::error file=$f::$(tail -1 /tmp/lint.out)"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './node_modules/*')
          if [ "$fail" -ne 0 ]; then
            echo "PHP syntax errors found."
            exit 1
          fi
          echo "All PHP files parsed cleanly."

      - name: Resend Mailer HTTP mock contract
        run: php tools/tests/test_resend_mailer.php

      - name: Gold Outline email template contract
        run: php tools/tests/test_email_template_gold_outline.php

      - name: Auth token consumption integration
        run: php tools/tests/test_auth_token_consumption.php

      - name: Database connection resilience contract
        run: php tools/tests/test_database_connection_resilience.php

      - name: Prepare private runtime root
        run: |
          # Config::privateRoot() demands an absolute dir OUTSIDE the document root.
          PRIV="$HOME/velora-private"
          mkdir -p "$PRIV/config" "$PRIV/data" "$PRIV/storage"
          cat > "$PRIV/config/velora.env" <<ENVEOF
          APP_ENV=local
          APP_DEBUG=true
          JWT_SECRET=ci-only-secret-key-at-least-32-bytes-long-xx
          APP_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64 -w0)
          MAIL_DRIVER=log
          DB_DRIVER=sqlite
          DB_DATABASE=$PRIV/data/velora.sqlite
          FRONTEND_URL=http://127.0.0.1:8080
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080
          BCRYPT_COST=10
          ENVEOF
          echo "VELORA_PRIVATE_ROOT=$PRIV" >> $GITHUB_ENV
          echo "Private root ready at $PRIV"

      - name: Initialise database
        run: |
          mkdir -p api/storage
          if [ -f api/init-sqlite.php ]; then
            php api/init-sqlite.php 2>&1 | tail -20 || echo "::warning::init-sqlite.php returned non-zero"
          fi
          # init-sqlite.php hardcodes api/storage/velora.sqlite, but
          # Database::connection() reads VELORA_PRIVATE_ROOT/data/velora.sqlite.
          # Place the seeded database where the application actually looks.
          if [ -f api/storage/velora.sqlite ]; then
            cp api/storage/velora.sqlite "$VELORA_PRIVATE_ROOT/data/velora.sqlite"
            echo "Seeded DB copied to the private data root."
          fi
          php -r '
            $p = getenv("VELORA_PRIVATE_ROOT")."/data/velora.sqlite";
            $pdo = new PDO("sqlite:".$p);
            $t = $pdo->query("select name from sqlite_master where type=\"table\" order by name")
                     ->fetchAll(PDO::FETCH_COLUMN);
            echo "tables (".count($t)."): ".implode(", ", $t)."\n";
            if (!in_array("rate_limits", $t, true)) {
              fwrite(STDERR, "::error::rate_limits table missing - the login path will 500\n");
              exit(1);
            }
          '

      - name: Boot API and check health
        run: |
          VELORA_PROD=1 php -S 127.0.0.1:8080 -t . router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 1
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 5 \
                   http://127.0.0.1:8080/health 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health OK:"; cat /tmp/health.json; exit 0
            fi
          done
          echo "::error::API did not become healthy in 20s (last http=$code)"
          echo "----- response -----"; cat /tmp/health.json 2>/dev/null
          echo "----- server log -----"; tail -40 /tmp/server.log
          exit 1

      - name: Login endpoint latency check
        run: |
          VELORA_PROD=1 php -S 127.0.0.1:8081 -t . router.php > /tmp/server2.log 2>&1 &
          sleep 3
          out=$(curl -s -o /tmp/login.json -w '%{http_code} %{time_total}' \
              --max-time 40 -X POST http://127.0.0.1:8081/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -H 'Origin: http://127.0.0.1:8081' \
              -d '{"email":"nobody@invalid.test","password":"wrong"}') || out="000 99"
          code=${out%% *}
          t=${out##* }
          echo "login: http=$code time=${t}s"
          head -c 400 /tmp/login.json || true; echo

          # A wrong password must be a clean 401, never a server error.
          if [ "$code" = "500" ] || [ "$code" = "000" ]; then
            echo "::error::Login returned http=$code - the auth path is broken"
            tail -30 /tmp/server2.log
            exit 1
          fi
          if awk "BEGIN{exit !($t > 3.0)}"; then
            echo "::error::Login took ${t}s - blocking call on the auth path"
            tail -30 /tmp/server2.log
            exit 1
          fi
          echo "Login OK (http=$code, ${t}s)."

  python:
    name: Python tooling check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all Python tools
        run: |
          python -m compileall -q tools *.py 2>&1 | tail -20
          echo "Python sources compiled."

      - name: Enforce zero-cost GitHub workflow policy
        run: python tools/check_github_cost_guard.py

      - name: Verify transactional CID icon assets
        run: python tools/tests/test_notification_email_icons.py

      - name: Set up Node for browser-contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify email browser link contract
        run: |
          python tools/tests/test_verify_email_contract.py
          node tools/tests/test_verify_email_browser.js

  dashboard:
    name: Dashboard browser test
    # e2e پرهزینه فقط روی PR در این workflow اجرا می‌شود؛ روی push به main
    # همان تست داخل quality-gate.yml (جاب gate-e2e) اجرا می‌شود تا هیچ
    # اجرای مرورگری تکراری روی یک ref رخ ندهد (کنترل هزینه — Phase 3.2).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, openssl, curl, bcmath
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-save playwright > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          echo "Playwright ready."

      - name: Prepare private runtime root
        run: |
          PRIV="$HOME/velora-private"
          mkdir -p "$PRIV/config" "$PRIV/data" "$PRIV/storage"
          cat > "$PRIV/config/velora.env" <<ENVEOF
          APP_ENV=local
          APP_DEBUG=true
          JWT_SECRET=ci-only-secret-key-at-least-32-bytes-long-xx
          APP_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64 -w0)
          MAIL_DRIVER=log
          DB_DRIVER=sqlite
          DB_DATABASE=$PRIV/data/velora.sqlite
          FRONTEND_URL=http://127.0.0.1:8080
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080
          BCRYPT_COST=10
          ENVEOF
          echo "VELORA_PRIVATE_ROOT=$PRIV" >> $GITHUB_ENV

      - name: Seed database with a known test user
        run: |
          mkdir -p api/storage
          php api/init-sqlite.php 2>&1 | tail -5
          cp api/storage/velora.sqlite "$VELORA_PRIVATE_ROOT/data/velora.sqlite"
          # init-sqlite.php predates the v0.2 bridge migration and creates
          # trading_accounts without broker/platform/sync_status/... , so every
          # dashboard endpoint 500s. Add the missing columns before seeding.
          php -r '
            $p = getenv("VELORA_PRIVATE_ROOT")."/data/velora.sqlite";
            $pdo = new PDO("sqlite:".$p);
            $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
            $have = array_column($pdo->query("PRAGMA table_info(trading_accounts)")->fetchAll(PDO::FETCH_ASSOC), "name");
            $add = [
              "broker" => "TEXT", "platform" => "TEXT", "server" => "TEXT",
              "mt_login" => "TEXT", "account_type" => "TEXT",
              "metaapi_account_id" => "TEXT", "sync_status" => "TEXT DEFAULT \"idle\"",
              "last_synced_at" => "TEXT", "connected_at" => "TEXT",
              "disconnected_at" => "TEXT", "auto_sync_enabled" => "INTEGER DEFAULT 0",
              "last_incremental_at" => "TEXT", "connection_checked_at" => "TEXT",
              "consecutive_errors" => "INTEGER DEFAULT 0", "last_error" => "TEXT",
              "starting_balance" => "REAL DEFAULT 0", "current_balance" => "REAL DEFAULT 0",
            ];
            foreach ($add as $col => $type) {
              if (!in_array($col, $have, true)) {
                $pdo->exec("ALTER TABLE trading_accounts ADD COLUMN $col $type");
              }
            }
            $tc = array_column($pdo->query("PRAGMA table_info(trades)")->fetchAll(PDO::FETCH_ASSOC), "name");
            if (!in_array("external_deal_id", $tc, true)) {
              $pdo->exec("ALTER TABLE trades ADD COLUMN external_deal_id TEXT");
            }
            echo "schema aligned with the repository classes\n";
            $hash = password_hash("CiTest1234!", PASSWORD_BCRYPT, ["cost" => 10]);
            $pdo->prepare(
              "INSERT OR REPLACE INTO users
               (id,email,password_hash,full_name,role,timezone,status,email_verified_at,created_at,updated_at)
               VALUES (900,?,?,?,?,?,?,datetime(\"now\"),datetime(\"now\"),datetime(\"now\"))"
            )->execute(["ci@velora.test",$hash,"CI User","user","UTC","active"]);
            echo "Test user ready.\n";
          '

      - name: Start application
        run: |
          VELORA_PROD=1 php -S 127.0.0.1:8080 -t . router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 1
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/health)" = "200" ]; then
              echo "Application up."; exit 0
            fi
          done
          echo "::error::Application did not start"; tail -30 /tmp/server.log; exit 1

      - name: Run dashboard end-to-end test
        env:
          BASE_URL: http://127.0.0.1:8080
          TEST_EMAIL: ci@velora.test
          TEST_PASSWORD: CiTest1234!
        run: timeout 180s node .github/scripts/dashboard_e2e.js

      - name: Server log on failure
        if: failure()
        run: tail -60 /tmp/server.log

      - name: Stop local test server
        if: always()
        run: pkill -f 'php -S 127.0.0.1:8080' || true
