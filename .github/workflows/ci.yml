name: Velora CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP lint and boot test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, openssl, curl
          coverage: none

      - name: PHP syntax check (all files)
        run: |
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" > /tmp/lint.out 2>&1; then
              echo "::error file=$f::$(tail -1 /tmp/lint.out)"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './node_modules/*')
          if [ "$fail" -ne 0 ]; then
            echo "PHP syntax errors found."
            exit 1
          fi
          echo "All PHP files parsed cleanly."

      - name: Prepare test environment
        run: |
          mkdir -p api/storage
          cat > /tmp/velora.env <<'ENVEOF'
          APP_ENV=local
          JWT_SECRET=ci-test-secret-key-that-is-long-enough-32
          MAIL_DRIVER=log
          DB_DRIVER=sqlite
          ENVEOF
          echo "VELORA_ENV_FILE=/tmp/velora.env" >> $GITHUB_ENV

      - name: Initialise database
        run: |
          if [ -f api/init-sqlite.php ]; then
            php api/init-sqlite.php || echo "::warning::init-sqlite.php returned non-zero"
          fi

      - name: Boot API and check health
        run: |
          php -S 127.0.0.1:8080 -t . router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fsS --max-time 5 http://127.0.0.1:8080/api/v1/health > /tmp/health.json 2>/dev/null; then
              echo "Health OK:"; cat /tmp/health.json; exit 0
            fi
          done
          echo "::error::API did not become healthy in 20s"
          echo "----- server log -----"; cat /tmp/server.log
          exit 1

      - name: Login endpoint latency check
        run: |
          php -S 127.0.0.1:8081 -t . router.php > /tmp/server2.log 2>&1 &
          sleep 3
          t=$(curl -s -o /tmp/login.json -w '%{time_total}' --max-time 30 \
              -X POST http://127.0.0.1:8081/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -H 'Origin: http://127.0.0.1:8081' \
              -d '{"email":"nobody@invalid.test","password":"wrong"}' || echo 99)
          echo "login response time: ${t}s"
          cat /tmp/login.json || true
          slow=$(echo "$t > 3.0" | bc -l 2>/dev/null || echo 0)
          if [ "$slow" = "1" ]; then
            echo "::error::Login took ${t}s - the blocking-call regression is back"
            exit 1
          fi
          echo "Login latency acceptable."

  python:
    name: Python tooling check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all Python tools
        run: |
          python -m compileall -q tools *.py 2>&1 | tail -20
          echo "Python sources compiled."
