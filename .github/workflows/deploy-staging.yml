# انتشار دستی روی محیط STAGING — کاملاً جدا از Production
#
# تفاوت‌های عمدی با deploy.yml:
#   - فقط workflow_dispatch (هیچ push ای تریگر نمی‌کند)
#   - Secrets مستقل staging (نه FTP_* تولید)
#   - بسته staging در همین job ساخته می‌شود: .htaccess با PRIVATE_ROOT
#     استیجینگ + X-Robots-Tag، robots.txt مسدودکننده، حذف فایل‌های
#     Production-only (sitemap، فایل تأیید Search Console، دامپ‌ها، ابزارها)
#
# پیش‌نیاز: سه Secret در Settings → Secrets and variables → Actions
#   STAGING_FTP_SERVER     مثلا 185.164.72.148
#   STAGING_FTP_USERNAME   اکانت FTP محدود به docroot استیجینگ
#   STAGING_FTP_PASSWORD
#
# توجه: velora_private_staging (env/data/logs) خارج از docroot است و
# با اکانت FTP محدود قابل آپلود نیست — طبق دستورالعمل، دستی ساخته می‌شود.

name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ── گیت دائمی کیفیت (Phase 3.2): پیش از هر آپلود روی staging ──
  quality_gate:
    name: گیت دائمی کیفیت — پیش‌شرط staging
    uses: ./.github/workflows/quality-gate.yml
    with:
      # معنای baseline: نسخه‌ای که **اکنون روی استیجینگ مستقر است**، تا گیت
      # آرشیو دقیقاً همان تغییراتی را ببیند که این استقرار روی آن محیط اعمال
      # می‌کند. برای dispatch دستی `github.event.before` وجود ندارد (خالی است)
      # — همان چیزی که run #42 را شکست داد؛ پس اینجا صریح پاس داده می‌شود.
      # الزاماً SHA کامل ۴۰ کاراکتری: گیت با `git fetch --depth=1 origin <sha>`
      # آن را می‌گیرد و گیت‌هاب نام مخفف را رد می‌کند (بازتولید محلی:
      # «fatal: couldn't find remote ref 1d100fb»).
      # پس از هر استقرار موفق استیجینگ، همین مقدار به SHA تازه به‌روز شود.
      base_sha: a3230bb9e59f86c0e7345dc12bbaea5491b1a79b

  guard:
    name: بررسی CSP پیش از staging
    needs: quality_gate
    uses: ./.github/workflows/csp-guard.yml

  deploy-staging:
    name: ساخت بسته و آپلود روی staging
    needs: guard
    if: github.repository == 'veloratrade/veloratrade'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ساخت docroot استیجینگ
        run: |
          set -euo pipefail
          DEST=staging-build
          mkdir -p "$DEST"

          # --- ریشه: front controller و استاتیک‌های لازم ---
          cp locale-router.php 404.html "$DEST/"
          mkdir -p "$DEST/404" && cp 404/index.html "$DEST/404/"
          cp favicon.ico favicon-16.png favicon-32.png favicon-48.png \
             icon-192.png icon-512.png apple-icon.png manifest.json velora-logo.svg "$DEST/"
          mkdir -p "$DEST/checkout" && cp checkout/index.html "$DEST/checkout/"

          # --- خروجی‌های لوکال‌سازی (شامل فایل مخفی .csp-release.json) ---
          cp -a localized "$DEST/localized"

          # --- public منهای فایل‌های تشخیصی ---
          cp -a public "$DEST/public"
          rm -f  "$DEST/public/logout-diagnostic-v2.html"
          rm -rf "$DEST/public/samples"

          # --- api: فقط runtime (بدون دامپ SQL، storage، ابزار تست/نصب) ---
          mkdir -p "$DEST/api/public" "$DEST/api/config"
          cp api/.htaccess api/index.php "$DEST/api/"
          cp api/public/index.php "$DEST/api/public/"
          cp api/config/config.php "$DEST/api/config/"
          [ -f api/config/.htaccess ] && cp api/config/.htaccess "$DEST/api/config/" || true
          cp -a api/src     "$DEST/api/src"
          cp -a api/locales "$DEST/api/locales"
          cp -a api/workers "$DEST/api/workers"

          # --- .htaccess استیجینگ: دقیقاً ۲ تغییر مصوب ---
          sed 's|^SetEnv VELORA_PRIVATE_ROOT /home/piknet/velora_private$|SetEnv VELORA_PRIVATE_ROOT /home/piknet/velora_private_staging|' \
            .htaccess > "$DEST/.htaccess"
          python3 - << 'PY'
          p = "staging-build/.htaccess"
          s = open(p).read()
          marker = 'Header always set X-Content-Type-Options "nosniff"'
          assert marker in s, ".htaccess marker not found"
          s = s.replace(marker, 'Header always set X-Robots-Tag "noindex, nofollow"\n  ' + marker, 1)
          open(p, "w").write(s)
          PY

          # --- SEO استیجینگ: ایندکس ممنوع، بدون sitemap و فایل تأیید ---
          printf 'User-agent: *\nDisallow: /\n' > "$DEST/robots.txt"

          # --- گاردهای ایمنی: هیچ فایل ممنوعه‌ای در بسته نباشد ---
          test "$(find "$DEST" -name '*.sql' | wc -l)" = 0
          test "$(find "$DEST" -name '*.env*' | wc -l)" = 0
          test "$(find "$DEST" -name '*.sqlite*' -o -name '*.log' -o -name 'error_log' | wc -l)" = 0
          test "$(find "$DEST" -name 'sitemap.xml' -o -name 'google*.html' | wc -l)" = 0
          test -f "$DEST/localized/.csp-release.json"
          grep -q "velora_private_staging" "$DEST/.htaccess"
          grep -q "X-Robots-Tag" "$DEST/.htaccess"
          echo "بسته سالم است: $(find "$DEST" -type f | wc -l) فایل"

      - name: گارد provenance بسته (read-only)
        run: |
          set -euo pipefail
          DEST=staging-build
          python3 - "$DEST" <<'PY'
          import json, pathlib, sys
          dest = pathlib.Path(sys.argv[1])
          pkg = json.loads((dest / "localized/.csp-release.json").read_text(encoding="utf-8"))
          repo = json.loads(pathlib.Path("localized/.csp-release.json").read_text(encoding="utf-8"))
          for k in ("releaseId", "commitSha", "sourceDigest", "releaseHtmlSha256", "cspManifestSha256"):
              if pkg.get(k) != repo.get(k):
                  raise SystemExit(f"بسته provenance با مخزن ناهماهنگ است: {k} pkg={pkg.get(k)} repo={repo.get(k)}")
          sha = pkg.get("commitSha")
          if not sha or not pkg.get("sourceDigest"):
              raise SystemExit("provenance (commitSha/sourceDigest) در بسته غایب است")
          print(f"✅ provenance بسته تأیید شد: releaseId={pkg.get('releaseId')} commitSha={sha[:12]}")
          PY

      - name: انتقال فایل‌های عادی با lftp mirror (بهینه، بدون فایل‌های حیاتی)
        env:
          FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -uo pipefail
          sudo apt-get install -y -q lftp > /dev/null
          source .github/deploy/critical-deploy-files.sh

          # معماری Hybrid Critical Files (جایگزین --transfer-all سراسری):
          #
          # ریشه حادثه Aug 2026: lftp mirror با --ignore-time تصمیم skip/transfer
          # را فقط بر اساس اندازه فایل می‌گیرد؛ یک فایل هم‌اندازه با محتوای
          # متفاوت (مثل localized/.csp-release.json، ۳۸۶ بایت در هر دو نسخه)
          # به‌اشتباه skip می‌شد. راه‌حل اول (--transfer-all) در PR #38/#39 کار
          # کرد اما هزینه‌اش این بود که هر ۷۱۷ فایل بسته (~۳۰ مگابایت) در *هر*
          # دیپلوی، حتی بدون تغییر، دوباره کامل آپلود شوند — با رشد Velora این
          # هزینه فقط بزرگ‌تر می‌شود.
          #
          # راه‌حل این PR: فایل‌های امنیتی-حیاتی (آرایه CRITICAL_DEPLOY_FILES در
          # .github/deploy/critical-deploy-files.sh) کاملاً از این mirror
          # --exclude می‌شوند — یعنی هرگز مشمول هیوریستیک skip نمی‌شوند، چون
          # اصلاً وارد این تصمیم‌گیری نمی‌شوند. آپلود واقعی آن‌ها در مرحله بعد،
          # با put صریح (بدون منطق skip)، انجام می‌شود.
          #
          # برای بقیه‌ی ۷۱۵ فایل عادی، بهینه‌سازی --continue بازگردانده شده
          # (بدون --transfer-all): تست شد که --continue برای فایل‌های واقعاً
          # بدون تغییر skip صحیح انجام می‌دهد و برای یک قطعی وسط انتقال یک
          # فایل بزرگ، resume از همان بایت (نه شروع از صفر) را انجام می‌دهد —
          # این دقیقاً رفتاری است که تکرار بیرونی روی کل بسته دیگر لازم نیست
          # به‌صورت full-resend جبران کند.
          EXCLUDE_ARGS=()
          for f in "${CRITICAL_DEPLOY_FILES[@]}"; do
            escaped="$(printf '%s' "$f" | sed -e 's/[.]/\\./g')"
            EXCLUDE_ARGS+=(--exclude "^${escaped}\$")
          done

          attempt=0
          until [ $attempt -ge 12 ]; do
            attempt=$((attempt+1))
            echo "===== تلاش $attempt (mirror عادی) ====="
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 20
          set net:timeout 30
          set ftp:passive-mode on
          set mirror:parallel-transfer-count 1
          # ── C1 — همگرایی محتوایی (content-safe sync) ─────────────────────────
          # باگ: --continue --ignore-time فقط بر اساس اندازه/زمان تصمیم skip/transfer
          # می‌گیرد؛ یک فایلِ هم‌اندازه با محتوای متفاوت (مثل velora-smart-import.js
          # یا feature-manifest.json) به‌اشتباه skip می‌شد و استیجینگ بیلدِ مخلوط
          # پیدا می‌کرد. --transfer-all هر فایلِ build را بدون هیوریستیکِ اندازه
          # ارسال می‌کند و --delete فایل‌های دورافتاده‌ی غایب از build را حذف می‌کند.
          # --delete فقط روی زیردرختِ هدف mirror (public_html/staging.veloratrade.ir/)
          # عمل می‌کند و به docroot تولید (public_html/) دست نمی‌زند؛ فایل‌های حیاتی
          # CSP در EXCLUDE_ARGS هستند و در مرحله بعد با put اجباری آپلود می‌شوند.
          mirror -R --transfer-all --delete --no-perms --no-symlinks --exclude-glob .git* ${EXCLUDE_ARGS[*]} staging-build/ public_html/staging.veloratrade.ir/
          bye
          " && break
            echo "قطع شد — ادامه از همان نقطه پس از 10 ثانیه..."
            sleep 10
          done

      - name: آپلود اجباری فایل‌های حیاتی (بدون تکیه بر منطق mirror)
        env:
          FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -uo pipefail
          source .github/deploy/critical-deploy-files.sh

          # این فایل‌ها هرگز از mirror عبور نمی‌کنند؛ اینجا با put صریح
          # آپلود می‌شوند. put هیچ منطق «آیا مقصد از قبل کامل/هم‌اندازه است؟»
          # ندارد — همیشه محتوا را کامل ارسال و جایگزین می‌کند، مستقل از
          # اندازه یا زمان فایل مقصد. این دقیقاً همان تضمینی است که در حادثه
          # Aug 2026 غایب بود.
          for f in "${CRITICAL_DEPLOY_FILES[@]}"; do
            echo "===== آپلود اجباری فایل حیاتی: $f ====="
            attempt=0
            until [ $attempt -ge 6 ]; do
              attempt=$((attempt+1))
              echo "  تلاش $attempt"
              lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:reconnect-interval-base 3
          set net:reconnect-interval-max 10
          set net:timeout 30
          set ftp:passive-mode on
          put staging-build/$f -o public_html/staging.veloratrade.ir/$f
          bye
          " && break
              echo "  قطع شد؛ ۱۰ ثانیه صبر و تلاش دوباره..."
              sleep 10
            done
            if [ $attempt -ge 6 ]; then
              echo "❌ FAIL: آپلود فایل حیاتی $f پس از ۶ تلاش ناموفق بود"
              exit 1
            fi
          done
          echo "✅ همه فایل‌های حیاتی با موفقیت (اجباری) آپلود شدند"

          echo "===== راستی‌آزمایی نهایی: فایل‌های کلیدی روی سرور ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow no
          set net:timeout 30
          cd public_html/staging.veloratrade.ir
          cls -l .htaccess locale-router.php robots.txt api/index.php
          cls -l localized/.csp-release.json public/locales/manifest.json
          bye
          LFTP

      - name: راستی‌آزمایی provenance روی سرور (read-only)
        env:
          FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -uo pipefail
          # هر دو فایل حیاتی provenance را از سرور می‌گیریم — نه فقط
          # .csp-release.json. مشکل رفع‌شده Aug 2026: lftp mirror ممکن است
          # فایلی را که اندازه‌اش با نسخه قبلی یکی است (byte-for-byte هم‌اندازه
          # ولی محتوای متفاوت) رد کند و به‌روزرسانی نکند. با معماری Hybrid
          # Critical Files این دو فایل دیگر اصلاً از مسیر mirror عبور
          # نمی‌کنند (به مرحله قبل، «آپلود اجباری فایل‌های حیاتی»، مراجعه
          # کنید)، اما این مرحله verification مستقل و read-only باقی می‌ماند
          # تا هر drift احتمالی (شبکه، رفتار سرور، و غیره) در آپلود اجباری هم
          # قابل تشخیص باشد — دفاع در عمق (defense in depth)، نه اعتماد کورکورانه
          # به موفقیت مرحله put.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set ftp:ssl-allow no
          set net:timeout 30
          cd public_html/staging.veloratrade.ir
          get localized/.csp-release.json -o /tmp/server-csp-release.json
          get public/locales/csp-manifest.json -o /tmp/server-csp-manifest.json
          bye
          LFTP
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          repo_release = json.loads(pathlib.Path("localized/.csp-release.json").read_text(encoding="utf-8"))
          server_release = json.loads(pathlib.Path("/tmp/server-csp-release.json").read_text(encoding="utf-8"))
          for k in ("releaseId", "commitSha", "sourceDigest", "releaseHtmlSha256", "cspManifestSha256"):
              if repo_release.get(k) != server_release.get(k):
                  raise SystemExit(
                      f"provenance روی سرور (.csp-release.json) با آرتیفکت تأییدشده نمی‌خواند: "
                      f"{k} repo={repo_release.get(k)} server={server_release.get(k)}"
                  )
          print("✅ localized/.csp-release.json روی سرور با آرتیفکت تأییدشده CI برابر است")

          repo_manifest_bytes = pathlib.Path("public/locales/csp-manifest.json").read_bytes()
          server_manifest_bytes = pathlib.Path("/tmp/server-csp-manifest.json").read_bytes()
          repo_manifest_sha256 = hashlib.sha256(repo_manifest_bytes).hexdigest()
          server_manifest_sha256 = hashlib.sha256(server_manifest_bytes).hexdigest()
          if repo_manifest_sha256 != server_manifest_sha256:
              raise SystemExit(
                  "provenance روی سرور (public/locales/csp-manifest.json) با آرتیفکت تأییدشده "
                  f"نمی‌خواند: sha256 repo={repo_manifest_sha256} server={server_manifest_sha256}"
              )
          if server_manifest_sha256 != server_release.get("cspManifestSha256"):
              raise SystemExit(
                  "ناهماهنگی داخلی روی سرور: sha256 واقعیِ public/locales/csp-manifest.json با "
                  f"cspManifestSha256 ثبت‌شده در localized/.csp-release.json یکی نیست "
                  f"(actual={server_manifest_sha256} recorded={server_release.get('cspManifestSha256')})"
              )
          print("✅ public/locales/csp-manifest.json روی سرور با آرتیفکت تأییدشده CI برابر است")

          # راستی‌آزمایی سازگاری داخلی اضافه (routeCount / policyVersion): این دو
          # مقدار در .csp-release.json نیز ذخیره می‌شوند و باید با مقادیر واقعیِ
          # منیفست منتشرشده روی سرور یکی باشند — یک drift جزئی دیگر (مثلاً
          # منیفست به‌روز شود ولی releaseId/routeCount بسته قدیمی بماند) را
          # مستقل از بررسی‌های بالا آشکار می‌کند.
          server_manifest = json.loads(server_manifest_bytes)
          for k in ("routeCount", "policyVersion"):
              release_val = server_release.get(k)
              manifest_val = server_manifest.get(k)
              if release_val != manifest_val:
                  raise SystemExit(
                      f"ناهماهنگی داخلی روی سرور: {k} در .csp-release.json={release_val} "
                      f"با {k} در csp-manifest.json={manifest_val} یکی نیست"
                  )
          print("✅ routeCount/policyVersion بین دو فایل حیاتی روی سرور سازگار است")
          PY

      - name: تطبیق محتوایی assets فرانتاند روی سرور (C3 — محتوابه‌محتوا، نه فقط اندازه)
        env:
          FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -uo pipefail
          # چرا: فایل‌های عادی از mirror --transfer-all عبور می‌کنند و mirror فقط
          # تصمیم ارسال/رد را می‌گیرد. این گام مستقل و read-only است و از docroot
          # استیجینگ دانلود می‌کند و SHA-256 هر asset را با build مقایسه می‌کند —
          # بنابراین هم‌اندازه-اما-محتوا-متفاوت را هم تشخیص می‌دهد. فایل‌های HTML
          # محافظت‌شده auth دارند و در HTTP به login رد می‌شوند؛ لذا مستقیم از FTP
          # (نه HTTP) خوانده می‌شوند.
          DESC=public_html/staging.veloratrade.ir
          SERVER_FILES=(
            "public/assets/velora-smart-import.js"
            "public/assets/velora-data.js"
            "public/assets/velora-dialog.js"
            "public/assets/velora-dynamic-content.js"
            "public/locales/feature-manifest.json"
            "public/locales/manifest.json"
            "public/locales/fa.json"
            "public/locales/en.json"
            "localized/fa/trades/new/index.html"
            "localized/en/trades/new/index.html"
            "localized/fa/profile/index.html"
            "localized/en/profile/index.html"
            "localized/fa/admin/index.html"
            "localized/en/admin/index.html"
            "localized/fa/dashboard/index.html"
            "localized/en/dashboard/index.html"
            "locale-router.php"
          )
          cmds=""
          for f in "${SERVER_FILES[@]}"; do
            cmds+="get $f -o /tmp/sv-$(echo "$f" | tr '/' '_')"$'\n'
          done
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set ftp:ssl-allow no
          set net:timeout 30
          cd $DESC
          $cmds
          bye
          LFTP
          fail=0
          for f in "${SERVER_FILES[@]}"; do
            sv="/tmp/sv-$(echo "$f" | tr '/' '_')"
            [ -f "$sv" ] || { echo "❌ not fetched: $f"; fail=1; continue; }
            s=$(sha256sum "$sv" | awk '{print $1}')
            l=$(sha256sum "staging-build/$f" 2>/dev/null | awk '{print $1}')
            if [ "$s" = "$l" ]; then echo "✅ match: $f"; else echo "❌ MISMATCH: $f  (build=$l server=$s)"; fail=1; fi
          done
          if [ $fail -eq 0 ]; then
            echo "✅ همه assets فرانت‌اند روی استیجینگ بایت‌به‌بایت برابر build هستند"
          else
            echo "❌ C3 coherence FAIL: استیجینگ با build هم‌خوان نیست"
            exit 1
          fi

      - name: بررسی سلامت نهایی staging (HTTP)
        run: |
          set -uo pipefail
          # آخرین و مهم‌ترین گیت: نتیجه‌ای که کاربر واقعی می‌بیند را بررسی
          # می‌کند، نه فقط فایل‌های روی دیسک سرور. اگر provenance فایل‌ها
          # درست باشد ولی اپ همچنان به هر دلیلی (مثلاً کش CDN، یا خطای دیگر)
          # 503/"Security policy unavailable" برگرداند، دیپلوی fail می‌شود.
          url="https://staging.veloratrade.ir/en/"
          attempt=0
          max_attempts=6
          until [ $attempt -ge $max_attempts ]; do
            attempt=$((attempt+1))
            echo "===== بررسی سلامت — تلاش $attempt/$max_attempts ====="
            response="$(curl -s -o /tmp/staging-health-body.txt -w '%{http_code}' --max-time 20 "$url" || echo "000")"
            echo "HTTP status: $response"
            if [ "$response" = "200" ]; then
              if grep -qi "security policy unavailable" /tmp/staging-health-body.txt; then
                echo "⚠️ HTTP 200 ولی بدنه حاوی پیام خطای CSP است — سلامت واقعی رد شد."
              else
                echo "✅ staging سالم است (HTTP 200، بدون پیام خطای CSP)"
                exit 0
              fi
            fi
            echo "سلامت هنوز تأیید نشد؛ ۱۰ ثانیه صبر و تلاش دوباره..."
            sleep 10
          done
          echo "❌ FAIL: staging پس از $max_attempts تلاش سالم نشد (آخرین HTTP status: $response)"
          echo "--- بدنه پاسخ آخر ---"
          cat /tmp/staging-health-body.txt || true
          exit 1

      - name: خلاصه
        run: |
          echo "### انتشار STAGING انجام شد" >> $GITHUB_STEP_SUMMARY
          echo "کامیت: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "یادآوری: velora_private_staging (env/data/logs) دستی مدیریت می‌شود." >> $GITHUB_STEP_SUMMARY
          echo "تست: https://staging.veloratrade.ir/health" >> $GITHUB_STEP_SUMMARY
