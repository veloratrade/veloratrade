name: Locale Smoke (Staging)
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'RUN', required: true, default: '' }
permissions: {}
concurrency: { group: locale-smoke-staging, cancel-in-progress: false }
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: curl checks
        run: |
          set -e
          B=https://staging.veloratrade.ir
          echo '--- 1 GET /en/ ---'
          curl -sS -o /tmp/en.html -D /tmp/en.h -H 'Accept-Language: fa-IR' "$B/en/"
          grep -E '^HTTP/' /tmp/en.h
          grep -E 'data-velora-prelocalized="en"|lang="en"' /tmp/en.html | head -2
          echo '--- 2 GET /fa/ ---'
          curl -sS -o /tmp/fa.html -D /tmp/fa.h "$B/fa/"
          grep -E '^HTTP/' /tmp/fa.h
          grep -E 'data-velora-prelocalized="fa"|lang="fa"' /tmp/fa.html | head -2
          echo '--- 3 anon /dashboard/ fa browser (no follow) ---'
          curl -sS -o /dev/null -D /tmp/d1.h --max-redirs 0 -H 'Accept-Language: fa-IR,fa;q=0.9' "$B/dashboard/" || true
          grep -iE '^HTTP/|^location:' /tmp/d1.h
          echo '--- 4 anon /dashboard/ cookie=en (no follow) ---'
          curl -sS -o /dev/null -D /tmp/d2.h --max-redirs 0 -H 'Accept-Language: fa-IR' -H 'Cookie: velora_locale=en' "$B/dashboard/" || true
          grep -iE '^HTTP/|^location:' /tmp/d2.h
          echo '--- 5 register locale=en ---'
          curl -sS -o /tmp/reg.json -D /tmp/reg.h -X POST "$B/api/v1/auth/register" \
            -H 'Origin: https://staging.veloratrade.ir' -H 'Content-Type: application/json' \
            --data '{"email":"velo+'$RANDOM'@emalupe.com","password":"Vn!9Smoke12345","full_name":"Smoke","locale":"en","notificationLocale":"en"}'
          grep '^HTTP/' /tmp/reg.h
          cat /tmp/reg.json; echo
          echo '--- 6 PATCH prefs without auth (401) ---'
          curl -sS -o /dev/null -D - -X PATCH "$B/api/v1/auth/me/preferences" \
            -H 'Origin: https://staging.veloratrade.ir' -H 'Content-Type: application/json' \
            --data '{"locale":"en"}' | grep -iE '^HTTP/'
