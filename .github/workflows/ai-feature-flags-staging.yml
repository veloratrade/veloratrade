name: AI Feature Flags Enable (Staging)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ENABLE-AI-FLAGS to confirm'
        required: true
        default: ''

permissions: {}

concurrency:
  group: ai-feature-flags-staging
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      BASE: https://staging.veloratrade.ir
      INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - name: Enable AI feature flags on staging
        run: |
          set -euo pipefail
          [ "$INPUT_CONFIRM" = "ENABLE-AI-FLAGS" ] || { echo "::error::confirm must be ENABLE-AI-FLAGS"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -q lftp >/dev/null
          NAME="_velora_ai_flag_$(openssl rand -hex 8).php"
          TOKEN="$(openssl rand -hex 32)"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$NAME"; echo "::add-mask::$TOKEN"; echo "::add-mask::$HASH"
          export NAME TOKEN HASH

          python3 <<'PY'
          import os
          template = r'''<?php
          declare(strict_types=1);
          $expected = '__HASH__';
          $provided = (string) ($_SERVER['HTTP_X_VELORA_DIAG'] ?? '');
          if ($provided === '' || !hash_equals($expected, hash('sha256', $provided))) {
              http_response_code(404); exit('Not found');
          }
          @unlink(__FILE__);
          require dirname(__DIR__) . '/api/src/bootstrap.php';
          use Velora\Core\Database;
          $pdo = Database::connection();
          $pdo->exec("UPDATE ai_feature_flags SET enabled=1, rollout_percentage=100 WHERE feature_name IN ('ai_screenshot_extraction','ai_trade_analysis','ai_weekly_report')");
          $pdo->exec("UPDATE ai_feature_flags SET enabled=0, rollout_percentage=0 WHERE feature_name='ai_assistant'");
          $stmt = $pdo->query('SELECT feature_name, enabled, rollout_percentage FROM ai_feature_flags ORDER BY feature_name');
          $flags = $stmt->fetchAll(PDO::FETCH_ASSOC);
          header('Content-Type: application/json; charset=utf-8');
          echo json_encode(['flags'=>$flags], JSON_UNESCAPED_SLASHES);
          '''
          open('/tmp/probe.php','w',encoding='utf-8').write(template.replace('__HASH__', os.environ['HASH']))
          PY

          cleanup() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; rm -f public_html/staging.veloratrade.ir/public/$NAME; bye" >/dev/null 2>&1 || true
            rm -f /tmp/probe.php /tmp/status.json
          }
          trap cleanup EXIT

          uploaded=0
          for attempt in $(seq 1 15); do
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; glob -a rm -f public_html/staging.veloratrade.ir/public/_velora_ai_flag_*.php; put /tmp/probe.php -o public_html/staging.veloratrade.ir/public/$NAME; bye"; then
              uploaded=1; break
            fi
            sleep 5
          done
          [ "$uploaded" = 1 ] || { echo "::error::upload failed"; exit 1; }

          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 40 -H "X-Velora-Diag: $TOKEN" "$BASE/public/$NAME")
          [ "$code" = 200 ] || { echo "::error::HTTP $code"; cat /tmp/status.json; exit 1; }

          python3 <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('/tmp/status.json').read_text())
          print("=== AI Feature Flags ===")
          for flag in data.get('flags',[]):
              print(f"  {flag['feature_name']}: enabled={flag['enabled']} rollout={flag['rollout_percentage']}")
          # Verify
          flags={f['feature_name']: f for f in data.get('flags',[])}
          assert flags.get('ai_screenshot_extraction',{}).get('enabled')==1, "extraction should be enabled"
          assert flags.get('ai_trade_analysis',{}).get('enabled')==1, "analysis should be enabled"
          assert flags.get('ai_weekly_report',{}).get('enabled')==1, "weekly_report should be enabled"
          assert flags.get('ai_assistant',{}).get('enabled')==0, "assistant should be disabled"
          print("PASS: Feature flags enabled correctly")
          PY
