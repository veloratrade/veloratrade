# نگهبان CSP و اطلاعات حساس
#
# جلوی همان فاجعه‌ای را می‌گیرد که سایت را ۵۰۳ کرد:
# اگر HTML عوض شود ولی منیفست بازتولید نشده باشد، merge مسدود می‌شود.
#
# توجه: lint مربوط به PHP و Python در ci.yml موجود انجام می‌شود؛
# اینجا تکرار نشده است.

name: CSP Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# یک اجرا در هر ref کافی است؛ push جدید بررسی‌های قدیمی را لغو می‌کند.
# این workflow یک check است (نه انتشار)، پس لغو امن است.
#
# ⚠️ ایمنی انتشار: این فایل به‌صورت workflow_call داخل deploy.yml و
# deploy-staging.yml هم صدا زده می‌شود. کلید گروه شامل github.workflow
# است؛ هنگام فراخوانی از یک deploy، github.workflow به نام workflow
# فراخوان (مثلاً «Deploy Production») تبدیل می‌شود و گروهی جدا از اجرای
# مستقل push/PR می‌سازد. بنابراین یک push معمولی هرگز نمی‌تواند گارد CSP
# در حال اجرا داخل یک انتشار Production را لغو کند.
concurrency:
  group: csp-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-csp:
    name: تطابق منیفست با صفحات
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: تنظیم Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب parser قطعی CSP
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4==4.15.0

      - name: بررسی deterministic سازگاری CSP
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/localization/build_csp_artifacts.py --check

  secret-scan:
    name: جلوگیری از نشت اطلاعات حساس
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: فایل‌های ممنوعه
        run: |
          bad=$(find . -path ./.git -prune -o \
                 \( -name '.env' -o -name '*.sqlite' -o -name '*.sqlite3' \
                    -o -name 'id_rsa' -o -name '*.pem' -o -name '*.key' \) -print)
          if [ -n "$bad" ]; then
            echo "::error::فایل حساس در مخزن:"; echo "$bad"; exit 1
          fi
          echo "✅ فایل حساسی نیست"

      - name: داده واقعی کاربران در فایل‌های SQL
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          # داده واقعی کاربران نباید در مخزن باشد، حتی خصوصی.
          # بکاپ واقعی جای دیگری نگهداری شود.
          PUBLIC_MAIL = ('gmail.com','yahoo.com','outlook.com','hotmail.com',
                         'icloud.com','proton.me','protonmail.com','live.com')
          bad = []
          for p in list(pathlib.Path('.').rglob('*.sql')) + list(pathlib.Path('.').rglob('*.dump')):
              if '.git' in p.parts:
                  continue
              t = p.read_text(encoding='utf-8', errors='replace')
              h = len(re.findall(r'\$2[aby]\$\d{2}\$', t))
              m = {e for e in re.findall(r'[\w.%-]+@[\w.-]+\.[a-z]{2,}', t, re.I)
                   if e.split('@')[1].lower() in PUBLIC_MAIL}
              if h or m:
                  bad.append((p, h, len(m)))
          if bad:
              print('::error::داده واقعی کاربران در مخزن عمومی')
              for p, h, m in bad:
                  print(f'  {p}: {h} هش رمز، {m} ایمیل واقعی')
              print('\nراه حل: فایل را با داده ساختگی جایگزین کنید.')
              sys.exit(1)
          print('✅ داده واقعی کاربری پیدا نشد')
          PY
