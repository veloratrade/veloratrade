name: Velora DB Backup → Private Repository (connectivity + dry-run; real backup gated)

# ============================================================================
# Connects veloratrade/veloratrade (public) to veloratrade/velora-backups (PRIVATE).
#
# SECURITY MODEL (read this before editing):
#   * Trigger is workflow_dispatch ONLY. There is NO pull_request / push / fork
#     trigger, so untrusted or fork code can never run this job or see the credential.
#   * The repository target is HARD-CODED in code (private_backup_repo.PRIVATE_BACKUP_REPO
#     = veloratrade/velora-backups). No workflow input can change the repository/owner.
#   * Inputs are passed to Python ONLY via environment variables (never interpolated
#     into a shell heredoc), so an input can never inject shell or SQL. `environment`
#     is a fixed choice list; `commit_sha` is validated as 40-char hex.
#   * Credential is the single secret BACKUP_REPO_TOKEN (the owner-approved existing
#     fine-grained PAT). It is masked, never echoed, never written to logs/artifacts,
#     and used only for the backup-repo API calls. Missing => fail closed.
#   * Production routes through the protected GitHub `production` environment, so
#     production stays approval-gated even for read-only connectivity.
#   * This build is READ-ONLY/DRY-RUN: do_real_backup=true is refused; no dump is
#     created, no release/asset/metadata is written, nothing is deleted.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "TARGET (explicit): staging OR production"
        required: true
        type: choice
        options: [staging, production]
      mode:
        description: "connectivity (read-only) | dry-run (lifecycle, no write)"
        required: true
        type: choice
        options: [connectivity, dry-run]
        default: connectivity
      commit_sha:
        description: "App commit this backup is bound to (40-char hex; for metadata)"
        required: false
        default: ""
      do_real_backup:
        description: "Must stay false in this phase — real backups are disabled"
        required: true
        type: boolean
        default: false

# Read-only job permissions; the backup token is a separate secret, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: velora-backup-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard — explicit env + credential present + no injection
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.g.outputs.environment }}
    env:
      # inputs via ENV (never ${{ }} inside shell) to prevent shell/SQL injection
      VOP_ENV: ${{ github.event.inputs.environment }}
      VOP_MODE: ${{ github.event.inputs.mode }}
      VOP_REAL: ${{ github.event.inputs.do_real_backup }}
      VOP_SHA: ${{ github.event.inputs.commit_sha }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - id: g
        run: |
          set -euo pipefail
          # extra mask (GitHub masks secrets automatically; this is belt-and-braces)
          [ -n "${BACKUP_REPO_TOKEN:-}" ] && echo "::add-mask::${BACKUP_REPO_TOKEN}"
          [[ "$VOP_ENV" == "staging" || "$VOP_ENV" == "production" ]] || { echo "::error::environment must be staging|production"; exit 1; }
          [[ "$VOP_MODE" == "connectivity" || "$VOP_MODE" == "dry-run" ]] || { echo "::error::bad mode"; exit 1; }
          if [[ "$VOP_REAL" == "true" ]]; then
            echo "::error::Real backup creation is DISABLED in this build."
            exit 2
          fi
          # commit_sha is optional but, if given, must be exactly 40 hex chars (no injection)
          if [ -n "$VOP_SHA" ]; then
            [[ "$VOP_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::commit_sha must be a 40-char hex SHA"; exit 1; }
          fi
          [ -n "${BACKUP_REPO_TOKEN:-}" ] || { echo "::error::BACKUP_REPO_TOKEN is required but not currently available to the workflow."; exit 1; }
          echo "environment=$VOP_ENV" >> "$GITHUB_OUTPUT"
          echo "guard OK: env=$VOP_ENV mode=$VOP_MODE real=refused (no backup will be created)"

  connect:
    name: ${{ needs.guard.outputs.env }} — private repo integrity + dry-run
    needs: guard
    runs-on: ubuntu-latest
    # Production routes through the protected GitHub environment (required reviewers).
    environment: ${{ needs.guard.outputs.env == 'production' && 'production' || '' }}
    env:
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      BACKUP_TARGET_ENV: ${{ needs.guard.outputs.env }}
      BACKUP_COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
      GITHUB_API_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask credential
        run: |
          set -euo pipefail
          [ -n "${BACKUP_REPO_TOKEN:-}" ] && echo "::add-mask::${BACKUP_REPO_TOKEN}"
          echo "token masked; length check only (value never printed)."

      - name: "Repository integrity check (read-only: identity, privacy, counts)"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "ops/velora-mgmt")
          import private_backup_repo as pb
          import backup_repo_client as bc
          # hard-bound target constant; not derived from any input
          print("hard-bound target repository:", pb.PRIVATE_BACKUP_REPO)
          c = bc.Client()  # token from BACKUP_REPO_TOKEN env; never printed
          info = c.check_repository()      # fails closed: exists + exact owner/name + private
          assert info["full_name"] == "veloratrade/velora-backups", "unexpected repository target"
          assert info["private"] is True, "repository is not private"
          print("identity OK :", info["full_name"], "| private:", info["private"],
                "| default_branch:", info["default_branch"])
          for env in ("staging", "production"):
              rels = c.list_backups(env)
              print(f"existing {env} backup releases: {len(rels)}")
          print("READ-ONLY: no release/asset/metadata created.")
          PY

      - name: Dry-run lifecycle (no dump / no upload / no deletion)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "ops/velora-mgmt")
          import backup_repo_client as bc, backup_lifecycle as bl
          # No dump bytes are supplied => the lifecycle must report BLOCKED (never fabricate).
          # A stub transport returning empty lists means NO network writes occur here.
          c = bc.Client(transport=lambda *a, **k: {"status": 200, "json": []})
          sha = os.environ.get("BACKUP_COMMIT_SHA") or os.environ.get("GITHUB_API_SHA", "")
          sha = sha.strip()
          req = bl.LifecycleRequest(
              environment=os.environ["BACKUP_TARGET_ENV"], operation="migrate",
              commit_sha=sha or "0"*40, workflow_run_id=os.environ.get("GITHUB_RUN_ID", "0"),
              plan_hash="dry-run-" + "0"*58, migrations=["v1.0", "v1.1"],
              approval_token=None, dump_bytes=None, dry_run=True)
          out = bl.run_backup_lifecycle(c, req)
          print("dry-run status:", out["status"], "at:", out.get("stopped_at"))
          assert out["status"] == bl.BLOCKED, "expected BLOCKED when no dump supplied"
          assert out.get("backups_deleted", []) == [], "must never delete in dry-run"
          print("OK: lifecycle refuses to fabricate a backup; no uploads/deletions.")
          PY
