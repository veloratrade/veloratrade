# VELORA — Smoke Suite استیجینگ (wrapper نازک)
#
# منطق بررسی اینجا نیست: تنها محل منطق مشترک `healthcheck-suite.yml`
# است. این فایل فقط دامنه و پرچم‌ها را تعیین می‌کند تا بین محیط‌ها
# شکاف ایجاد نشود.
#
# استیجینگ جای امن اجرای probe نوشتاری است (تست گارد same-origin روی
# دیتابیس مستقل و بدون داده واقعی کاربران) — به همین دلیل
# write_probes=true است. هیچ داده تولیدی در معرض نیست.
#
# اجرا: Actions → "Health Check (Staging)" → Run workflow
# مرجع: docs/README.md §4 RB-3

name: Health Check (Staging)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthcheck-staging
  cancel-in-progress: false

jobs:
  smoke:
    name: RB-3 روی استیجینگ
    uses: ./.github/workflows/healthcheck-suite.yml
    with:
      base_url: https://staging.veloratrade.ir
      environment_name: staging
      write_probes: true
