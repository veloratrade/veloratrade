name: Resend Message Status (Diagnostic)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'برای خواندن وضعیت Resend، READ را وارد کنید'
        required: true
        default: ''
      message_ids:
        description: 'Comma-separated Resend message UUIDs (max 20)'
        required: true
        default: ''

permissions: {}

concurrency:
  group: resend-message-status
  cancel-in-progress: false

jobs:
  status:
    name: read-only provider delivery status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
      MESSAGE_IDS: ${{ inputs.message_ids }}
    steps:
      - name: Query safe provider status fields
        run: |
          set -euo pipefail
          [ "$INPUT_CONFIRM" = "READ" ] || { echo "::error::confirm باید READ باشد"; exit 1; }
          [ -n "$RESEND_API_KEY" ] || { echo "::error::RESEND_API_KEY خالی است"; exit 1; }
          echo "::add-mask::$RESEND_API_KEY"
          python3 <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          ids=[x.strip() for x in os.environ['MESSAGE_IDS'].split(',') if x.strip()]
          uuid=re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$',re.I)
          if not ids or len(ids)>20 or any(not uuid.fullmatch(x) for x in ids):
              raise SystemExit('::error::message_ids invalid')
          headers={'Authorization':'Bearer '+os.environ['RESEND_API_KEY'],'Accept':'application/json','User-Agent':'VELORA-Resend-Status/1.0'}
          results={}
          for attempt in range(1,19):
              for mid in ids:
                  if results.get(mid) in {'delivered','bounced','complained','failed','canceled'}:continue
                  req=urllib.request.Request('https://api.resend.com/emails/'+mid,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:data=json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      results[mid]='http_'+str(e.code);continue
                  results[mid]=str(data.get('last_event') or data.get('status') or 'unknown').lower()
              if all(v in {'delivered','bounced','complained','failed','canceled'} for v in results.values()):break
              time.sleep(10)
          terminal_bad={'bounced','complained','failed','canceled'}
          for mid in ids:print('MESSAGE',mid,'EVENT',results.get(mid,'unknown'))
          delivered=sum(v=='delivered' for v in results.values())
          print(f'RESEND_DELIVERED={delivered}/{len(ids)}')
          if any(v in terminal_bad for v in results.values()):raise SystemExit('::error::one or more messages failed at provider')
          if delivered!=len(ids):raise SystemExit('::error::one or more messages did not reach delivered state')
          PY
