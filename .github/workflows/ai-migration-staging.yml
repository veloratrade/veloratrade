name: AI Migration Verification (Staging)

# Verifies and applies AI foundation migrations v0.4-v0.8 on staging only
# Uses one-use PHP probe pattern like email-status-staging.yml — no secrets in logs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: check or apply'
        required: true
        default: 'check'
      confirm:
        description: 'Type APPLY-AI-MIGRATION to confirm apply mode'
        required: false
        default: ''

permissions: {}

concurrency:
  group: ai-migration-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: AI migration check/apply on staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      BASE: https://staging.veloratrade.ir
      INPUT_MODE: ${{ github.event.inputs.mode }}
      INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - name: Create, upload, execute, and remove one-use probe
        run: |
          set -euo pipefail
          if [ "$INPUT_MODE" = "apply" ]; then
            [ "$INPUT_CONFIRM" = "APPLY-AI-MIGRATION" ] || { echo "::error::For apply mode, confirm must be APPLY-AI-MIGRATION"; exit 1; }
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -q lftp >/dev/null
          NAME="_velora_ai_mig_$(openssl rand -hex 8).php"
          TOKEN="$(openssl rand -hex 32)"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$NAME"; echo "::add-mask::$TOKEN"; echo "::add-mask::$HASH"
          export NAME TOKEN HASH

          python3 <<'PY'
          import os
          template = r'''<?php
          declare(strict_types=1);
          $expected = '__HASH__';
          $provided = (string) ($_SERVER['HTTP_X_VELORA_DIAG'] ?? '');
          if ($provided === '' || !hash_equals($expected, hash('sha256', $provided))) {
              http_response_code(404); exit('Not found');
          }
          @unlink(__FILE__);
          require dirname(__DIR__) . '/api/src/bootstrap.php';
          use Velora\Core\Database;

          function tableExists(PDO $pdo, string $table): bool {
              $driver = $pdo->getAttribute(PDO::ATTR_DRIVER_NAME);
              if ($driver === 'sqlite') {
                  $stmt = $pdo->prepare("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name=:table");
                  $stmt->execute(['table'=>$table]);
                  return (int)$stmt->fetchColumn()===1;
              }
              $stmt = $pdo->prepare('SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=:table');
              $stmt->execute(['table'=>$table]);
              return (int)$stmt->fetchColumn()===1;
          }

          function columnExists(PDO $pdo, string $table, string $column): bool {
              $driver = $pdo->getAttribute(PDO::ATTR_DRIVER_NAME);
              if ($driver === 'sqlite') {
                  try {
                      $pdo->query("SELECT $column FROM $table LIMIT 1");
                      return true;
                  } catch (Throwable $e) { return false; }
              }
              $stmt = $pdo->prepare('SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=:table AND COLUMN_NAME=:column');
              $stmt->execute(['table'=>$table,'column'=>$column]);
              return (int)$stmt->fetchColumn()===1;
          }

          $pdo = Database::connection();
          $mode = '__MODE__'; // check or apply
          $expectedTables = ['ai_extractions','ai_provider_quotas','ai_provider_logs','ai_requests','ai_feature_flags','ai_audit_logs','ai_feedback','ai_jobs','ai_reports','ai_analysis'];

          $result = ['mode'=>$mode, 'tables'=>[], 'users_ai_consent_at'=>false, 'feature_flags'=>[]];

          foreach ($expectedTables as $t) {
              $result['tables'][$t] = tableExists($pdo, $t);
          }
          $result['users_ai_consent_at'] = columnExists($pdo, 'users', 'ai_consent_at');

          if ($mode === 'check') {
              // Read feature flags
              try {
                  if (tableExists($pdo, 'ai_feature_flags')) {
                      $stmt = $pdo->query('SELECT feature_name, enabled, rollout_percentage FROM ai_feature_flags ORDER BY feature_name');
                      $result['feature_flags'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
                  }
              } catch (Throwable $e) {}
              // Sanitized read-only evidence for the existing E2E window.
              $start = '2026-08-28 22:50:00';
              $end = '2026-08-28 23:00:00';
              $result['provider_logs'] = [];
              $result['extractions'] = [];
              $result['requests'] = [];
              try {
                  $stmt = $pdo->prepare('SELECT provider, status, error_code, latency_ms, created_at FROM ai_provider_logs WHERE provider=:provider AND created_at >= :start AND created_at < :end ORDER BY id ASC');
                  $stmt->execute(['provider'=>'gemini','start'=>$start,'end'=>$end]);
                  $result['provider_logs'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
              } catch (Throwable $e) {}
              try {
                  $stmt = $pdo->prepare('SELECT status, error_code, confidence, created_at FROM ai_extractions WHERE created_at >= :start AND created_at < :end ORDER BY id ASC');
                  $stmt->execute(['start'=>$start,'end'=>$end]);
                  $result['extractions'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
              } catch (Throwable $e) {}
              try {
                  $stmt = $pdo->prepare('SELECT provider, status, latency_ms, created_at FROM ai_requests WHERE provider=:provider AND created_at >= :start AND created_at < :end ORDER BY id ASC');
                  $stmt->execute(['provider'=>'gemini','start'=>$start,'end'=>$end]);
                  $result['requests'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
              } catch (Throwable $e) {}
              header('Content-Type: application/json; charset=utf-8');
              header('Cache-Control: no-store');
              echo json_encode($result, JSON_UNESCAPED_SLASHES);
              exit(0);
          }

          // Apply mode — execute migrations v0.4-v0.8 inline (SQL files not deployed to staging per guard)
          $applied = [];
          $errors = [];

          // v0.4
          if (!$result['tables']['ai_extractions'] || !$result['tables']['ai_provider_quotas'] || !$result['tables']['ai_provider_logs']) {
              try {
                  $pdo->exec("
                  CREATE TABLE IF NOT EXISTS ai_extractions (
                      id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                      user_id BIGINT UNSIGNED NOT NULL,
                      provider VARCHAR(32) NOT NULL DEFAULT 'gemini',
                      image_hash CHAR(64) NOT NULL,
                      original_result JSON NULL,
                      final_result JSON NULL,
                      confidence FLOAT NOT NULL DEFAULT 0.0,
                      latency_ms INT UNSIGNED NOT NULL DEFAULT 0,
                      status ENUM('success','fallback','failed') NOT NULL DEFAULT 'success',
                      error_code VARCHAR(64) NULL,
                      created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                      PRIMARY KEY (id),
                      KEY idx_ai_extractions_user (user_id),
                      KEY idx_ai_extractions_hash (image_hash),
                      KEY idx_ai_extractions_provider (provider),
                      KEY idx_ai_extractions_status (status),
                      KEY idx_ai_extractions_created (created_at),
                      CONSTRAINT fk_ai_extractions_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE
                  ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
                  ");
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_provider_quotas (provider VARCHAR(32) NOT NULL, daily_used INT UNSIGNED NOT NULL DEFAULT 0, quota_limit INT UNSIGNED NOT NULL DEFAULT 1500, reset_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, PRIMARY KEY (provider)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_provider_logs (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, provider VARCHAR(32) NOT NULL, status ENUM('success','failed','quota_exhausted','timeout') NOT NULL, latency_ms INT UNSIGNED NOT NULL DEFAULT 0, error_code VARCHAR(64) NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_provider_logs_provider (provider), KEY idx_provider_logs_status (status), KEY idx_provider_logs_created (created_at)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("INSERT INTO ai_provider_quotas (provider, quota_limit) VALUES ('gemini', 1500), ('tesseract', 100000) ON DUPLICATE KEY UPDATE quota_limit = VALUES(quota_limit);");
                  $applied[] = 'v0.4';
              } catch (Throwable $e) { $errors[] = 'v0.4:'.$e->getMessage(); }
          }

          // v0.5
          if (!$result['tables']['ai_requests'] || !$result['tables']['ai_feature_flags'] || !$result['tables']['ai_audit_logs'] || !$result['tables']['ai_feedback']) {
              try {
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_requests (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, user_id BIGINT UNSIGNED NOT NULL, feature VARCHAR(32) NOT NULL DEFAULT 'extraction', provider VARCHAR(32) NOT NULL DEFAULT 'gemini', model VARCHAR(64) NOT NULL DEFAULT 'gemini-1.5-flash', prompt_hash CHAR(64) NOT NULL, tokens_used INT UNSIGNED NOT NULL DEFAULT 0, latency_ms INT UNSIGNED NOT NULL DEFAULT 0, status ENUM('success','failed','quota_exhausted','timeout') NOT NULL DEFAULT 'success', cost DECIMAL(10,6) NOT NULL DEFAULT 0.000000, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_ai_requests_user (user_id), KEY idx_ai_requests_feature (feature), KEY idx_ai_requests_provider (provider), KEY idx_ai_requests_status (status), KEY idx_ai_requests_created (created_at), KEY idx_ai_requests_prompt_hash (prompt_hash), CONSTRAINT fk_ai_requests_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_feature_flags (feature_name VARCHAR(64) NOT NULL, enabled TINYINT(1) NOT NULL DEFAULT 0, rollout_percentage TINYINT UNSIGNED NOT NULL DEFAULT 0, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, PRIMARY KEY (feature_name)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_audit_logs (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, user_id BIGINT UNSIGNED NOT NULL, feature VARCHAR(32) NOT NULL DEFAULT 'extraction', provider VARCHAR(32) NOT NULL DEFAULT 'gemini', image_hash CHAR(64) NOT NULL, action VARCHAR(32) NOT NULL DEFAULT 'extraction', created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_ai_audit_user (user_id), KEY idx_ai_audit_feature (feature), KEY idx_ai_audit_provider (provider), KEY idx_ai_audit_hash (image_hash), KEY idx_ai_audit_created (created_at), CONSTRAINT fk_ai_audit_user_v06 FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_feedback (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, user_id BIGINT UNSIGNED NOT NULL, extraction_id BIGINT UNSIGNED NULL, original_result JSON NULL, corrected_result JSON NULL, changed_fields JSON NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_ai_feedback_user (user_id), KEY idx_ai_feedback_extraction (extraction_id), KEY idx_ai_feedback_created (created_at), CONSTRAINT fk_ai_feedback_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE, CONSTRAINT fk_ai_feedback_extraction FOREIGN KEY (extraction_id) REFERENCES ai_extractions (id) ON DELETE SET NULL) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("INSERT INTO ai_feature_flags (feature_name, enabled, rollout_percentage) VALUES ('ai_screenshot_extraction',1,100), ('ai_trade_analysis',0,0), ('ai_weekly_report',0,0), ('ai_assistant',0,0), ('ai_recommendations',0,0), ('ai_risk_analysis',0,0) ON DUPLICATE KEY UPDATE enabled=VALUES(enabled), rollout_percentage=VALUES(rollout_percentage);");
                  $applied[] = 'v0.5';
              } catch (Throwable $e) { $errors[] = 'v0.5:'.$e->getMessage(); }
          }

          // v0.6
          if (!$result['users_ai_consent_at']) {
              try {
                  $pdo->exec("ALTER TABLE users ADD COLUMN ai_consent_at DATETIME NULL COMMENT 'when user consented to external AI processing'");
                  $applied[] = 'v0.6';
              } catch (Throwable $e) {
                  // If column exists, ignore
                  if (stripos($e->getMessage(), 'Duplicate column') === false) {
                      $errors[] = 'v0.6:'.$e->getMessage();
                  } else {
                      $applied[] = 'v0.6 (already exists)';
                  }
              }
          }

          // v0.7
          if (!$result['tables']['ai_jobs']) {
              try {
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_jobs (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, user_id BIGINT UNSIGNED NOT NULL, job_type VARCHAR(32) NOT NULL, payload JSON NOT NULL, status ENUM('pending','processing','completed','failed') NOT NULL DEFAULT 'pending', attempts TINYINT UNSIGNED NOT NULL DEFAULT 0, available_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_ai_jobs_user (user_id), KEY idx_ai_jobs_type (job_type), KEY idx_ai_jobs_status (status), KEY idx_ai_jobs_available (available_at), KEY idx_ai_jobs_created (created_at), KEY idx_ai_jobs_status_available (status, available_at), CONSTRAINT fk_ai_jobs_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $applied[] = 'v0.7';
              } catch (Throwable $e) { $errors[] = 'v0.7:'.$e->getMessage(); }
          }

          // v0.8
          if (!$result['tables']['ai_reports'] || !$result['tables']['ai_analysis']) {
              try {
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_reports (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, user_id BIGINT UNSIGNED NOT NULL, period_start DATE NOT NULL, period_end DATE NOT NULL, locale VARCHAR(10) NOT NULL DEFAULT 'en', content JSON NOT NULL, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_ai_reports_user (user_id), KEY idx_ai_reports_period (period_start, period_end), KEY idx_ai_reports_locale (locale), KEY idx_ai_reports_created (created_at), UNIQUE KEY uq_ai_reports_user_period_locale (user_id, period_start, period_end, locale), CONSTRAINT fk_ai_reports_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $pdo->exec("CREATE TABLE IF NOT EXISTS ai_analysis (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT, user_id BIGINT UNSIGNED NOT NULL, provider VARCHAR(32) NOT NULL DEFAULT 'gemini', model VARCHAR(64) NOT NULL DEFAULT 'gemini-1.5-flash', result_json JSON NOT NULL, confidence FLOAT NOT NULL DEFAULT 0.0, created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (id), KEY idx_ai_analysis_user (user_id), KEY idx_ai_analysis_created (created_at), CONSTRAINT fk_ai_analysis_user FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;");
                  $applied[] = 'v0.8';
              } catch (Throwable $e) { $errors[] = 'v0.8:'.$e->getMessage(); }
          }

          if ($errors) { $result['error'] = implode('; ', $errors); }

          // Re-check after apply
          foreach ($expectedTables as $t) {
              $result['tables'][$t] = tableExists($pdo, $t);
          }
          $result['users_ai_consent_at'] = columnExists($pdo, 'users', 'ai_consent_at');
          $result['applied'] = $applied;

          try {
              if (tableExists($pdo, 'ai_feature_flags')) {
                  $stmt = $pdo->query('SELECT feature_name, enabled, rollout_percentage FROM ai_feature_flags ORDER BY feature_name');
                  $result['feature_flags'] = $stmt->fetchAll(PDO::FETCH_ASSOC);
              }
          } catch (Throwable $e) {}

          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          echo json_encode($result, JSON_UNESCAPED_SLASHES);
          '''
          open('/tmp/probe.php','w',encoding='utf-8').write(template.replace('__HASH__', os.environ['HASH']).replace('__MODE__', os.environ['INPUT_MODE']))
          PY

          cleanup() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; rm -f public_html/staging.veloratrade.ir/public/$NAME; bye" >/dev/null 2>&1 || true
            shred -u /tmp/probe.php /tmp/status.json 2>/dev/null || rm -f /tmp/probe.php /tmp/status.json
          }
          trap cleanup EXIT

          uploaded=0
          for attempt in $(seq 1 15); do
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; glob -a rm -f public_html/staging.veloratrade.ir/public/_velora_ai_mig_*.php; put /tmp/probe.php -o public_html/staging.veloratrade.ir/public/$NAME; bye"; then
              uploaded=1; break
            fi
            sleep 5
          done
          [ "$uploaded" = 1 ] || { echo "::error::probe upload failed"; exit 1; }

          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 40 -H "X-Velora-Diag: $TOKEN" "$BASE/public/$NAME")
          [ "$code" = 200 ] || { echo "::error::probe HTTP $code"; cat /tmp/status.json; exit 1; }

          python3 <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('/tmp/status.json').read_text())
          print("=== AI Migration Verification ===")
          print(f"Mode: {data.get('mode')}")
          tables=data.get('tables',{})
          for t, exists in tables.items():
              print(f"  Table {t}: {'EXISTS' if exists else 'MISSING'}")
          print(f"users.ai_consent_at: {'EXISTS' if data.get('users_ai_consent_at') else 'MISSING'}")
          print("Feature flags:")
          for flag in data.get('feature_flags',[]):
              print(f"  {flag.get('feature_name')}: enabled={flag.get('enabled')} rollout={flag.get('rollout_percentage')}")
          if 'applied' in data:
              print(f"Applied migrations: {data.get('applied')}")
          if 'error' in data:
              print(f"Error: {data.get('error')}")
          # Determine pass/fail
          missing = [t for t, exists in tables.items() if not exists]
          if not data.get('users_ai_consent_at'):
              missing.append('users.ai_consent_at')
          if missing:
              print(f"FAIL: Missing {missing}")
          else:
              print("PASS: All AI tables exist")
          PY
