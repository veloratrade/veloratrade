# انتشار روی Production — دستی، allow-list، با بکاپ و گارد
#
# ── تغییرات ۲۰۲۶-۰۸-۱۷ (بازنویسی کامل) ─────────────────────────────
#   ✓ allow-list به‌جای deny-list (Structure.pdf §6 — بستهٔ allowlisted)
#   ✓ مقصد hardcode: public_html/  (C-2 — غیرقابل‌مذاکره)
#   ✓ lftp + ftp ساده + --continue + retry×12  (OC-2)
#   ✓ بکاپ کامل docroot پیش از هر نوشتن  (RB-6 / R-3)
#   ✓ ۱۱ گارد پیش از آپلود
#   ✓ گارد تأیید مالک: CONFIRM-PRODUCTION-DEPLOY
#   ✗ تریگر push حذف شده (OC-9)
#   ✗ FTP-Deploy-Action و protocol ftps کنار گذاشته شدند (OC-2)
#
# ── سیاست تک‌اکانتی (تصمیم مالک) ───────────────────────────────────
# استیجینگ و تولید از یک اکانت FTP (piknet) استفاده می‌کنند. هیچ مانع
# فنی بین دو محیط نیست؛ تنها کنترل مؤثر، تأیید انسانی مالک است.
# به همین دلیل مقصد mirror در همین فایل hardcode شده و هرگز نباید به
# ورودی dispatch یا متغیر تبدیل شود.
#
# پیش‌نیاز Secrets (هنوز تعریف نشده‌اند — عمدی):
#   FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
#
# مرجع: docs/README.md §3 (ماتریس FTP، سیاست تک‌اکانتی)، §4 RB-6، §7

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'برای انتشار روی سایت زنده دقیقاً بنویسید: CONFIRM-PRODUCTION-DEPLOY'
        required: true
        default: ''
        type: string
      dry_run:
        description: 'اجرای آزمایشی — فقط فهرست می‌کند، هیچ فایلی نوشته نمی‌شود'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # آپلود نیمه‌کاره خطرناک است

env:
  # ⚠️ C-2 — مقصد hardcode. هرگز پارامتری نشود.
  PROD_DOCROOT: public_html/

jobs:
  # ── ۱. گارد تأیید ──────────────────────────────────────────────
  gate:
    name: گارد تأیید مالک
    if: github.repository == 'veloratrade/veloratrade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: بررسی عبارت تأیید
        run: |
          if [ "${{ inputs.confirm_production_deploy }}" != "CONFIRM-PRODUCTION-DEPLOY" ]; then
            echo "::error::عبارت تأیید نادرست است — انتشار متوقف شد. هیچ اتصالی برقرار نشد."
            exit 1
          fi
          echo "✅ تأیید مالک دریافت شد."
          echo "مقصد: \`${{ env.PROD_DOCROOT }}\` (hardcode)" >> $GITHUB_STEP_SUMMARY

  # ── ۲. گیت استیجینگ: تولید فقط وقتی استیجینگ سبز است ───────────
  staging_gate:
    name: راستی‌آزمایی استیجینگ (پیش‌شرط تولید)
    needs: gate
    uses: ./.github/workflows/healthcheck-suite.yml
    with:
      base_url: https://staging.veloratrade.ir
      environment_name: staging
      write_probes: false

  # ── ۲٫۵ پایهٔ مقایسهٔ گیت آرشیو: در dispatch رویدادِ base طبیعی ندارد ──
  deploy_base:
    name: تعیین SHA پایهٔ مقایسه (والد ریف انتخابی)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.parent.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: والد کامیت انتخاب‌شده (SHA پایهٔ diff)
        id: parent
        run: |
          set -euo pipefail
          # Fail closed: پایهٔ مقایسه باید همیشه قابل‌تعیین باشد.
          BASE_SHA="$(git rev-parse --verify 'HEAD^1^{commit}')"
          if [ -z "$BASE_SHA" ]; then
            echo "::error::BASE_SHA is empty; cannot determine changed-file set"
            exit 1
          fi
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

  # ── ۳. گیت دائمی کیفیت (Phase 3.2): Auth/Email/Security/Localization ──
  quality_gate:
    name: گیت دائمی کیفیت — پیش‌شرط انتشار
    needs: [staging_gate, deploy_base]
    uses: ./.github/workflows/quality-gate.yml
    with:
      # در workflow_dispatch هیچ base طبیعی وجود ندارد (event.before و PR base
      # خالی‌اند) → والد SHA انتخابی صریح پاس می‌شود؛ gate-archive fail-closed می‌ماند.
      base_sha: ${{ needs.deploy_base.outputs.base_sha }}

  # ── ۴. گارد CSP ────────────────────────────────────────────────
  guard:
    name: بررسی سلامت قبل از انتشار
    needs: quality_gate
    uses: ./.github/workflows/csp-guard.yml

  # ── ۴٫۵ بکاپ تازهٔ دیتابیس Production (الزام دائمی قانون بکاپ) ──
  # یک workflow reusable است که تازه‌ترین بکاپ DB تولید را می‌سازد، در
  # مخزن PRIVATE velora-backups به‌صورت Release Asset ذخیره می‌کند، و
  # بایت‌به‌بایت راستی‌آزمایی می‌کند. اگر BACKUP_REPO_TOKEN نباشد یا
  # هر مرحله شکست بخورد، این job با خطا متوقف می‌شود و چون deploy به آن
  # needs دارد، انتشار Production هرگز اجرا نخواهد شد (fail-closed).
  prod_db_backup:
    name: بکاپ تازهٔ دیتابیس Production → مخزن خصوصی (الزامی برای استقرار واقعی)
    # در dry_run هیچ جهشی روی Production رخ نمی‌دهد؛ بنابراین بکاپ DB (و نیاز به
    # BACKUP_REPO_TOKEN) فقط برای استقرار واقعی الزامی است. در استقرار واقعی، شکست
    # این job ⇒ deploy اجرا نمی‌شود.
    if: ${{ !inputs.dry_run }}
    needs: [gate, guard]
    uses: ./.github/workflows/velora-db-backup.yml
    secrets: inherit
    outputs:
      backup_id: ${{ jobs.backup.outputs.backup_id }}
      release_tag: ${{ jobs.backup.outputs.release_tag }}
      sha256: ${{ jobs.backup.outputs.sha256 }}
      source_commit_sha: ${{ jobs.backup.outputs.source_commit_sha }}

  # ── ۴٫۶ گارد اتصال بکاپ تأییدشده به همین استقرار (binding gate) ──
  # تضمین می‌کند بکاپ: همین محیط (production)، همین run/commit، و دارای
  # وضعیت INTEGRITY_VERIFIED است. صرفِ «بکاپ گرفته‌ام» پذیرفته نیست؛
  # سامانه مستقلاً backup_id/sha/commit را بررسی می‌کند.
  prod_backup_gate:
    name: گارد اتصال بکاپ تأییدشده به استقرار
    needs: [guard, prod_db_backup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: اتصال و راستی‌آزمایی مستقل بکاپ در مخزن خصوصی (fail-closed)
        run: |
          set -euo pipefail
          # این گارد فقط خروجی‌های workflow بالا را باور نمی‌کند؛ مستقیماً مخزن
          # PRIVATE را دوباره می‌خواند و وجود/namespace/وضعیت/sha/commit بکاپ را
          # مستقل راستی‌آزمایی می‌کند. بدون BACKUP_REPO_TOKEN ⇒ fail closed
          # (هیچ fallback به GITHUB_TOKEN وجود ندارد).
          if [ -z "${BACKUP_REPO_TOKEN:-}" ]; then
            echo "::error::BACKUP_REPO_TOKEN برای راستی‌آزمایی مستقل بکاپ لازم است (fail closed)."
            exit 1
          fi
          echo "::add-mask::${BACKUP_REPO_TOKEN}"
          BID="${{ needs.prod_db_backup.outputs.backup_id }}"
          TAG="${{ needs.prod_db_backup.outputs.release_tag }}"
          SHA="${{ needs.prod_db_backup.outputs.sha256 }}"
          CMT="${{ needs.prod_db_backup.outputs.source_commit_sha }}"
          python3 ops/velora-mgmt/velora_prod_backup_gate.py \
            --backup-id "$BID" --release-tag "$TAG" --sha256 "$SHA" \
            --source-commit "$CMT" --expected-commit "$GITHUB_SHA"
          echo "✅ بکاپ تأییدشدهٔ Production مستقل راستی‌آزمایی و به این استقرار متصل شد: $BID"
          echo "| بکاپ دیتابیس Production | $BID | INTEGRITY_VERIFIED (re-verified) |" >> $GITHUB_STEP_SUMMARY

  # ── ۳. ساخت بسته + بکاپ + انتقال ───────────────────────────────
  deploy:
    name: آپلود روی هاست
    # وابستگیٔ سخت برای استقرار واقعی: بکاپ فایل (درون همین job) و بکاپ دیتابیس
    # تأییدشدهٔ متصل. در dry_run بکاپ DB اجرا نمی‌شود (هیچ جهشی روی Production رخ
    # نمی‌دهد)، بنابراین این job در حالت پیش‌نمایش با «فقط فهرست/بدون نوشتن» اجرا
    # می‌شود و در استقرار واقعی فقط وقتی پیش می‌رود که prod_backup_gate موفق باشد.
    # این if هرگز مسیر واقعی را تضعیف نمی‌کند: نگارش واقعی فایل همچنان پشت
    # !inputs.dry_run و موفقیت prod_backup_gate است.
    needs: [guard, prod_backup_gate]
    if: ${{ inputs.dry_run || needs.prod_backup_gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: ساخت بستهٔ تولید (allow-list)
        run: |
          set -euo pipefail
          DEST=production-build
          mkdir -p "$DEST"

          # --- ریشه ---
          cp locale-router.php 404.html "$DEST/"
          mkdir -p "$DEST/404" && cp 404/index.html "$DEST/404/"
          cp favicon.ico favicon-16.png favicon-32.png favicon-48.png \
             icon-192.png icon-512.png apple-icon.png manifest.json velora-logo.svg "$DEST/"
          mkdir -p "$DEST/checkout" && cp checkout/index.html "$DEST/checkout/"

          # --- .htaccess تولید: بدون تغییر (برخلاف استیجینگ) ---
          cp .htaccess "$DEST/.htaccess"

          # --- SEO تولید: ایندکس مجاز + sitemap + تأیید Search Console ---
          cp robots.txt "$DEST/robots.txt"
          cp sitemap.xml "$DEST/sitemap.xml"
          for g in google*.html; do [ -f "$g" ] && cp "$g" "$DEST/"; done

          # --- خروجی لوکال‌سازی (شامل .csp-release.json مخفی — OC-4) ---
          cp -a localized "$DEST/localized"

          # --- public منهای تشخیصی‌ها ---
          cp -a public "$DEST/public"
          rm -f  "$DEST/public/logout-diagnostic-v2.html"
          rm -rf "$DEST/public/samples"

          # --- api: فقط runtime ---
          mkdir -p "$DEST/api/public" "$DEST/api/config"
          cp api/.htaccess api/index.php "$DEST/api/"
          cp api/public/index.php "$DEST/api/public/"
          cp api/config/config.php "$DEST/api/config/"
          [ -f api/config/.htaccess ] && cp api/config/.htaccess "$DEST/api/config/" || true
          cp -a api/src     "$DEST/api/src"
          cp -a api/locales "$DEST/api/locales"
          cp -a api/workers "$DEST/api/workers"

          # --- حذف ۱۴ فایل دستهٔ «۱۷۹» (اسناد/بکاپ) ---
          find "$DEST" -name 'README-*.txt' -delete
          find "$DEST" -name '*backup*'     -delete
          find "$DEST" -name 'NOTICE.txt'   -delete

          echo "بسته ساخته شد: $(find "$DEST" -type f | wc -l) فایل"

      - name: گاردهای پیش از آپلود (۱۱ بررسی)
        run: |
          set -euo pipefail
          DEST=production-build
          fail=0
          chk(){ if [ "$2" = 0 ]; then echo "  ✅ $1"; else echo "::error::$1"; fail=1; fi; }

          chk "بدون فایل SQL"            "$(find $DEST -name '*.sql' | wc -l)"
          chk "بدون فایل env"            "$(find $DEST -name '*.env*' | wc -l)"
          chk "بدون sqlite/log/error_log" "$(find $DEST \( -name '*.sqlite*' -o -name '*.log' -o -name 'error_log' \) | wc -l)"
          chk "بدون اسکریپت نصب/تشخیص"   "$(find $DEST \( -name 'install.php' -o -name 'diag.php' -o -name 'env-check.php' -o -name 'init-sqlite.php' \) | wc -l)"
          chk "بدون اسکریپت تست/ایمیل"   "$(find $DEST \( -name 'mail-*.php' -o -name 'test-*.php' \) | wc -l)"
          chk "بدون PDF (B-6 Roadmap)"   "$(find $DEST -name '*.pdf' | wc -l)"
          chk "بدون docs/tools/_next"    "$(find $DEST \( -path '*/docs/*' -o -path '*/tools/*' -o -path '*/_next/*' \) | wc -l)"
          chk "بدون فایل backup"         "$(find $DEST -name '*backup*' | wc -l)"

          # بررسی‌های وجودی (باید موجود باشند)
          [ -f "$DEST/localized/.csp-release.json" ] && echo "  ✅ .csp-release.json موجود (OC-4)" || { echo "::error::.csp-release.json غایب"; fail=1; }
          [ -f "$DEST/sitemap.xml" ] && echo "  ✅ sitemap.xml موجود" || { echo "::error::sitemap.xml غایب"; fail=1; }

          # تولید نباید noindex بدهد و باید به velora_private (نه staging) اشاره کند
          if grep -q 'velora_private_staging' "$DEST/.htaccess"; then
            echo "::error::.htaccess به مسیر استیجینگ اشاره می‌کند!"; fail=1
          else echo "  ✅ .htaccess به velora_private تولید اشاره دارد"; fi
          if grep -q 'X-Robots-Tag' "$DEST/.htaccess"; then
            echo "::error::تولید نباید X-Robots-Tag noindex داشته باشد!"; fail=1
          fi

          n=$(find $DEST -type f | wc -l)
          echo "تعداد فایل بسته: $n"
          echo "| بسته تولید | $n فایل | همه گاردها سبز |" >> $GITHUB_STEP_SUMMARY
          [ "$fail" = 0 ] || { echo "انتشار متوقف شد."; exit 1; }

      - name: گارد provenance بسته (read-only)
        run: |
          set -euo pipefail
          DEST=production-build
          python3 - "$DEST" <<'PY'
          import json, pathlib, sys
          dest = pathlib.Path(sys.argv[1])
          pkg = json.loads((dest / "localized/.csp-release.json").read_text(encoding="utf-8"))
          repo = json.loads(pathlib.Path("localized/.csp-release.json").read_text(encoding="utf-8"))
          for k in ("releaseId", "commitSha", "sourceDigest", "releaseHtmlSha256", "cspManifestSha256"):
              if pkg.get(k) != repo.get(k):
                  raise SystemExit(f"بسته provenance با مخزن ناهماهنگ است: {k} pkg={pkg.get(k)} repo={repo.get(k)}")
          sha = pkg.get("commitSha")
          if not sha or not pkg.get("sourceDigest"):
              raise SystemExit("provenance (commitSha/sourceDigest) در بسته غایب است")
          print(f"✅ provenance بسته تأیید شد: releaseId={pkg.get('releaseId')} commitSha={sha[:12]}")
          PY

      - name: بکاپ docroot فعلی پیش از هر نوشتن (RB-6)
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          sudo apt-get install -y -q lftp > /dev/null
          mkdir -p backup/docroot
          # دانلود وضعیت فعلی تولید (فقط خواندن — هیچ نوشتنی)
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP || true
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:timeout 30
          set ftp:passive-mode on
          # public_html شامل docroot مستقل Staging به‌صورت nested است؛ آن محیط
          # بخشی از Production backup نیست و دانلودش هم بکاپ را بسیار کند می‌کند.
          mirror --continue --no-perms --parallel=1 \
                 --exclude-glob staging.veloratrade.ir/ \
                 --exclude-glob staging.veloratrade.ir/** \
                 ${{ env.PROD_DOCROOT }} backup/docroot/
          bye
          LFTP
          n=$(find backup/docroot -type f | wc -l)
          echo "بکاپ: $n فایل"
          if [ "$n" = 0 ]; then
            echo "::error::بکاپ خالی است — انتشار متوقف شد تا مسیر بازگشت تضمین شود."
            exit 1
          fi
          tar -czf "pre-deploy-${{ github.sha }}.tar.gz" -C backup/docroot .
          echo "| بکاپ پیش از انتشار | $n فایل | artifact پیوست شد |" >> $GITHUB_STEP_SUMMARY

      - name: نگهداری بکاپ انتشار واقعی به‌عنوان artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy-*.tar.gz
          retention-days: 14

      - name: اجرای آزمایشی — فقط فهرست، بدون نوشتن
        if: inputs.dry_run
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          source .github/deploy/critical-deploy-files.sh
          echo "🔍 DRY-RUN — هیچ بایتی روی تولید نوشته نمی‌شود"

          # از Aug 2026 به بعد، معماری واقعی (غیر dry-run) این ورک‌فلو
          # Hybrid Critical Files است (همان معماری اثبات‌شده در PR #40
          # روی staging): فایل‌های حیاتی از mirror اصلی --exclude
          # می‌شوند و جداگانه با put اجباری آپلود می‌شوند. برای این‌که
          # خروجی DRY-RUN واقعاً نمایانگر آنچه در اجرای واقعی رخ می‌دهد
          # باشد، همین exclude را اینجا هم اعمال می‌کنیم و آپلود اجباری
          # فایل‌های حیاتی را جداگانه (هرچند فقط با --dry-run) نشان می‌دهیم.
          EXCLUDE_ARGS=()
          for f in "${CRITICAL_DEPLOY_FILES[@]}"; do
            escaped="$(printf '%s' "$f" | sed -e 's/[.]/\\./g')"
            EXCLUDE_ARGS+=(--exclude "^${escaped}\$")
          done

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
          set ftp:ssl-allow no
          set net:timeout 30
          set ftp:passive-mode on
          mirror -R --dry-run --continue --ignore-time --no-perms --no-symlinks --exclude-glob .git* ${EXCLUDE_ARGS[*]} production-build/ ${{ env.PROD_DOCROOT }}
          bye
          " | tee /tmp/dry.txt

          # توجه: دستور put در lftp گزینه --dry-run ندارد (فقط mirror دارد)،
          # بنابراین برای فایل‌های حیاتی فقط لیست/اندازه/hash محلی را گزارش
          # می‌کنیم — هیچ اتصال نوشتاری‌ای برای آن‌ها برقرار نمی‌شود؛ این
          # مرحله فقط با inputs.dry_run اجرا می‌شود و مرحله put واقعی در
          # ادامه، تحت شرط !inputs.dry_run، اصلاً اجرا نخواهد شد.
          echo "----- فایل‌های حیاتی (در اجرای واقعی همیشه به‌صورت اجباری put می‌شوند؛ اینجا فقط گزارش، بدون اتصال نوشتاری) -----" | tee -a /tmp/dry.txt
          for f in "${CRITICAL_DEPLOY_FILES[@]}"; do
            sha=$(sha256sum "production-build/$f" | cut -d' ' -f1)
            size=$(wc -c < "production-build/$f")
            echo "put (اجباری، خارج از mirror): $f  →  ${{ env.PROD_DOCROOT }}$f  |  sha256=$sha  |  $size بایت" | tee -a /tmp/dry.txt
          done

          echo "### 🔍 نتیجه DRY-RUN" >> $GITHUB_STEP_SUMMARY
          echo "عملیاتی که *قرار بود* انجام شود: $(grep -c . /tmp/dry.txt) خط" >> $GITHUB_STEP_SUMMARY
          echo "شامل ${#CRITICAL_DEPLOY_FILES[@]} فایل حیاتی که همیشه به‌صورت اجباری put می‌شوند (بدون بستگی به mirror)." >> $GITHUB_STEP_SUMMARY
          echo "**هیچ فایلی روی تولید نوشته نشد.**" >> $GITHUB_STEP_SUMMARY

      - name: انتقال فایل‌های عادی با lftp mirror (بهینه، بدون فایل‌های حیاتی — OC-2)
        if: ${{ !inputs.dry_run }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          source .github/deploy/critical-deploy-files.sh

          # معماری Hybrid Critical Files — همان معماری اثبات‌شده در PR #40
          # (staging)، اینجا برای Production با مقصد hardcode شدهٔ C-2
          # (${{ env.PROD_DOCROOT }} — هرگز پارامتری نمی‌شود). فایل‌های
          # امنیتی-حیاتی (آرایه CRITICAL_DEPLOY_FILES در
          # .github/deploy/critical-deploy-files.sh، مشترک با staging) از
          # این mirror --exclude می‌شوند تا هرگز مشمول هیوریستیک skip
          # بر پایه اندازه/زمان lftp نشوند — همان ریشهٔ حادثهٔ Aug 2026
          # در staging که پیش از این تولید هم به آن آسیب‌پذیر بود. آپلود
          # واقعی فایل‌های حیاتی در مرحله بعد، با put صریح، انجام می‌شود.
          #
          # برای بقیهٔ فایل‌های عادی، --continue (بهینه‌سازی resume/skip)
          # حفظ شده — این رفتار بدون تغییر نسبت به نسخهٔ قبلی این ورک‌فلو،
          # با تنها تفاوت این‌که فایل‌های حیاتی دیگر وارد تصمیم‌گیری
          # skip/transfer نمی‌شوند.
          EXCLUDE_ARGS=()
          for f in "${CRITICAL_DEPLOY_FILES[@]}"; do
            escaped="$(printf '%s' "$f" | sed -e 's/[.]/\\./g')"
            EXCLUDE_ARGS+=(--exclude "^${escaped}\$")
          done

          attempt=0
          until [ $attempt -ge 12 ]; do
            attempt=$((attempt+1))
            echo "===== تلاش $attempt (mirror عادی) ====="
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 20
          set net:timeout 30
          set ftp:passive-mode on
          set mirror:parallel-transfer-count 1
          mirror -R --continue --ignore-time --no-perms --no-symlinks --exclude-glob .git* ${EXCLUDE_ARGS[*]} production-build/ ${{ env.PROD_DOCROOT }}
          bye
          " && break
            echo "قطع شد — ادامه از همان نقطه پس از 10 ثانیه..."
            sleep 10
          done

      - name: آپلود اجباری فایل‌های حیاتی (بدون تکیه بر منطق mirror)
        if: ${{ !inputs.dry_run }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          source .github/deploy/critical-deploy-files.sh

          # این فایل‌ها هرگز از mirror عبور نمی‌کنند (مرحله قبل exclude
          # کرد)؛ اینجا با put صریح آپلود می‌شوند. put هیچ منطق «آیا مقصد
          # از قبل کامل/هم‌اندازه است؟» ندارد — همیشه محتوا را کامل ارسال
          # و جایگزین می‌کند، مستقل از اندازه یا زمان فایل مقصد. مقصد،
          # مطابق C-2، همان ${{ env.PROD_DOCROOT }} هاردکد است — هرگز از
          # مسیر staging یا هیچ ورودی dispatch گرفته نمی‌شود.
          for f in "${CRITICAL_DEPLOY_FILES[@]}"; do
            echo "===== آپلود اجباری فایل حیاتی: $f ====="
            attempt=0
            until [ $attempt -ge 6 ]; do
              attempt=$((attempt+1))
              echo "  تلاش $attempt"
              lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:reconnect-interval-base 3
          set net:reconnect-interval-max 10
          set net:timeout 30
          set ftp:passive-mode on
          put production-build/$f -o ${{ env.PROD_DOCROOT }}$f
          bye
          " && break
              echo "  قطع شد؛ ۱۰ ثانیه صبر و تلاش دوباره..."
              sleep 10
            done
            if [ $attempt -ge 6 ]; then
              echo "❌ FAIL: آپلود فایل حیاتی $f پس از ۶ تلاش ناموفق بود"
              exit 1
            fi
          done
          echo "✅ همه فایل‌های حیاتی با موفقیت (اجباری) آپلود شدند"

      - name: راستی‌آزمایی provenance روی سرور (read-only)
        if: ${{ !inputs.dry_run }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          # هر دو فایل حیاتی provenance را از سرور می‌گیریم — نه فقط
          # .csp-release.json — دقیقاً همان رفعِ مشکلی که در PR #38 برای
          # staging انجام شد و پیش از این PR روی Production اعمال
          # نشده بود؛ Production تا این PR فقط .csp-release.json را
          # راستی‌آزمایی می‌کرد و csp-manifest.json را مستقل بررسی نمی‌کرد.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set ftp:ssl-allow no
          set net:timeout 30
          cd public_html
          get localized/.csp-release.json -o /tmp/server-csp-release.json
          get public/locales/csp-manifest.json -o /tmp/server-csp-manifest.json
          bye
          LFTP
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          repo_release = json.loads(pathlib.Path("localized/.csp-release.json").read_text(encoding="utf-8"))
          server_release = json.loads(pathlib.Path("/tmp/server-csp-release.json").read_text(encoding="utf-8"))
          for k in ("releaseId", "commitSha", "sourceDigest", "releaseHtmlSha256", "cspManifestSha256"):
              if repo_release.get(k) != server_release.get(k):
                  raise SystemExit(
                      f"provenance روی سرور (.csp-release.json) با آرتیفکت تأییدشده نمی‌خواند: "
                      f"{k} repo={repo_release.get(k)} server={server_release.get(k)}"
                  )
          print("✅ localized/.csp-release.json روی سرور با آرتیفکت تأییدشده CI برابر است")

          repo_manifest_bytes = pathlib.Path("public/locales/csp-manifest.json").read_bytes()
          server_manifest_bytes = pathlib.Path("/tmp/server-csp-manifest.json").read_bytes()
          repo_manifest_sha256 = hashlib.sha256(repo_manifest_bytes).hexdigest()
          server_manifest_sha256 = hashlib.sha256(server_manifest_bytes).hexdigest()
          if repo_manifest_sha256 != server_manifest_sha256:
              raise SystemExit(
                  "provenance روی سرور (public/locales/csp-manifest.json) با آرتیفکت تأییدشده "
                  f"نمی‌خواند: sha256 repo={repo_manifest_sha256} server={server_manifest_sha256}"
              )
          if server_manifest_sha256 != server_release.get("cspManifestSha256"):
              raise SystemExit(
                  "ناهماهنگی داخلی روی سرور: sha256 واقعیِ public/locales/csp-manifest.json با "
                  f"cspManifestSha256 ثبت‌شده در localized/.csp-release.json یکی نیست "
                  f"(actual={server_manifest_sha256} recorded={server_release.get('cspManifestSha256')})"
              )
          print("✅ public/locales/csp-manifest.json روی سرور با آرتیفکت تأییدشده CI برابر است")

          # راستی‌آزمایی سازگاری داخلی اضافه (routeCount / policyVersion) —
          # همان بررسی اضافه‌شده در PR #40 برای staging.
          server_manifest = json.loads(server_manifest_bytes)
          for k in ("routeCount", "policyVersion"):
              release_val = server_release.get(k)
              manifest_val = server_manifest.get(k)
              if release_val != manifest_val:
                  raise SystemExit(
                      f"ناهماهنگی داخلی روی سرور: {k} در .csp-release.json={release_val} "
                      f"با {k} در csp-manifest.json={manifest_val} یکی نیست"
                  )
          print("✅ routeCount/policyVersion بین دو فایل حیاتی روی سرور سازگار است")
          PY

      - name: خلاصه
        if: ${{ !inputs.dry_run }}
        run: |
          echo "### انتشار Production انجام شد" >> $GITHUB_STEP_SUMMARY
          echo "کامیت: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "مقصد: \`${{ env.PROD_DOCROOT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "دست‌نخورده روی هاست: \`api/.env\`، \`api/storage/\`، \`velora_private/\`" >> $GITHUB_STEP_SUMMARY
          echo "بازگشت: artifact \`pre-deploy-backup-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ── راستی‌آزمایی دیتابیس پس از استقرار Production (read-only، یک‌بارمصرف) ──
  # اتصال، جدول‌های بحرانی، کوئری‌های نماینده و سلامت اسکیمای Production را پس از
  # استقرار بررسی می‌کند. شکست آن ⇒ استقرار ناموفق تلقی می‌شود.
  prod_db_verify:
    name: راستی‌آزمایی DATABASE پس از استقرار Production
    needs: [deploy, prod_backup_gate]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/velora-db-verify.yml
    with:
      environment_name: production
      base_url: https://veloratrade.ir
    secrets: inherit

  healthcheck:
    name: تست سلامت سایت واقعی (HTTP/CSP)
    needs: [deploy, prod_db_verify]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/healthcheck-production.yml

  # ── نگهداری بکاپ‌های دیتابیس Production (فقط پس از موفقیت کامل) ───────────
  # جدیدترین بکاپ تأییدشده هرگز حذف نمی‌شود؛ بکاپ‌های >۱۴روز فقط وقتی واجد شرایطند
  # که استقرار و راستی‌آزمایی پس از استقرار موفق بوده باشند. در فاز فعلی این
  # مرحله فقط PLAN خواندنی می‌دهد (بدون credential حذف انجام نمی‌شود).
  retention:
    name: نگهداری بکاپ دیتابیس Production (auditable)
    needs: [deploy, prod_db_verify, healthcheck]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: برنامهٔ نگهداری (حذف تنها پس از موفقیت کامل)
        run: |
          set -euo pipefail
          # هر دو گیت موفقیت از وضعیت jobهای بالادست می‌آیند؛ این job فقط زمانی
          # اجرا می‌شود که deploy و prod_db_verify و healthcheck موفق بوده‌اند.
          python3 ops/velora-mgmt/velora_prod_retention.py \
            --mutation-succeeded --post-verify-passed

  # ── گزارش نهایی استقرار (شامل backup_id متصل) ────────────────────────────
  deployment_report:
    name: گزارش کامل استقرار Production
    needs: [deploy, prod_db_verify, healthcheck, retention, prod_backup_gate]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - run: |
          set -euo pipefail
          echo "### گزارش استقرار Production" >> $GITHUB_STEP_SUMMARY
          echo "- backup_id متصل: \`${{ needs.prod_backup_gate.outputs.backup_id || 'n/a' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- راستی‌آزمایی دیتابیس پس از استقرار: انجام شد" >> $GITHUB_STEP_SUMMARY
          echo "- نگهداری: فقط پس از موفقیت کامل اجرا شد" >> $GITHUB_STEP_SUMMARY
