# انتشار روی Production — دستی، allow-list، با بکاپ و گارد
#
# ── تغییرات ۲۰۲۶-۰۸-۱۷ (بازنویسی کامل) ─────────────────────────────
#   ✓ allow-list به‌جای deny-list (Structure.pdf §6 — بستهٔ allowlisted)
#   ✓ مقصد hardcode: public_html/  (C-2 — غیرقابل‌مذاکره)
#   ✓ lftp + ftp ساده + --continue + retry×12  (OC-2)
#   ✓ بکاپ کامل docroot پیش از هر نوشتن  (RB-6 / R-3)
#   ✓ ۱۱ گارد پیش از آپلود
#   ✓ گارد تأیید مالک: CONFIRM-PRODUCTION-DEPLOY
#   ✗ تریگر push حذف شده (OC-9)
#   ✗ FTP-Deploy-Action و protocol ftps کنار گذاشته شدند (OC-2)
#
# ── سیاست تک‌اکانتی (تصمیم مالک) ───────────────────────────────────
# استیجینگ و تولید از یک اکانت FTP (piknet) استفاده می‌کنند. هیچ مانع
# فنی بین دو محیط نیست؛ تنها کنترل مؤثر، تأیید انسانی مالک است.
# به همین دلیل مقصد mirror در همین فایل hardcode شده و هرگز نباید به
# ورودی dispatch یا متغیر تبدیل شود.
#
# پیش‌نیاز Secrets (هنوز تعریف نشده‌اند — عمدی):
#   FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
#
# مرجع: docs/README.md §3 (ماتریس FTP، سیاست تک‌اکانتی)، §4 RB-6، §7

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'برای انتشار روی سایت زنده دقیقاً بنویسید: CONFIRM-PRODUCTION-DEPLOY'
        required: true
        default: ''
        type: string
      dry_run:
        description: 'اجرای آزمایشی — فقط فهرست می‌کند، هیچ فایلی نوشته نمی‌شود'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # آپلود نیمه‌کاره خطرناک است

env:
  # ⚠️ C-2 — مقصد hardcode. هرگز پارامتری نشود.
  PROD_DOCROOT: public_html/

jobs:
  # ── ۱. گارد تأیید ──────────────────────────────────────────────
  gate:
    name: گارد تأیید مالک
    if: github.repository == 'veloratrade/veloratrade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: بررسی عبارت تأیید
        run: |
          if [ "${{ inputs.confirm_production_deploy }}" != "CONFIRM-PRODUCTION-DEPLOY" ]; then
            echo "::error::عبارت تأیید نادرست است — انتشار متوقف شد. هیچ اتصالی برقرار نشد."
            exit 1
          fi
          echo "✅ تأیید مالک دریافت شد."
          echo "مقصد: \`${{ env.PROD_DOCROOT }}\` (hardcode)" >> $GITHUB_STEP_SUMMARY

  # ── ۲. گیت استیجینگ: تولید فقط وقتی استیجینگ سبز است ───────────
  staging_gate:
    name: راستی‌آزمایی استیجینگ (پیش‌شرط تولید)
    needs: gate
    uses: ./.github/workflows/healthcheck-suite.yml
    with:
      base_url: https://staging.veloratrade.ir
      environment_name: staging
      write_probes: false

  # ── ۳. گیت دائمی کیفیت (Phase 3.2): Auth/Email/Security/Localization ──
  quality_gate:
    name: گیت دائمی کیفیت — پیش‌شرط انتشار
    needs: staging_gate
    uses: ./.github/workflows/quality-gate.yml

  # ── ۴. گارد CSP ────────────────────────────────────────────────
  guard:
    name: بررسی سلامت قبل از انتشار
    needs: quality_gate
    uses: ./.github/workflows/csp-guard.yml

  # ── ۳. ساخت بسته + بکاپ + انتقال ───────────────────────────────
  deploy:
    name: آپلود روی هاست
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: ساخت بستهٔ تولید (allow-list)
        run: |
          set -euo pipefail
          DEST=production-build
          mkdir -p "$DEST"

          # --- ریشه ---
          cp locale-router.php 404.html "$DEST/"
          mkdir -p "$DEST/404" && cp 404/index.html "$DEST/404/"
          cp favicon.ico favicon-16.png favicon-32.png favicon-48.png \
             icon-192.png icon-512.png apple-icon.png manifest.json velora-logo.svg "$DEST/"
          mkdir -p "$DEST/checkout" && cp checkout/index.html "$DEST/checkout/"

          # --- .htaccess تولید: بدون تغییر (برخلاف استیجینگ) ---
          cp .htaccess "$DEST/.htaccess"

          # --- SEO تولید: ایندکس مجاز + sitemap + تأیید Search Console ---
          cp robots.txt "$DEST/robots.txt"
          cp sitemap.xml "$DEST/sitemap.xml"
          for g in google*.html; do [ -f "$g" ] && cp "$g" "$DEST/"; done

          # --- خروجی لوکال‌سازی (شامل .csp-release.json مخفی — OC-4) ---
          cp -a localized "$DEST/localized"

          # --- public منهای تشخیصی‌ها ---
          cp -a public "$DEST/public"
          rm -f  "$DEST/public/logout-diagnostic-v2.html"
          rm -rf "$DEST/public/samples"

          # --- api: فقط runtime ---
          mkdir -p "$DEST/api/public" "$DEST/api/config"
          cp api/.htaccess api/index.php "$DEST/api/"
          cp api/public/index.php "$DEST/api/public/"
          cp api/config/config.php "$DEST/api/config/"
          [ -f api/config/.htaccess ] && cp api/config/.htaccess "$DEST/api/config/" || true
          cp -a api/src     "$DEST/api/src"
          cp -a api/locales "$DEST/api/locales"
          cp -a api/workers "$DEST/api/workers"

          # --- حذف ۱۴ فایل دستهٔ «۱۷۹» (اسناد/بکاپ) ---
          find "$DEST" -name 'README-*.txt' -delete
          find "$DEST" -name '*backup*'     -delete
          find "$DEST" -name 'NOTICE.txt'   -delete

          echo "بسته ساخته شد: $(find "$DEST" -type f | wc -l) فایل"

      - name: گاردهای پیش از آپلود (۱۱ بررسی)
        run: |
          set -euo pipefail
          DEST=production-build
          fail=0
          chk(){ if [ "$2" = 0 ]; then echo "  ✅ $1"; else echo "::error::$1"; fail=1; fi; }

          chk "بدون فایل SQL"            "$(find $DEST -name '*.sql' | wc -l)"
          chk "بدون فایل env"            "$(find $DEST -name '*.env*' | wc -l)"
          chk "بدون sqlite/log/error_log" "$(find $DEST \( -name '*.sqlite*' -o -name '*.log' -o -name 'error_log' \) | wc -l)"
          chk "بدون اسکریپت نصب/تشخیص"   "$(find $DEST \( -name 'install.php' -o -name 'diag.php' -o -name 'env-check.php' -o -name 'init-sqlite.php' \) | wc -l)"
          chk "بدون اسکریپت تست/ایمیل"   "$(find $DEST \( -name 'mail-*.php' -o -name 'test-*.php' \) | wc -l)"
          chk "بدون PDF (B-6 Roadmap)"   "$(find $DEST -name '*.pdf' | wc -l)"
          chk "بدون docs/tools/_next"    "$(find $DEST \( -path '*/docs/*' -o -path '*/tools/*' -o -path '*/_next/*' \) | wc -l)"
          chk "بدون فایل backup"         "$(find $DEST -name '*backup*' | wc -l)"

          # بررسی‌های وجودی (باید موجود باشند)
          [ -f "$DEST/localized/.csp-release.json" ] && echo "  ✅ .csp-release.json موجود (OC-4)" || { echo "::error::.csp-release.json غایب"; fail=1; }
          [ -f "$DEST/sitemap.xml" ] && echo "  ✅ sitemap.xml موجود" || { echo "::error::sitemap.xml غایب"; fail=1; }

          # تولید نباید noindex بدهد و باید به velora_private (نه staging) اشاره کند
          if grep -q 'velora_private_staging' "$DEST/.htaccess"; then
            echo "::error::.htaccess به مسیر استیجینگ اشاره می‌کند!"; fail=1
          else echo "  ✅ .htaccess به velora_private تولید اشاره دارد"; fi
          if grep -q 'X-Robots-Tag' "$DEST/.htaccess"; then
            echo "::error::تولید نباید X-Robots-Tag noindex داشته باشد!"; fail=1
          fi

          n=$(find $DEST -type f | wc -l)
          echo "تعداد فایل بسته: $n"
          echo "| بسته تولید | $n فایل | همه گاردها سبز |" >> $GITHUB_STEP_SUMMARY
          [ "$fail" = 0 ] || { echo "انتشار متوقف شد."; exit 1; }

      - name: گارد provenance بسته (read-only)
        run: |
          set -euo pipefail
          DEST=production-build
          python3 - "$DEST" <<'PY'
          import json, pathlib, sys
          dest = pathlib.Path(sys.argv[1])
          pkg = json.loads((dest / "localized/.csp-release.json").read_text(encoding="utf-8"))
          repo = json.loads(pathlib.Path("localized/.csp-release.json").read_text(encoding="utf-8"))
          for k in ("releaseId", "commitSha", "sourceDigest", "releaseHtmlSha256", "cspManifestSha256"):
              if pkg.get(k) != repo.get(k):
                  raise SystemExit(f"بسته provenance با مخزن ناهماهنگ است: {k} pkg={pkg.get(k)} repo={repo.get(k)}")
          sha = pkg.get("commitSha")
          if not sha or not pkg.get("sourceDigest"):
              raise SystemExit("provenance (commitSha/sourceDigest) در بسته غایب است")
          print(f"✅ provenance بسته تأیید شد: releaseId={pkg.get('releaseId')} commitSha={sha[:12]}")
          PY

      - name: بکاپ docroot فعلی پیش از هر نوشتن (RB-6)
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          sudo apt-get install -y -q lftp > /dev/null
          mkdir -p backup/docroot
          # دانلود وضعیت فعلی تولید (فقط خواندن — هیچ نوشتنی)
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP || true
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:timeout 30
          set ftp:passive-mode on
          # public_html شامل docroot مستقل Staging به‌صورت nested است؛ آن محیط
          # بخشی از Production backup نیست و دانلودش هم بکاپ را بسیار کند می‌کند.
          mirror --continue --no-perms --parallel=1 \
                 --exclude-glob staging.veloratrade.ir/ \
                 --exclude-glob staging.veloratrade.ir/** \
                 ${{ env.PROD_DOCROOT }} backup/docroot/
          bye
          LFTP
          n=$(find backup/docroot -type f | wc -l)
          echo "بکاپ: $n فایل"
          if [ "$n" = 0 ]; then
            echo "::error::بکاپ خالی است — انتشار متوقف شد تا مسیر بازگشت تضمین شود."
            exit 1
          fi
          tar -czf "pre-deploy-${{ github.sha }}.tar.gz" -C backup/docroot .
          echo "| بکاپ پیش از انتشار | $n فایل | artifact پیوست شد |" >> $GITHUB_STEP_SUMMARY

      - name: نگهداری بکاپ انتشار واقعی به‌عنوان artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy-*.tar.gz
          retention-days: 14

      - name: اجرای آزمایشی — فقط فهرست، بدون نوشتن
        if: inputs.dry_run
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          echo "🔍 DRY-RUN — هیچ بایتی روی تولید نوشته نمی‌شود"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP | tee /tmp/dry.txt
          set ftp:ssl-allow no
          set net:timeout 30
          set ftp:passive-mode on
          mirror -R --dry-run --continue --only-newer --no-perms --no-symlinks \
                 --exclude-glob .git* \
                 production-build/ ${{ env.PROD_DOCROOT }}
          bye
          LFTP
          echo "### 🔍 نتیجه DRY-RUN" >> $GITHUB_STEP_SUMMARY
          echo "عملیاتی که *قرار بود* انجام شود: $(grep -c . /tmp/dry.txt) خط" >> $GITHUB_STEP_SUMMARY
          echo "**هیچ فایلی روی تولید نوشته نشد.**" >> $GITHUB_STEP_SUMMARY

      - name: انتقال با lftp (مقاوم در برابر قطعی هاست — OC-2)
        if: ${{ !inputs.dry_run }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          attempt=0
          until [ $attempt -ge 12 ]; do
            attempt=$((attempt+1))
            echo "===== تلاش $attempt ====="
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP && break
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 20
          set net:timeout 30
          set ftp:passive-mode on
          set mirror:parallel-transfer-count 1
          mirror -R --continue --only-newer --no-perms --no-symlinks \
                 --exclude-glob .git* \
                 production-build/ ${{ env.PROD_DOCROOT }}
          bye
          LFTP
            echo "قطع شد — ادامه از همان نقطه پس از 10 ثانیه..."
            sleep 10
          done

      - name: راستی‌آزمایی provenance روی سرور (read-only)
        if: ${{ !inputs.dry_run }}
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set ftp:ssl-allow no
          set net:timeout 30
          cd public_html
          get localized/.csp-release.json -o /tmp/server-csp-release.json
          bye
          LFTP
          python3 - <<'PY'
          import json, pathlib
          repo = json.loads(pathlib.Path("localized/.csp-release.json").read_text(encoding="utf-8"))
          server = json.loads(pathlib.Path("/tmp/server-csp-release.json").read_text(encoding="utf-8"))
          for k in ("releaseId", "commitSha", "sourceDigest", "releaseHtmlSha256", "cspManifestSha256"):
              if repo.get(k) != server.get(k):
                  raise SystemExit(f"provenance روی سرور با آرتیفکت تأییدشده نمی‌خواند: {k} repo={repo.get(k)} server={server.get(k)}")
          print("✅ آرتیفکت روی سرور با آرتیفکت تأییدشده CI برابر است")
          PY

      - name: خلاصه
        if: ${{ !inputs.dry_run }}
        run: |
          echo "### انتشار Production انجام شد" >> $GITHUB_STEP_SUMMARY
          echo "کامیت: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "مقصد: \`${{ env.PROD_DOCROOT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "دست‌نخورده روی هاست: \`api/.env\`، \`api/storage/\`، \`velora_private/\`" >> $GITHUB_STEP_SUMMARY
          echo "بازگشت: artifact \`pre-deploy-backup-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  healthcheck:
    name: تست سلامت سایت واقعی
    needs: deploy
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/healthcheck-production.yml
