# لایه ۳ — تست سلامت سایت واقعی
#
# بعد از هر انتشار و هر روز صبح، سایت واقعی را تست می‌کند.
# اگر خراب باشد، گیت‌هاب خودکار به شما ایمیل می‌زند.

name: Health Check

on:
  workflow_call:            # از deploy.yml صدا زده می‌شود
  workflow_dispatch:        # اجرای دستی
  schedule:
    - cron: '0 3 * * *'     # هر روز ساعت ۳ بامداد UTC

permissions:
  contents: read

jobs:
  probe:
    name: بررسی سایت زنده
    if: github.repository == 'yadgarsict-del/veloratrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: مکث تا پایدار شدن انتشار
        run: sleep 20

      - name: هیچ صفحه‌ای نباید ۵۰۳ بدهد
        run: |
          python3 - <<'PY'
          import json, urllib.request, sys
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter

          BASE = 'https://veloratrade.ir'
          man = json.load(open('public/locales/csp-manifest.json'))

          def probe(route):
              url = BASE + '/' + route.replace('index.html', '')
              req = urllib.request.Request(url, method='GET')
              req.add_header('User-Agent', 'velora-healthcheck')
              try:
                  op = urllib.request.build_opener(NoRedirect)
                  return route, op.open(req, timeout=25).status
              except urllib.error.HTTPError as e:
                  return route, e.code
              except Exception as e:
                  return route, f'ERR {e}'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None

          with ThreadPoolExecutor(8) as ex:
              results = list(ex.map(probe, man['routes']))

          counts = Counter(str(c) for _, c in results)
          print('توزیع کدها:', dict(counts))

          broken = [(r, c) for r, c in results if str(c) not in ('200', '302', '301')]
          if broken:
              print('::error::صفحات خراب:')
              for r, c in broken:
                  print(f'  {c}  /{r.replace("index.html","")}')
              sys.exit(1)
          print(f'✅ هر {len(results)} مسیر سالم است')
          PY

      - name: امنیت خروج — Origin جعلی باید ۴۰۳ بگیرد
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            -X POST https://veloratrade.ir/api/v1/auth/logout \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://evil.example' \
            -H 'Cookie: __Host-velora_refresh=dummytoken123' -d '{}')
          echo "Origin جعلی → $code"
          if [ "$code" != "403" ]; then
            echo "::error::بررسی same-origin کار نمی‌کند (انتظار ۴۰۳، دریافت $code)"
            exit 1
          fi
          echo "✅ بررسی same-origin برقرار است"

      - name: خروج با Origin درست باید ۲۰۰ بدهد
        run: |
          body=$(curl -s --max-time 25 \
            -X POST https://veloratrade.ir/api/v1/auth/logout \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://veloratrade.ir' -d '{}')
          echo "پاسخ: $body"
          echo "$body" | grep -q '"loggedOut":true' || {
            echo "::error::خروج پاسخ درست نداد"; exit 1; }
          echo "$body" | grep -q 'sessionRevoked' && {
            echo "::error::کد قدیمی روی سرور است — sessionRevoked هنوز در پاسخ هست"; exit 1; }
          echo "✅ خروج سالم و کد به‌روز است"

      - name: منیفست روی هاست باید با مخزن یکی باشد
        run: |
          curl -s --max-time 25 -o /tmp/live.json \
            https://veloratrade.ir/public/locales/csp-manifest.json
          a=$(sha256sum /tmp/live.json | cut -d' ' -f1)
          b=$(sha256sum public/locales/csp-manifest.json | cut -d' ' -f1)
          echo "هاست : $a"
          echo "مخزن : $b"
          [ "$a" = "$b" ] || { echo "::error::منیفست هاست با مخزن فرق دارد — انتشار ناقص بوده"; exit 1; }
          echo "✅ هاست و مخزن هم‌نسخه‌اند"
