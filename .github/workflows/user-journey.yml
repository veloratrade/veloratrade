name: User Journey (Staging)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to execute against staging'
        required: true
        type: string

permissions: {}

concurrency:
  group: velora-user-journey
  cancel-in-progress: false

jobs:
  journey:
    name: Real registration self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard
        run: |
          if [ "${{ inputs.confirm }}" != "RUN" ]; then
            echo "::error::confirm must be RUN"
            exit 1
          fi
          echo "تأیید ورودی انجام شد."

