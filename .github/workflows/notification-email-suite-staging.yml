name: Transactional Email Suite (Staging)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'برای ارسال همه قالب‌های transactional روی Staging، RUN را وارد کنید'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: transactional-email-suite-staging
  cancel-in-progress: false

jobs:
  suite:
    name: seven templates + seven CID icons → seven inboxes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_DRIVER: resend
      INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - name: Gate and checkout
        run: |
          set -euo pipefail
          [ "$INPUT_CONFIRM" = "RUN" ] || { echo "::error::confirm باید RUN باشد"; exit 1; }
          [ -n "$RESEND_API_KEY" ] || { echo "::error::RESEND_API_KEY خالی است"; exit 1; }
          echo "::add-mask::$RESEND_API_KEY"
      - uses: actions/checkout@v4

      - name: Create four low-volume disposable inboxes
        run: |
          python3 <<'PY'
          import base64,json,os,random,string,time,urllib.request,urllib.error
          # mail.tm rate-limits account creation and may suppress a burst of seven
          # messages to one inbox. Four inboxes, max two messages each, avoid both.
          names=['auth','password','security','activity']
          def req(method,url,data=None,token=None):
              body=json.dumps(data).encode() if data is not None else None
              r=urllib.request.Request(url,data=body,method=method,headers={'Accept':'application/json','User-Agent':'Velora-Email-Suite/2.0'})
              if body:r.add_header('Content-Type','application/json')
              if token:r.add_header('Authorization','Bearer '+token)
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:return x.status,json.loads(x.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:return e.code,json.loads(raw)
                  except Exception:return e.code,{}
          _,d=req('GET','https://api.mail.tm/domains?page=1');members=d if isinstance(d,list) else d.get('hydra:member',[])
          domain=next(x['domain'] for x in members if x.get('isActive'))
          boxes={}
          for index,name in enumerate(names):
              address='velora-'+name.replace('_','-')+'-'+''.join(random.choices(string.ascii_lowercase+string.digits,k=8))+'@'+domain
              password='Vt!'+''.join(random.choices(string.ascii_letters+string.digits,k=18))
              print('::add-mask::'+address);print('::add-mask::'+password)
              for attempt in range(1,6):
                  status,_=req('POST','https://api.mail.tm/accounts',{'address':address,'password':password})
                  if status in (200,201):break
                  delay=min(15*attempt,60) if status==429 else 3
                  print(f'… mailbox {name} HTTP {status}; retry in {delay}s')
                  time.sleep(delay)
              if status not in (200,201):raise SystemExit(f'::error::mailbox create failed for {name}: HTTP {status}')
              status,auth=req('POST','https://api.mail.tm/token',{'address':address,'password':password})
              token=auth.get('token','')
              if not token:raise SystemExit(f'::error::mailbox token failed for {name}: HTTP {status}')
              print('::add-mask::'+token)
              boxes[name]={'address':address,'token':token}
              time.sleep(.5)
          encoded=base64.urlsafe_b64encode(json.dumps(boxes,separators=(',',':')).encode()).decode()
          print('::add-mask::'+encoded)
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('MAILBOXES_B64='+encoded+'\n')
          print('FOUR_LOW_VOLUME_MAILBOXES=READY')
          PY

      - name: Send all current transactional templates through real code
        id: send
        run: |
          set -euo pipefail
          cat >/tmp/notification-suite.php <<'PHP'
          <?php
          declare(strict_types=1);
          namespace Velora\Core;
          final class Config {
              public static function env(string $key,string $default=''): string { $v=getenv($key); return $v===false||$v===''?$default:$v; }
              public static function get(string $key,mixed $default=null): mixed { return $key==='frontend_url'?'https://staging.veloratrade.ir':$default; }
              public static function privatePath(string $path): string { return sys_get_temp_dir().'/'.$path; }
          }
          final class EmailNotificationRepository {
              public function log(?int $userId,string $email,string $type,string $subject,string $status='sent',?string $error=null,?array $payload=null): void {}
          }
          spl_autoload_register(static function(string $class): void {
              $prefix='Velora\\Core\\';
              if (!str_starts_with($class,$prefix)) return;
              $relative=substr($class,strlen($prefix));
              $file=getcwd().'/api/src/Core/'.str_replace('\\','/',$relative).'.php';
              if (is_file($file)) require $file;
          });
          require getcwd().'/api/src/Core/NotificationService.php';
          $boxes=json_decode(base64_decode(strtr(getenv('MAILBOXES_B64'),'-_','+/')),true,512,JSON_THROW_ON_ERROR);
          $to=static fn(string $name): string=>$boxes[$name]['address'];
          $base='https://staging.veloratrade.ir';
          $cases=[
              'verification'=>fn()=>NotificationService::sendVerificationEmail($to('auth'),'Email Suite',$base.'/verify-email#token='.str_repeat('a',64),900001),
              'welcome'=>fn()=>NotificationService::sendWelcomeEmail($to('auth'),'Email Suite',$base.'/dashboard',900001),
              'password_reset'=>fn()=>NotificationService::sendPasswordResetTokenEmail($to('password'),'Email Suite',$base.'/reset-password?token='.str_repeat('b',64),900001),
              'password_changed'=>fn()=>NotificationService::sendPasswordChangedEmail($to('password'),'Email Suite',900001),
              'new_device'=>fn()=>NotificationService::sendNewDeviceDetectedEmail($to('security'),'Email Suite','192.0.2.1','Velora Suite Browser','2026-08-20 00:00:00 UTC',900001),
              'first_trade'=>fn()=>NotificationService::sendFirstTradeEmail($to('activity'),'Email Suite','EURUSD','buy',$base.'/dashboard',900001),
              'achievement'=>fn()=>NotificationService::sendAchievementUnlockedEmail($to('activity'),'Email Suite','Consistency','Seven-day discipline',$base.'/profile',900001),
          ];
          $ids=[];
          foreach($cases as $name=>$send){
              $ok=$send();
              if(!$ok){fwrite(STDERR,'::error::'.$name.' failed: '.(Mailer::$lastError??'unknown safe error').PHP_EOL);exit(1);}
              $ids[$name]=Mailer::$lastMessageId;
              echo $name.' accepted id='.Mailer::$lastMessageId.PHP_EOL;
              usleep(1200000);
          }
          file_put_contents(getenv('GITHUB_OUTPUT'),'count='.count($ids).PHP_EOL,FILE_APPEND);
          file_put_contents(getenv('GITHUB_OUTPUT'),'ids_b64='.base64_encode(json_encode($ids)).PHP_EOL,FILE_APPEND);
          PHP
          php /tmp/notification-suite.php
          shred -u /tmp/notification-suite.php 2>/dev/null || rm -f /tmp/notification-suite.php

      - name: Verify seven deliveries, CID attachments, sender and design
        run: |
          python3 <<'PY'
          import base64,json,os,re,time,urllib.request
          boxes=json.loads(base64.urlsafe_b64decode(os.environ['MAILBOXES_B64']).decode())
          expected={
            'auth':{'verification.png','welcome.png'},
            'password':{'password-reset.png','password-changed.png'},
            'security':{'security.png'},
            'activity':{'first-trade.png','achievement.png'},
          }
          def get(name,url):
              token=boxes[name]['token']
              r=urllib.request.Request(url,headers={'Accept':'application/json','Authorization':'Bearer '+token,'User-Agent':'Velora-Email-Suite/2.1'})
              with urllib.request.urlopen(r,timeout=30) as x:return json.loads(x.read().decode())
          pending=set(boxes);messages_by_box={}
          for attempt in range(1,37):
              for name in list(pending):
                  data=get(name,'https://api.mail.tm/messages?page=1');messages=data if isinstance(data,list) else data.get('hydra:member',[])
                  if len(messages)>=len(expected[name]):messages_by_box[name]=messages;pending.remove(name)
              if not pending:break
              received=sum(len(messages_by_box.get(name,[])) for name in boxes)
              print(f'… low-volume deliveries boxes={4-len(pending)}/4 pending={sorted(pending)} attempt={attempt}/36')
              time.sleep(10)
          if pending:raise SystemExit(f'::error::missing low-volume deliveries: {sorted(pending)}')
          checked=set()
          for name,messages in messages_by_box.items():
              found=set()
              for message in messages[:len(expected[name])]:
                  d=get(name,'https://api.mail.tm/messages/'+message['id']);sender=d.get('from') or {};html='\n'.join(d.get('html') or []);attachments=d.get('attachments') or []
                  if (sender.get('address') or '').lower()!='no-reply@veloratrade.ir':raise SystemExit(f'::error::{name} From address mismatch')
                  if (sender.get('name') or '').strip()!='VELORA TRADE':raise SystemExit(f'::error::{name} From name mismatch')
                  inline={a.get('filename') for a in attachments if a.get('disposition')=='inline' and a.get('related') is True}
                  found |= inline & expected[name]
                  if not re.search(r'<img[^>]+src="attachment:[^"]+"[^>]*>',html,re.I):raise SystemExit(f'::error::{name} inline icon reference missing')
                  if any(x in html for x in ('✉️','✔','📊','🏆')):raise SystemExit(f'::error::{name} legacy emoji remains')
                  if '#9b782e' not in html.lower() or '#3b465a' not in html.lower():raise SystemExit(f'::error::{name} Gold Outline missing')
                  if not re.search(r'src="(cid|attachment):velora-logo"', html, re.I) or 'velora-email-logo.png' not in inline:raise SystemExit(f'::error::{name} logo must be embedded as cid:velora-logo with an inline attachment')
              if found!=expected[name]:raise SystemExit(f'::error::{name} icon set mismatch expected={sorted(expected[name])} found={sorted(found)}')
              checked |= found
              print(f'{name}: {len(messages)}/{len(expected[name])} DELIVERY+CID+FROM+DESIGN PASS')
          if len(checked)!=7:raise SystemExit(f'::error::only {len(checked)}/7 dedicated icons verified')
          print('TRANSACTIONAL_CID_DELIVERIES=7/7 PASS')
          PY

      - name: Summary
        run: |
          {
            echo '## Transactional Email + CID Icon Suite — Staging'
            echo
            echo '- Templates accepted by Resend: **${{ steps.send.outputs.count }}/7**'
            echo '- Isolated external inbox deliveries: **7/7**'
            echo '- Dedicated PNG CID attachments: **7/7**'
            echo '- Legacy emoji removed: **7/7**'
            echo '- Gold Outline + CID logo + From identity: ✅'
            echo '- Production touched: **No**'
          } >> "$GITHUB_STEP_SUMMARY"
