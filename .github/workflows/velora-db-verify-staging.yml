name: Velora DB Verification (STAGING) — reusable, read-only

# ============================================================================
# STAGING post-deploy (or standalone) READ-ONLY database verification — the
# staging counterpart of velora-db-verify.yml. It uploads a one-use, token-gated,
# random-named, self-deleting PHP probe (db_verify_probe.php.tmpl, __ENV__=staging)
# over FTP, invokes it once over HTTPS, and requires POSTDEPLOY_DB_OK. The probe
# only runs fixed SELECT/information_schema/SHOW-CREATE reads; it never mutates.
# HARD-LOCKED to staging: STAGING_FTP_* secrets, https://staging.veloratrade.ir,
# staging docroot. It also reports the advisory migration-schema inventory
# (Phase 2A columns/indexes + metaapi_fills) for before/after migration evidence.
# Callers `needs:` this and treat a non-OK result as a failed verification.
# ============================================================================

on:
  workflow_call:
    outputs:
      verification:
        value: ${{ jobs.verify.outputs.verification }}

permissions:
  contents: read

concurrency:
  group: velora-db-verify-staging
  cancel-in-progress: false

jobs:
  verify:
    name: staging — read-only DATABASE verification (POSTDEPLOY_DB_OK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verification: ${{ steps.run.outputs.verification }}
    env:
      FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      BASE_URL: "https://staging.veloratrade.ir"
      VENV: "staging"
      DOCROOT: "public_html/staging.veloratrade.ir"
    steps:
      - uses: actions/checkout@v4
      - name: Guard — staging FTP present (read-only; no backup token needed)
        run: |
          set -euo pipefail
          [ -n "${FTP_SERVER:-}" ] && [ -n "${FTP_USERNAME:-}" ] && [ -n "${FTP_PASSWORD:-}" ] \
            || { echo "::error::missing STAGING_FTP_* secrets (staging-only)"; exit 1; }
          [ "$VENV" == "staging" ] || { echo "::error::staging verifier invoked with wrong env"; exit 1; }
          echo "staging verify guard OK"
      - name: Install lftp
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -q lftp >/dev/null
      - name: Run one-use read-only DB verify probe
        id: run
        run: |
          set -euo pipefail
          NAME="_velora_verify_$(openssl rand -hex 8).php"
          TOKEN="$(openssl rand -hex 32)"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$NAME"; echo "::add-mask::$TOKEN"; echo "::add-mask::$HASH"
          export NAME HASH
          python3 - <<'PY'
          import os, pathlib
          tpl = pathlib.Path('ops/velora-mgmt/probe/db_verify_probe.php.tmpl').read_text()
          tpl = (tpl.replace('__HASH__', os.environ['HASH'])
                     .replace('__OP__', 'verify')
                     .replace('__ENV__', 'staging'))
          pathlib.Path('/tmp/db_verify_probe.php').write_text(tpl)
          PY
          cleanup() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; glob -a rm -f $DOCROOT/public/_velora_verify_*.php; bye" >/dev/null 2>&1 || true
            shred -u /tmp/db_verify_probe.php /tmp/verify.json 2>/dev/null || rm -f /tmp/db_verify_probe.php /tmp/verify.json
          }
          trap cleanup EXIT
          uploaded=0
          for attempt in $(seq 1 10); do
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; glob -a rm -f $DOCROOT/public/_velora_verify_*.php; put /tmp/db_verify_probe.php -o $DOCROOT/public/$NAME; bye"; then
              uploaded=1; break
            fi
            sleep 5
          done
          [ "$uploaded" == "1" ] || { echo "::error::staging verify probe upload failed"; exit 1; }
          code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' --max-time 120 \
                  -H "X-Velora-Mgmt: $TOKEN" "$BASE_URL/public/$NAME")
          echo "verify probe HTTP: $code"
          [ "$code" == "200" ] || { echo "::error::staging DB verify HTTP $code"; head -c 1500 /tmp/verify.json; exit 1; }
          cp /tmp/verify.json db-verify-staging-result.json
          RESULT=$(python3 - <<'PY'
          import json
          d=json.load(open('db-verify-staging-result.json'))
          assert d.get('env') == 'staging', 'verify probe did not report staging'
          if not d.get('ok'):
              print('POSTDEPLOY_DB_FAILED'); raise SystemExit(0)
          print(d.get('verification','POSTDEPLOY_DB_FAILED'))
          PY
          )
          echo "verification=$RESULT" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json,sys
          d=json.load(open('db-verify-staging-result.json'))
          checks=d.get('checks',{})
          print(json.dumps(checks, indent=2))
          mig=(checks.get('migration_schema') or {}).get('detail') or {}
          if mig:
              print('--- migration schema (advisory) ---')
              print('phase2a_applied      :', mig.get('phase2a_applied'))
              print('phase2a_missing cols :', mig.get('phase2a_columns_missing'))
              print('trading_accounts tz  :', mig.get('trading_accounts_timezone'), '/', mig.get('trading_accounts_timezone_source'))
              print('metaapi_fills_exists :', mig.get('metaapi_fills_exists'))
          if not d.get('ok'):
              sys.exit("::error::staging DATABASE verification FAILED")
          PY
          if [ "$RESULT" != "POSTDEPLOY_DB_OK" ]; then
            echo "::error::staging DATABASE verification did not return POSTDEPLOY_DB_OK"; exit 1
          fi
          echo "✅ staging DATABASE verification OK (POSTDEPLOY_DB_OK)"
      - name: Keep verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-staging-db-verify-${{ github.run_id }}
          path: db-verify-staging-result.json
          if-no-files-found: ignore
          retention-days: 30
