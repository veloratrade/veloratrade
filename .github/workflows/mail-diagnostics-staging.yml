name: Mail Diagnostics (Staging)

# VELORA — تشخیص علت نرسیدن ایمیل (فقط‌خواندنی)
#
# زنجیرهٔ شکسته: اپ → Exim هاست ✅ اما Exim → اینباکس گیرنده ❌
# این workflow از مسیر IMAP به جعبهٔ no-reply@veloratrade.ir متصل می‌شود و
# پیام‌های Bounce (Mail Delivery System) را می‌خواند — همان‌جا که دلیل دقیق رد
# شدن (کد SMTP / SPF / PTR / RBL / spam) نوشته شده است.
#
# قواعد:
#   • فقط‌خواندنی — هیچ ایمیلی ارسال/حذف نمی‌شود (BODY.PEEK)
#   • credential از velora.env روی هاست خوانده می‌شود (FTP استیجینگ موجود) — هیچ
#     سکرت جدیدی لازم نیست و رمز هرگز در لاگ چاپ نمی‌شود (add-mask)
#   • از بدنهٔ bounce ها فقط خطوط تشخیصی چاپ می‌شود؛ خطوط حاوی توکن فیلتر می‌شوند
#   • آدرس گیرنده‌ها نیمه‌ماسک می‌شوند (دامنه برای تشخیص لازم است)
#   • فقط workflow_dispatch + RUN

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'برای اجرا عبارت RUN را وارد کنید'
        required: true
        default: ''

permissions: {}

concurrency:
  group: mail-diagnostics-staging
  cancel-in-progress: false

jobs:
  diag:
    name: خواندن bounceها از صندوق no-reply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - name: دریافت velora.env استیجینگ (بدون نمایش) و استخراج credential ایمیل
        run: |
          set -uo pipefail
          [ "$INPUT_CONFIRM" = "RUN" ] || { echo "::error::ورودی confirm باید RUN باشد"; exit 1; }
          sudo apt-get install -y -q lftp > /dev/null
          attempt=0
          until [ $attempt -ge 10 ]; do
            attempt=$((attempt+1))
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; \
                  get velora_private_staging/config/velora.env -o /tmp/velora.env; bye" && break
            sleep 5
          done
          [ -s /tmp/velora.env ] || { echo "::error::velora.env دریافت نشد"; exit 1; }
          grep -E '^MAIL_(HOST|USER|PASS)=' /tmp/velora.env > /tmp/mail.env
          while IFS='=' read -r k v; do
            [ -n "$v" ] && echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < /tmp/mail.env
          shred -u /tmp/velora.env /tmp/mail.env 2>/dev/null || rm -f /tmp/velora.env /tmp/mail.env
          echo "credential‌ها mask و برای گام بعد آماده شدند (بدون چاپ مقدار)"

      - name: 'بازرسی IMAP — فهرست فولدرها + آمار + خطوط تشخیصی bounce'
        env:
          IMAP_HOST: ${{ env.MAIL_HOST }}
          IMAP_USER: ${{ env.MAIL_USER }}
          IMAP_PASS: ${{ env.MAIL_PASS }}
        run: |
          python3 <<'PY'
          import imaplib, re, os, sys
          host, user, pw = os.environ['IMAP_HOST'], os.environ['IMAP_USER'], os.environ['IMAP_PASS']
          DIAG = re.compile(r'(Diagnostic-Code|Status: [245]\.|Action:|Remote-MTA|rejected|defer|timeout|spam|block|list|PTR|rDNS|SPF|DKIM|DMARC|unrouteable|frozen|quota|retr(y|ies)|[245][0-9]{2} )', re.I)

          def maskline(s, n=180):
              s = re.sub(r'([A-Za-z0-9._%+-]{2})[A-Za-z0-9._%+-]*@', r'\1…@', s)
              return s[:n]

          try:
              M = imaplib.IMAP4_SSL(host, 993, timeout=30)
              print('اتصال IMAPS: OK')
              typ, _ = M.login(user, pw)
              print('لاگین:', typ)
          except Exception as e:
              print('::error::اتصال/لاگین IMAP شکست:', type(e).__name__, str(e)[:120]); sys.exit(1)

          typ, boxes = M.list()
          folders = [re.search(r'"?([^" ]+)"?$', b.decode('utf-8','replace').split(' "/" ')[-1] if ' "/" ' in b.decode('utf-8','replace') else b.decode('utf-8','replace')).group(1) for b in (boxes or [])]
          print('فولدرها:', folders)

          dsn_found = 0
          for folder in ['INBOX', 'INBOX.Junk', 'Junk', 'INBOX.spam', 'Spam']:
              try:
                  typ, data = M.select(f'"{folder}"', readonly=True)
              except Exception:
                  continue
              if typ != 'OK':
                  continue
              total = int((data[0] or b'0'))
              typ, ids = M.search(None, 'SINCE', '15-Aug-2026')
              recent = (ids[0].split() if ids and ids[0] else [])[-12:]
              print(f'\n── {folder}: {total} پیام | از ۱۵ اوت: {len(ids[0].split()) if ids and ids[0] else 0}')
              for mid in recent:
                  typ, h = M.fetch(mid, '(BODY.PEEK[HEADER.FIELDS (FROM SUBJECT DATE)])')
                  hdr = h[0][1].decode('utf-8','replace') if h and h[0] else ''
                  onel = ' | '.join(x.strip()[:70] for x in hdr.splitlines() if x.strip())
                  print('  ✉', maskline(onel))
                  if re.search(r'(Mail Delivery|Delivery Status|Undeliver|failure|returning message|delay)', hdr, re.I):
                      dsn_found += 1
                      typ, b = M.fetch(mid, '(BODY.PEEK[])')
                      raw = b[0][1].decode('utf-8','replace') if b and b[0] else ''
                      print('    ┌─ خطوط تشخیصی:')
                      for line in raw.splitlines():
                          if '#token=' in line:   continue
                          if DIAG.search(line):   print('    │', maskline(line.strip()))
              M.close()
          M.logout()
          print(f'\nنتیجه: {dsn_found} پیام Bounce/خطا پیدا شد')
          if dsn_found == 0:
              print('⚠️ هیچ bounce ای نیست — یا صندوق خالی است یا پیام‌ها در صف Exim گیر کرده‌اند (Track Delivery در cPanel را ببینید)')

      - name: 'تست خود-حلقه — ارسال به همان صندوق و بررسی رسیدن (تمایز صف‌داخلی/مسیرخارجی)'
        env:
          IMAP_HOST: ${{ env.MAIL_HOST }}
          IMAP_USER: ${{ env.MAIL_USER }}
          IMAP_PASS: ${{ env.MAIL_PASS }}
        run: |
          python3 <<'PY'
          import imaplib, smtplib, os, time, re, ssl
          host, user, pw = os.environ['IMAP_HOST'], os.environ['IMAP_USER'], os.environ['IMAP_PASS']
          mark = f'VELORA-DIAG-{int(time.time())}'
          print(f'::add-mask::{mark}')
          sent = None
          for port, mode in [(587, 'starttls'), (465, 'ssl')]:
              try:
                  if mode == 'ssl':
                      s = smtplib.SMTP_SSL(host, port, timeout=30, context=ssl.create_default_context())
                  else:
                      s = smtplib.SMTP(host, port, timeout=30); s.starttls(context=ssl.create_default_context())
                  s.login(user, pw)
                  s.sendmail(user, [user],
                      f'From: {user}\r\nTo: {user}\r\nSubject: {mark}\r\n\r\nself-loop diagnostic\r\n'.encode())
                  s.quit()
                  sent = (port, mode); print(f'ارسال خود-حلقه: پذیرفته شد از طریق {port}/{mode}')
                  break
              except Exception as e:
                  print(f'ارسال از {port}/{mode} شکست:', type(e).__name__, str(e)[:120])
          if not sent:
              print('::error::حتی اتصال SMTP از بیرون هم شکست خورد — پورت‌های submission هم بسته‌اند؟'); sys.exit(1)
          arrived = False
          for i in range(15):
              time.sleep(10)
              try:
                  M = imaplib.IMAP4_SSL(host, 993, timeout=25); M.login(user, pw); M.select('INBOX', readonly=True)
                  typ, ids = M.search(None, 'SUBJECT', f'"{mark}"')
                  M.close(); M.logout()
                  if typ == 'OK' and ids and ids[0].split():
                      arrived = True; break
              except Exception as e:
                  print('imap poll:', type(e).__name__)
              print(f'… انتظار رسیدن خود-حلقه ({i+1}/15)')
          verdict = 'ARRIVED' if arrived else 'NOT-ARRIVED'
          print(f'═══ نتیجهٔ خود-حلقه: {verdict}')
          PY

      - name: 'پروب عمیق — error_log هاست + mail.log + resend با گزارش sent + حضور فایل‌های کلیدی'
        env:
          IMAP_HOST: ${{ env.MAIL_HOST }}
          IMAP_USER: ${{ env.MAIL_USER }}
          IMAP_PASS: ${{ env.MAIL_PASS }}
          BASE: https://staging.veloratrade.ir
        run: |
          set -uo pipefail
          sudo apt-get install -y -q lftp > /dev/null
          echo "═══ A) فایل‌های کلیدی روی سرور"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30
          cd public_html/staging.veloratrade.ir
          cls -l api/src/Core/Mailer.php api/src/Core/Locale/LocaleManager.php public/locales/manifest.json
          cls -l error_log api/error_log 2>/dev/null
          echo "── private logs:"
          cls -l ../../velora_private_staging/logs/ 2>/dev/null
          cls -l ../../velora_private_staging/config/velora.env
          bye
          LFTP
          echo "═══ A2) محتوای AuthController روی سرور (فیکس 08188cb حاضر است؟)"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
            -e "set ftp:ssl-allow no; set net:timeout 30; cat public_html/staging.veloratrade.ir/api/src/Auth/AuthController.php; bye" 2>/dev/null \
            | grep -E "Response::json\(\\\$result, 201\)|respondWithSession\(\\\$result" | head -3
          echo "═══ B) دم‌های لاگ (فیلتر توکن، ۸۰ خط آخر):"
          for f in "velora_private_staging/logs/mail.log" "public_html/staging.veloratrade.ir/api/error_log"; do
            echo "── $f:"
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:timeout 30; get $f -o /tmp/lg; bye" 2>/dev/null \
              && (tail -80 /tmp/lg | grep -vE '#token=' | sed -E 's/([A-Za-z0-9._%+-]{2})[A-Za-z0-9._%+-]*@/\1…@/g' | cut -c1-200; rm -f /tmp/lg) \
              || echo "   (وجود ندارد یا خالی)"
          done
          echo "═══ C) ثبت‌نام محلی تازه + resend با مقدار sent:"
          python3 <<'PY'
          import json, os, re, time, urllib.request, urllib.error, random, string
          BASE = os.environ['BASE']; user = os.environ['IMAP_USER']
          def http(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Accept', 'application/json')
              if data is not None: req.add_header('Content-Type', 'application/json')
              req.add_header('Origin', BASE)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r: return r.status, r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code, e.read().decode('utf-8','replace')
          local, domain = user.split('@')
          cand = f'{local}+rs{int(time.time())}@{domain}'
          print(f'::add-mask::{cand}')
          pw = 'Vt!' + ''.join(random.choices(string.ascii_letters + string.digits, k=12))
          st, body = http('POST', f'{BASE}/api/v1/auth/register', {'email': cand, 'password': pw, 'fullName': 'Probe', 'timezone': 'UTC'})
          print('register:', st)
          time.sleep(70)
          st, body = http('POST', f'{BASE}/api/v1/auth/resend-verification', {'email': cand})
          print('resend-verification:', st)
          try:
              d = json.loads(body)
              print('پاسخ:', json.dumps({k: v for k, v in (d.get('data') or d.get('error') or {}).items() if k in ('sent','alreadyVerified','code','messageKey')}, ensure_ascii=False))
          except Exception:
              print('بدنه:', body[:200])
          PY

      - name: 'ثبت‌نام با آدرس محلی + خواندن و تحلیل ایمیلِ قالب واقعی (خالی؟ لینک دارد؟)'
        env:
          IMAP_HOST: ${{ env.MAIL_HOST }}
          IMAP_USER: ${{ env.MAIL_USER }}
          IMAP_PASS: ${{ env.MAIL_PASS }}
          BASE: https://staging.veloratrade.ir
        run: |
          python3 <<'PY'
          import imaplib, re, os, sys, time, json, random, string, urllib.request, urllib.error, email
          from email import policy
          host, user, pw = os.environ['IMAP_HOST'], os.environ['IMAP_USER'], os.environ['IMAP_PASS']
          BASE = os.environ['BASE']

          def maskline(s, n=170):
              s = re.sub(r'#token=[0-9a-f]{64}', '#token=***', str(s))
              s = re.sub(r'([A-Za-z0-9._%+-]{2})[A-Za-z0-9._%+-]*@', r'\1…@', s)
              return s[:n]

          def http(method, url, data=None, headers=None, timeout=25):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Accept', 'application/json')
              if data is not None: req.add_header('Content-Type', 'application/json')
              for k, v in (headers or {}).items(): req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')

          local, domain = user.split('@')
          plusaddr = f'{local}+e2e{int(time.time())}@{domain}'
          jpw = 'Vt!' + ''.join(random.choices(string.ascii_letters + string.digits, k=12))
          print(f'::add-mask::{plusaddr}')

          sent_for = None
          for cand in (user, plusaddr):
              st, body = http('POST', f'{BASE}/api/v1/auth/register',
                  {'email': cand, 'password': jpw, 'fullName': 'E2E Local', 'timezone': 'UTC'}, {'Origin': BASE})
              print('register →', st, 'برای', maskline(cand))
              if st == 201: sent_for = cand; break
          if not sent_for:
              print('::error::register نتوانست ایمیلی صادر کند (هردو آدرس ناموفق)'); sys.exit(1)

          M0 = imaplib.IMAP4_SSL(host, 993, timeout=30); M0.login(user, pw); M0.select('INBOX', readonly=True)
          typ, ids = M0.search(None, 'ALL')
          before = set(ids[0].split()) if ids and ids[0] else set()
          M0.close(); M0.logout()

          found = None
          for i in range(18):
              time.sleep(10)
              try:
                  M = imaplib.IMAP4_SSL(host, 993, timeout=25); M.login(user, pw); M.select('INBOX', readonly=True)
                  typ, ids = M.search(None, 'ALL')
                  now = set(ids[0].split()) if ids and ids[0] else set()
                  new = sorted(now - before, key=int)
                  if new:
                      typ, data = M.fetch(new[-1], '(BODY.PEEK[])')
                      M.close(); M.logout()
                      if typ == 'OK' and data and data[0]:
                          found = data[0][1]; break
                  M.close(); M.logout()
              except Exception as e:
                  print('imap poll:', type(e).__name__)
              print(f'… انتظار ایمیل قالب‌دار محلی ({i+1}/18)')
          if not found:
              print('⚠️ نتیجه: ایمیل قالب‌دار حتی به صندوق محلی نرسید (به پروب عمیق رجوع کنید)')
              sys.exit(0)

          msg = email.message_from_bytes(found, policy=policy.default)
          print('═══ ایمیل رسید (محلی) — تحلیل:')
          print('  Subject :', maskline(msg.get('Subject')))
          print('  To      :', maskline(msg.get('To')))
          print('  Type    :', msg.get_content_type(), '| CTE:', msg.get('Content-Transfer-Encoding'), '| اندازه خام:', len(found), 'بایت')
          texts, htmls = [], []
          for part in msg.walk():
              ct = part.get_content_type()
              if ct in ('text/plain', 'text/html'):
                  try: payload = part.get_content()
                  except Exception: payload = ''
                  (htmls if ct == 'text/html' else texts).append(payload or '')
          h = '\n'.join(htmls); t = '\n'.join(texts)
          print(f'  طول text/plain: {len(t.strip())} | طول text/html: {len(h.strip())}')
          has_link = 'verify-email#token=' in h or 'verify-email#token=' in t
          print('  لینک تأیید در بدنه:', '✅ موجود' if has_link else '❌ نیست')
          snippet = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', h or t)).strip()[:280]
          print('  نمونه بدنه:', maskline(snippet) if snippet else '(خالی!)')
          print()
          if (h or t).strip():
              print('🏁 نتیجه: پیام «خالی» نیست — قالب سالم رندر و تحویل محلی شد')
          else:
              print('🏁 نتیجه: بدنه خالی است — باگ قالب/انکودینگ تأیید شد')
          PY
