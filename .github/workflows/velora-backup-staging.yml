name: Velora DB Backup — STAGING real dump (FTP+probe; upload boundary)

# ============================================================================
# STAGING-ONLY real database backup via the EXISTING staging infrastructure:
#   Actions -> STAGING_FTP_* secrets -> one-use PHP probe in docroot ->
#   Velora\Core\Database::connection() -> consistent logical dump -> gzip ->
#   SHA-256 -> private root (OUTSIDE webroot) -> FTP retrieve -> local verify.
#
# This workflow performs NO GitHub upload by itself: the Actions auto-token
# (GITHUB_TOKEN) is scoped to veloratrade/veloratrade and CANNOT write the
# separate private repo veloratrade/velora-backups. BACKUP_REPO_TOKEN has
# intentionally NOT been created. Therefore, after the dump is produced and
# verified, this workflow STOPS at the upload boundary and emits the exact
# message required by policy. No token is embedded; no secret is printed.
#
# SAFETY:
#   * Trigger workflow_dispatch ONLY (no pull_request/push/fork).
#   * Hard-locked to environment=staging (the choice list has only 'staging');
#     production is refused both here and server-side in the probe.
#   * Read-only DB operation (consistent logical dump). No INSERT/UPDATE/DELETE/
#     ALTER/DROP/CREATE is executed against the live DB (DDL is written to file).
#   * The one-use probe is token-gated (hash_equals), random-named, self-deletes;
#     the dump lives only under velora_private_staging/backups (outside docroot).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "MUST be staging (production is not supported by this workflow)"
        required: true
        type: choice
        options: [staging]
      cleanup_remote:
        description: "Remove the remote private-root dump after local verification?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: velora-backup-staging
  cancel-in-progress: false

jobs:
  staging_backup:
    name: staging — real DB dump via one-use probe (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER:   ${{ secrets.STAGING_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
      DOCROOT: "public_html/staging.veloratrade.ir"
      BASE_URL: "https://staging.veloratrade.ir"
      VENV: "staging"
    steps:
      - uses: actions/checkout@v4

      - name: Guard — staging only + FTP secrets present
        env:
          CHOICE: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          [ -n "${FTP_SERVER:-}" ] && [ -n "${FTP_USERNAME:-}" ] && [ -n "${FTP_PASSWORD:-}" ] \
            || { echo "::error::missing STAGING_FTP_* secrets"; exit 1; }
          [[ "$CHOICE" == "staging" ]] || { echo "::error::this workflow is staging-only"; exit 1; }
          echo "staging-only guard OK"

      - name: Install lftp
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -q lftp >/dev/null

      - name: Build, upload, invoke one-use backup probe; retrieve dump
        env:
          CLEANUP_REMOTE: ${{ github.event.inputs.cleanup_remote }}
        run: |
          set -euo pipefail
          NAME="_velora_bk_$(openssl rand -hex 8).php"
          TOKEN="$(openssl rand -hex 32)"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$NAME"; echo "::add-mask::$TOKEN"; echo "::add-mask::$HASH"
          export NAME HASH
          python3 - <<'PY'
          import os, pathlib
          tpl = pathlib.Path('ops/velora-mgmt/probe/db_backup_probe.php.tmpl').read_text()
          tpl = (tpl.replace('__HASH__', os.environ['HASH'])
                     .replace('__OP__', 'backup')
                     .replace('__ENV__', 'staging'))
          pathlib.Path('/tmp/db_backup_probe.php').write_text(tpl)
          PY

          cleanup_remote() {
            # best-effort removal of THIS one-use probe from the docroot
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
              -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; glob -a rm -f $DOCROOT/public/_velora_bk_*.php; bye" >/dev/null 2>&1 || true
            shred -u /tmp/db_backup_probe.php /tmp/bk.json 2>/dev/null || rm -f /tmp/db_backup_probe.php /tmp/bk.json
          }
          trap cleanup_remote EXIT

          # 1) ensure private backups dir exists (outside docroot), then upload probe
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
            -e "set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; mkdir -p velora_private_staging/backups; glob -a rm -f $DOCROOT/public/_velora_bk_*.php; put /tmp/db_backup_probe.php -o $DOCROOT/public/$NAME; bye"

          # 2) invoke once over HTTPS with the one-time bearer token
          code=$(curl -sS -o /tmp/bk.json -w '%{http_code}' --max-time 180 \
                  -H "X-Velora-Mgmt: $TOKEN" "$BASE_URL/public/$NAME")
          echo "probe HTTP: $code"
          [[ "$code" == "200" ]] || { echo "::error::backup probe HTTP $code"; head -c 1500 /tmp/bk.json; exit 1; }
          cp /tmp/bk.json bk-probe-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('bk-probe-result.json'))
          assert d.get('ok') is True, d
          assert d.get('env') == 'staging', 'environment must be staging'
          print('backup_id   :', d['backup_id'])
          print('engine      :', d['engine'], d['engine_version'])
          print('tables/views:', d['table_count'], '/', d['view_count'])
          print('dump bytes  :', d['dump_size_bytes'])
          print('sha256      :', d['sha256'])
          print('gzip_valid  :', d['gzip_valid'], '->', d['verification_status'])
          print('ftp path    :', d['private_ftp_path'])
          PY

          # 3) retrieve the dump over FTP from the PRIVATE root (never the docroot)
          FTP_REL=$(python3 -c "import json;print(json.load(open('bk-probe-result.json'))['private_ftp_path'])")
          echo "retrieving $FTP_REL"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" \
            -e "set ftp:ssl-allow no; set net:max-retries 3; set net:timeout 60; get $FTP_REL -o dump.sql.gz; bye"
          ls -l dump.sql.gz

      - name: Local verification (size, gzip integrity, SHA-256 match)
        run: |
          set -euo pipefail
          [ -s dump.sql.gz ] || { echo "::error::dump missing or empty"; exit 1; }
          gzip -t dump.sql.gz && echo "gzip integrity: OK"
          LOCAL_SHA=$(sha256sum dump.sql.gz | awk '{print $1}')
          REMOTE_SHA=$(python3 -c "import json;print(json.load(open('bk-probe-result.json'))['sha256'])")
          LOCAL_SIZE=$(stat -c%s dump.sql.gz)
          REMOTE_SIZE=$(python3 -c "import json;print(json.load(open('bk-probe-result.json'))['dump_size_bytes'])")
          echo "local sha256 : $LOCAL_SHA"
          echo "remote sha256: $REMOTE_SHA"
          [ "$LOCAL_SHA" == "$REMOTE_SHA" ] || { echo "::error::SHA-256 mismatch"; exit 1; }
          [ "$LOCAL_SIZE" == "$REMOTE_SIZE" ] || { echo "::error::size mismatch"; exit 1; }
          echo "checksum+size match: INTEGRITY_VERIFIED (restore NOT verified)"
          # quick sanity: dump contains SQL structure markers
          if zcat dump.sql.gz | head -c 4000 | grep -q "Velora database logical backup"; then
            echo "dump header marker: OK"
          else
            echo "::warning::dump header marker not found"
          fi

      - name: Upload boundary — Actions cannot write velora-backups
        run: |
          set -euo pipefail
          echo "::error::Backup creation succeeded, but GitHub Actions requires a separate credential to upload to velora-backups."
          echo "::error::GITHUB_TOKEN is scoped to veloratrade/veloratrade only and cannot access the private repo veloratrade/velora-backups."
          echo "::error::BACKUP_REPO_TOKEN was intentionally NOT created. No token embedded; no upload performed."
          echo "::error::The verified staging dump (dump.sql.gz) is retained as a run artifact for inspection."
          exit 2

      - name: Retain verified dump as a run artifact (NOT a permanent backup store)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-staging-db-dump-${{ github.run_id }}
          path: |
            dump.sql.gz
            bk-probe-result.json
          if-no-files-found: ignore
          retention-days: 14
