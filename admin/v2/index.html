<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<script src="/public/assets/velora-latin-digits.js?v=2026.08.30.2"></script>
<script src="/public/assets/velora-data.js?v=2026.08.30.2"></script>
<script>
/* F-1 pre-paint restore (theme/lang) — no FOUC, no server persistence */
(function(){try{
 var th=localStorage.getItem("velora_theme");if(th!=="light"&&th!=="dark")th="dark";
 document.documentElement.dataset.theme=th;
 var lg=localStorage.getItem("velora_locale");if(lg!=="en"&&lg!=="fa")lg="fa";
 document.documentElement.lang=lg;document.documentElement.dir=(lg==="fa"?"rtl":"ltr");
}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELORA ADMIN — Console</title>
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --font:"Estedad","Geist","Vazirmatn","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono","Estedad",ui-monospace,SFMono-Regular,monospace;
  --r-sm:8px;--r:12px;--r-lg:20px;
  --sp:4px; /* spacing scale base 4 */
  --sb-w:232px;--sb-w-rail:64px;--tb-h:52px;
  --tnum:font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
[data-theme="dark"]{
  --bg:#04050a;--surface:rgba(255,255,255,.028);--surface2:rgba(255,255,255,.05);--surface3:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#edf1f7;--text2:#cbd5e1;--muted:#8ea0b3;
  --accent:#e9c45c;--accent-ink:#1c1303;--accent-soft:rgba(233,196,92,.12);
  --ok:#3ddc84;--ok-soft:rgba(61,220,132,.13);
  --warn:#e9c45c;--warn-soft:rgba(233,196,92,.13);
  --err:#ff6b6b;--err-soft:rgba(255,107,107,.13);
  --info:#8ab4ff;--info-soft:rgba(138,180,255,.13);
  --neutral:#8ea0b3;--neutral-soft:rgba(142,160,179,.13);
  --shadow:0 18px 60px rgba(0,0,0,.55);--shadow-sm:0 8px 25px rgba(0,0,0,.4);
  --thead:transparent;
}
[data-theme="light"]{
  --bg:#f4f1e9;--surface:#ffffff;--surface2:#faf8f2;--surface3:#f1ede2;
  --border:rgba(28,19,3,.10);--border2:rgba(28,19,3,.18);
  --text:#1c1303;--text2:#57503f;--muted:#6f6a5a;
  --accent:#8a6a1f;--accent-ink:#fff;--accent-soft:rgba(201,148,43,.13);
  --ok:#1e9e5f;--ok-soft:rgba(30,158,95,.11);
  --warn:#9a6a06;--warn-soft:rgba(154,106,6,.10);
  --err:#c93b3b;--err-soft:rgba(201,59,59,.09);
  --info:#2b66ac;--info-soft:rgba(43,102,172,.09);
  --neutral:#6f6a5a;--neutral-soft:rgba(111,106,90,.11);
  --shadow:0 18px 60px rgba(28,19,3,.13);--shadow-sm:0 8px 25px rgba(28,19,3,.09);
  --thead:transparent;
}
/* ============================= BASE ============================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:clip}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.55;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* ============================= SHELL ============================= */
.skip{position:absolute;inset-inline-start:-9999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:var(--r);z-index:99}
.skip:focus{inset-inline-start:8px}
.app{display:flex;min-height:100vh}
/* --- sidebar --- */
.sidebar{width:var(--sb-w);flex-shrink:0;background:var(--surface);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;transition:width .18s}
.sidebar .brand{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
/* Real VELORA site logo (verbatim site treatment): glass tile + wordmark + gradient tagline */
.brand .logo-mark{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;
  background:linear-gradient(140deg,rgba(212,175,55,.16),rgba(212,175,55,.04));
  border:1px solid rgba(212,175,55,.34);
  box-shadow:0 0 22px rgba(212,175,55,.28),inset 0 0 14px rgba(212,175,55,.08)}
.brand .logo-mark svg{width:26px;height:26px;filter:drop-shadow(0 0 6px rgba(233,196,92,.5))}
.brand .logo-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .logo-txt b{font-size:18px;font-weight:700;color:var(--text);letter-spacing:.2px;line-height:1.15}
.brand .logo-txt i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.42em;margin-top:2px;
  background:linear-gradient(120deg,#f9e6a8 0%,#e8c45a 38%,#c9942b 68%,#f2d67c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.navgroup{padding:12px 10px 2px}
.navgroup .gtitle{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;padding:0 8px 6px}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:start;padding:7px 10px;border-radius:var(--r);
  color:var(--text2);font-size:12.5px;margin-bottom:1px;border:1px solid transparent}
.navitem:hover{background:var(--surface2);color:var(--text)}
.navitem.active{background:var(--accent-soft);color:var(--text);border-color:color-mix(in srgb,var(--accent) 25%,transparent);font-weight:600}
.navitem .ic{width:16px;height:16px;flex-shrink:0;opacity:.85}
.navitem .cnt{margin-inline-start:auto;font-size:10.5px;color:var(--muted);background:var(--surface3);border-radius:10px;padding:1px 7px}
.sidebar .foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted)}
.envpill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.5px;
  color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  padding:2px 8px;border-radius:20px}
.envpill .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
/* --- main / topbar --- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--tb-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;padding:0 16px;position:sticky;top:0;z-index:30}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.tb-spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 9px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text2);font-size:12px}
.tbtn:hover{border-color:var(--border2);color:var(--text)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ffb703,#d4af37);
  border:2px solid #fff0bd;box-shadow:0 0 15px rgba(255,183,3,.45);
  display:grid;place-items:center;font-size:11px;font-weight:900;color:#060a14}
.view{padding:18px 20px 60px;max-width:1440px;width:100%;margin:0 auto}
/* --- mockup banner --- */
.mockbanner{background:linear-gradient(90deg,var(--accent-soft),transparent);border-bottom:1px dashed var(--accent);
  color:var(--text2);font-size:11.5px;padding:6px 16px;display:flex;gap:8px;align-items:center}
.mockbanner b{color:var(--accent)}
/* ============================= COMPONENTS ============================= */
.pagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-size:17px;font-weight:800;letter-spacing:.2px}
.pagehead .desc{color:var(--text2);font-size:12px;margin-top:3px;max-width:640px}
.pagehead .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--r);
  font-size:12.5px;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--text);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:var(--err-soft)}
.btn.danger:hover{border-color:var(--err)}
.btn.sm{height:27px;padding:0 10px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.card .ch{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border)}
.card .ch h3{font-size:13px;font-weight:700}
.card .ch .hint{font-size:11px;color:var(--muted)}
.card .ch .right{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.card .cb{padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.2px}
.badge .bdot{width:5px;height:5px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.b-err{color:var(--err);background:var(--err-soft);border:1px solid color-mix(in srgb,var(--err) 30%,transparent)}
.b-warn{color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.b-info{color:var(--info);background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.b-neutral{color:var(--neutral);background:var(--neutral-soft);border:1px solid color-mix(in srgb,var(--neutral) 30%,transparent)}
.b-accent{color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
/* KPI */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px}
.kpi .lbl{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:.3px}
.kpi .delta{font-size:10.5px;margin-top:2px;color:var(--muted)}
.kpi .delta.up{color:var(--ok)}.kpi .delta.down{color:var(--err)}
/* tables */
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.tbl thead th{background:var(--thead);color:var(--text2);font-size:10.5px;font-weight:700;letter-spacing:.5px;
  text-align:start;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.tbl tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr.rowlink{cursor:pointer}
.tbl tbody tr.rowlink:hover{background:var(--surface2)}
.cellmain{font-weight:600}
.cellsub{font-size:10.5px;color:var(--muted)}
.uavatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;
  background:var(--surface3);border:1px solid var(--border2);color:var(--text2);margin-inline-end:8px;vertical-align:middle}
.pager{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--border);flex-wrap:wrap}
.pager .info{font-size:11px;color:var(--muted);margin-inline-end:auto}
.pgbtn{min-width:28px;height:27px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);
  color:var(--text2);font-size:11.5px;padding:0 8px}
.pgbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pgbtn:disabled{opacity:.4;cursor:not-allowed}
/* filter bar */
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.inp{height:32px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:0 11px;font-size:12.5px;min-width:150px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{padding-inline-end:26px}
.chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 11px;border-radius:20px;font-size:11.5px;
  border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);background:var(--surface3);
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px}
.fchip button{color:var(--muted);font-size:12px;line-height:1}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;font-size:12.5px;color:var(--text2);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
/* states */
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);
  background-size:200% 100%;animation:sk 1.1s infinite;border-radius:var(--r-sm)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.statebox{text-align:center;padding:44px 20px;color:var(--muted)}
.statebox .big{font-size:30px;margin-bottom:10px;opacity:.8}
.statebox .t{font-size:13.5px;font-weight:700;color:var(--text2)}
.statebox .s{font-size:11.5px;margin-top:4px;max-width:380px;margin-inline:auto}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:var(--r);font-size:12px;border:1px solid;margin-bottom:12px}
.alert.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--text)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--text)}
.alert.err{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 30%,transparent);color:var(--text)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--text)}
/* toggle */
.tgl{width:34px;height:19px;border-radius:20px;background:var(--surface3);border:1px solid var(--border2);position:relative;transition:.15s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:.15s}
.tgl.on{background:var(--ok);border-color:var(--ok)}
.tgl.on::after{background:#fff;inset-inline-start:17px}
/* progress ring */
.ring{transform:rotate(-90deg)}
/* provider card */
.prov{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;gap:14px}
.prov .plogo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;border:1px solid var(--border2)}
.prov .rows{flex:1;min-width:0}
.prov .pname{font-weight:800;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prov .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--text2)}
.prov .meta b{color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text2)}
.kv .v{font-weight:600}
/* drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(4,8,14,.62);z-index:60;display:flex;align-items:stretch;justify-content:flex-end}
html[dir="ltr"] .overlay{justify-content:flex-start}
.drawer{width:min(460px,94vw);background:var(--surface);border-inline-start:1px solid var(--border);height:100%;
  overflow-y:auto;box-shadow:var(--shadow);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(-16px);opacity:.4}to{transform:none;opacity:1}}
.modalwrap{position:fixed;inset:0;background:rgba(4,8,14,.62);z-index:70;display:grid;place-items:center;padding:16px}
.modal{width:min(480px,94vw);background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-lg);
  box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
.modal .mh{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:16px;font-size:12.5px;color:var(--text2)}
.modal .mf{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* toast */
#toasts{position:fixed;bottom:16px;inset-inline-start:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border2);border-inline-start:3px solid var(--ok);
  border-radius:var(--r);padding:10px 14px;font-size:12px;box-shadow:var(--shadow-sm);animation:pop .18s}
/* timeline */
.tline{position:relative;padding-inline-start:18px}
.tline::before{content:"";position:absolute;inset-inline-start:5px;top:4px;bottom:4px;width:1px;background:var(--border2)}
.tline .tl{position:relative;padding-bottom:12px;font-size:12px}
.tline .tl::before{content:"";position:absolute;inset-inline-start:-17px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tline .tl .t2{color:var(--muted);font-size:10.5px}
/* misc */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-top:8px}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:9px;height:9px;border-radius:3px}
.note{font-size:10.5px;color:var(--muted);margin-top:8px}
.divider{height:1px;background:var(--border);margin:14px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;direction:ltr;unicode-bidi:embed}
.watermark{position:fixed;bottom:14px;inset-inline-end:14px;z-index:5;font-size:10px;font-weight:800;letter-spacing:2px;
  color:var(--muted);opacity:.5;pointer-events:none;border:1px dashed var(--border2);padding:4px 10px;border-radius:20px}
/* ============================= RESPONSIVE ============================= */
.menu-btn{display:none}
/* v2.1: desktop sidebar expanded by default; icon-rail only via explicit toggle (.app.rail) */
@media(max-width:768px){
  .app.rail .sidebar{width:min(280px,86vw)}
  .app.rail .navitem{justify-content:flex-start;padding:9px 13px}
  .app.rail .navitem .ic{width:16px;height:16px}
  .app.rail .navitem:hover::after{display:none}
  .app.rail .navitem span,.app.rail .navitem .cnt,.app.rail .gtitle,.app.rail .ghead,.app.rail .gitems,.app.rail .sidebar .foot,.app.rail .sidebar .name,.app.rail .sidebar .sub,.app.rail .brand>div:last-child{display:block}
  .app.rail .envblock{justify-content:flex-start;text-align:start}
  .app.rail .envblock>div:first-child{display:block}
}
@media(max-width:768px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;transform:translateX(100%);width:min(280px,86vw);transition:transform .2s}
  html[dir="ltr"] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none!important}
  html[dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)!important}
  .menu-btn{display:inline-flex}
  .view{padding:14px 12px 70px}
  .pagehead .actions{width:100%;margin-inline-start:0}
  .tbl{min-width:640px}
}

/* ===================== BRAND LAYER — VELORA site language =====================
   Source: root site palette (#04050a bg · rgba white cards · #e9c45c/#c9942b gold
   · #3ddc84 green · #ff6b6b red · Estedad/Geist/Geist Mono · r20/99 · deep shadows
   + restrained gold radial ambience). Dense + operational, not decorative. */
html{background:var(--appbg,#04050a)}
body{background:var(--appbg,#04050a)}
[data-theme="light"]{--appbg:#ece8dc}
[data-theme="light"] body::before{opacity:.4}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(ellipse 72% 46% at 50% -6%,rgba(212,175,55,.085),transparent 62%),
            radial-gradient(ellipse 40% 30% at 88% 108%,rgba(212,175,55,.05),transparent 65%)}
.app{position:relative;z-index:1}
::selection{background:rgba(233,196,92,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.num,.mono{font-family:var(--mono)}
h1{letter-spacing:-.01em}
/* ---- brand block ---- */
.brand .logo-mark{background:linear-gradient(140deg,rgba(212,175,55,.22),rgba(212,175,55,.08));
 border-color:rgba(138,106,31,.35);box-shadow:0 0 18px rgba(212,175,55,.25),inset 0 0 12px rgba(212,175,55,.1)}
.brand .logo-txt i{background:linear-gradient(120deg,#b8862a 0%,#8f6b1d 38%,#7a5a15 68%,#a67c1e 100%);
 -webkit-background-clip:text;background-clip:text}
.foot .envpill{border:1px solid rgba(61,220,132,.3);color:var(--ok);background:rgba(61,220,132,.07)}
/* ---- cards: white-alpha, deep shadow, inset top light ---- */
.card{background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.014));
 border:1px solid rgba(255,255,255,.06);border-radius:var(--r-lg);
 box-shadow:var(--shadow-sm),inset 0 1px rgba(255,255,255,.05);
 transition:border-color .18s,box-shadow .18s,transform .18s}
.card:hover{border-color:rgba(255,255,255,.11);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.06)}
.card>.ch{border-bottom:1px solid rgba(255,255,255,.05)}
[data-theme="light"] .card{background:#fff;border-color:rgba(28,19,3,.08);
 box-shadow:0 10px 34px rgba(28,19,3,.09),inset 0 1px #fff}
[data-theme="light"] .card:hover{border-color:rgba(28,19,3,.16);box-shadow:0 18px 50px rgba(28,19,3,.13)}
[data-theme="light"] .card>.ch{border-bottom-color:rgba(28,19,3,.06)}
/* ---- KPI: icon tile + big number + ambient gold corner + spark ---- */
.kpi{position:relative;background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.014));
 border:1px solid rgba(255,255,255,.06);border-radius:var(--r-lg);padding:14px 16px 13px;
 box-shadow:var(--shadow-sm),inset 0 1px rgba(255,255,255,.05);overflow:hidden;
 transition:border-color .18s,box-shadow .18s}
.kpi:hover{border-color:rgba(233,196,92,.28);box-shadow:var(--shadow),0 0 44px rgba(212,175,55,.10)}
.kpi::after{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:92px;height:92px;border-radius:50%;
 background:radial-gradient(circle,rgba(233,196,92,.11),transparent 70%);pointer-events:none}
.kpi .lbl{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.kpi .val{font-size:25px;font-weight:800;margin-top:5px}
.kpi .delta{margin-top:7px;font-size:10.5px}
.kpi .ktile{position:absolute;inset-inline-end:13px;top:13px;width:34px;height:34px;border-radius:11px;
 display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
 border:1px solid rgba(233,196,92,.20)}
.kpi .ktile svg{width:17px;height:17px}
.kpi .spark{position:absolute;inset-inline:16px;bottom:6px;height:24px;width:calc(100% - 32px);color:var(--accent);opacity:.45}
.kpi:has(.spark) .delta{margin-bottom:14px}
[data-theme="light"] .kpi{background:#fff;border-color:rgba(28,19,3,.08);box-shadow:0 10px 34px rgba(28,19,3,.08)}
/* ---- buttons ---- */
.btn{border-radius:12px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#f0cd6a,#c9942b);color:#1c1303;border-color:transparent;
 box-shadow:0 6px 20px rgba(212,175,55,.26),inset 0 1px rgba(255,255,255,.45)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:#ff8d8d;border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
[data-theme="light"] .btn.danger{color:#c93b3b}
.btn:not(.primary):not(.danger){background:rgba(255,255,255,.045)}
[data-theme="light"] .btn:not(.primary):not(.danger){background:#fff}
/* ---- chips / filter ---- */
.chip.on,.fchip{background:var(--accent-soft);border-color:rgba(233,196,92,.3);color:var(--accent)}
.inp{border-radius:12px;background:rgba(255,255,255,.045)}
[data-theme="light"] .inp{background:#fff}
/* ---- sidebar / nav ---- */
.gtitle{color:rgba(233,196,92,.55);letter-spacing:.16em;font-size:9.5px;font-weight:800}
.navitem{border-radius:12px;border:1px solid transparent}
.navitem:hover{background:rgba(255,255,255,.045)}
.navitem.active{background:linear-gradient(90deg,rgba(233,196,92,.14),rgba(233,196,92,.03));
 color:var(--accent);border-color:rgba(233,196,92,.22);box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] .navitem.active{box-shadow:inset -3px 0 0 var(--accent)}
.navitem .cnt{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(233,196,92,.25)}
[data-theme="light"] .navitem.active{background:linear-gradient(90deg,rgba(201,148,43,.14),rgba(201,148,43,.03));box-shadow:inset 3px 0 0 #8a6a1f}
[data-theme="light"][dir="rtl"] .navitem.active{box-shadow:inset -3px 0 0 #8a6a1f}
/* ---- topbar ---- */
.topbar{background:rgba(4,5,10,.72);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05)}
[data-theme="light"] .topbar{background:rgba(244,241,233,.82)}
/* ---- tables ---- */
.tbl th{background:transparent;font-size:10px;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.08)}
.tbl td{border-bottom:1px solid rgba(255,255,255,.04)}
.tbl tbody tr:hover td{background:rgba(255,255,255,.03)}
.twrap{border:1px solid rgba(255,255,255,.06);border-radius:16px;background:rgba(255,255,255,.014)}
[data-theme="light"] .tbl th{border-bottom-color:rgba(28,19,3,.1)}
[data-theme="light"] .tbl td{border-bottom-color:rgba(28,19,3,.06)}
[data-theme="light"] .tbl tbody tr:hover td{background:rgba(28,19,3,.03)}
[data-theme="light"] .twrap{border-color:rgba(28,19,3,.08);background:#fff}
.uavatar{background:linear-gradient(135deg,rgba(233,196,92,.28),rgba(201,148,43,.14));color:#f7e3a1;
 border:1px solid rgba(233,196,92,.28);font-weight:700}
[data-theme="light"] .uavatar{color:#8a6a1f}
/* ---- pills / tabs / pager ---- */
.badge{border-radius:99px;font-weight:700}
.tab{border-bottom:2px solid transparent;border-radius:0}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:transparent}
.pgbtn{border-radius:10px;background:rgba(255,255,255,.04)}
.pgbtn.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(233,196,92,.32)}
/* ---- overlays: restrained brand glass ---- */
.modal,.drawer{background:#0a0d16;border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 60px rgba(0,0,0,.6)}
[data-theme="light"] .modal,[data-theme="light"] .drawer{background:#fff;border-color:rgba(28,19,3,.1);box-shadow:0 24px 60px rgba(28,19,3,.18)}
.toast{background:#0c1019;border:1px solid rgba(255,255,255,.09);border-inline-start:3px solid var(--accent);box-shadow:var(--shadow)}
[data-theme="light"] .toast{background:#fff;border-color:rgba(28,19,3,.1)}
/* ---- banner / watermark / misc ---- */
.mockbanner{background:linear-gradient(90deg,rgba(233,196,92,.12),rgba(233,196,92,.03));
 border-bottom:1px solid rgba(233,196,92,.18);color:#f7e3a1}
[data-theme="light"] .mockbanner{color:#6b4e0e}
.watermark{border:1px solid rgba(233,196,92,.3);color:rgba(233,196,92,.65);border-radius:99px;
 padding:4px 12px;background:rgba(4,5,10,.55);backdrop-filter:blur(4px)}
[data-theme="light"] .watermark{color:#8a6a1f;background:rgba(255,255,255,.7)}
.statebox .big{color:rgba(233,196,92,.55)}
.alert{border-radius:14px}
.kv{border-bottom:1px dashed rgba(255,255,255,.05)}
[data-theme="light"] .kv{border-bottom-color:rgba(28,19,3,.06)}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04))}
[data-theme="light"] .skel{background:linear-gradient(90deg,rgba(28,19,3,.05),rgba(28,19,3,.1),rgba(28,19,3,.05))}
.note{color:var(--muted)}

/* ===================== PHASE 1.5 REFINEMENT LAYER ===================== */
kbd{font-family:var(--mono);font-size:9.5px;border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
[data-theme="light"] kbd{border-color:rgba(28,19,3,.18)}
/* rail mode */
.railbtn{align-self:flex-start;margin:2px 0 8px}
.app.rail{--sb-w:66px}
.app.rail .brand>div:last-child,.app.rail .gtitle,.app.rail .navitem span,.app.rail .envblock .sub,.app.rail .envblock div div+div,.app.rail .devonly,.app.rail .foot label,.app.rail .railbtn{display:none}
.app.rail .navitem{justify-content:center;padding:0;position:relative}
.app.rail .navitem .cnt{position:absolute;top:3px;inset-inline-end:5px;font-size:8.5px;padding:0 4px}
.app.rail .envblock{justify-content:center;padding:8px 4px}
.app.rail .envblock>div:first-child{display:none}
.app.rail .navitem:hover::after{content:attr(data-tip);position:absolute;inset-inline-start:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#0c1019;border:1px solid rgba(255,255,255,.14);padding:5px 10px;border-radius:8px;font-size:11px;white-space:nowrap;z-index:95;color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
[data-theme="light"] .app.rail .navitem:hover::after{background:#fff;border-color:rgba(28,19,3,.16)}
/* environment indicator */
.envblock{display:flex;gap:8px;align-items:center;border:1px solid rgba(61,220,132,.3);background:rgba(61,220,132,.07);border-radius:12px;padding:7px 10px;color:var(--ok);font-weight:800;font-size:10.5px;letter-spacing:.1em;text-align:start}
.envblock .sub{font-size:9.5px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:2px}
.envblock .edot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.7);flex:none;animation:none}
.envblock.production{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.09);color:#ff8d8d}
[data-theme="light"] .envblock.production{color:#c93b3b}
.envchip{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--ok);border:1px solid rgba(61,220,132,.3);background:rgba(61,220,132,.07);border-radius:99px;padding:3px 9px;white-space:nowrap}
/* palette */
.palbtn{min-width:210px;max-width:280px;justify-content:flex-start;gap:8px;color:var(--muted);flex:1}
@media(max-width:1000px){.palbtn kbd{display:none}.palbtn{min-width:0;max-width:180px}}
@media(max-width:760px){.palbtn span{display:none}.palbtn{min-width:34px;flex:none}.envchip{font-size:8.5px;padding:2px 7px}.crumb span:first-child{display:none}}
.palbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:start;font-weight:500}
.palwrap{position:fixed;inset:0;background:rgba(2,3,6,.62);backdrop-filter:blur(3px);z-index:95;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0}
.palette{width:min(640px,100%);background:#0a0d16;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}
[data-theme="light"] .palette{background:#fff;border-color:rgba(28,19,3,.12)}
.pal-input{width:100%;background:transparent;border:none;outline:none;padding:15px 18px;font-size:14px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.07);font-family:inherit}
[data-theme="light"] .pal-input{border-bottom-color:rgba(28,19,3,.08)}
.pal-groups{max-height:46vh;overflow:auto;padding:6px}
.pal-g{font-size:9.5px;letter-spacing:.14em;color:rgba(233,196,92,.7);padding:9px 10px 4px;font-weight:800}
.pal-item{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.pal-item:hover,.pal-item:focus-visible{background:rgba(233,196,92,.1);outline:none}
.pal-item .t{flex:1;font-weight:600;font-size:12.5px}
.pal-item .d{color:var(--muted);font-size:11px;white-space:nowrap}
.pal-foot{padding:8px 14px;border-top:1px solid rgba(255,255,255,.06);color:var(--muted);font-size:10.5px;display:flex;gap:14px;align-items:center}
[data-theme="light"] .pal-foot{border-top-color:rgba(28,19,3,.07)}
/* severity */
.sev{font-size:8.5px;font-weight:800;letter-spacing:.1em;border-radius:6px;padding:2px 6px;border:1px solid;white-space:nowrap}
.sev-info{color:var(--neutral);border-color:rgba(142,160,179,.35);background:rgba(142,160,179,.08)}
.sev-notice{color:var(--accent);border-color:rgba(233,196,92,.35);background:var(--accent-soft)}
.sev-warn{color:var(--warn);border-color:rgba(233,196,92,.4);background:rgba(233,196,92,.14)}
.sev-crit{color:var(--err);border-color:rgba(255,107,107,.4);background:var(--err-soft)}
/* event rows */
.evrow{display:grid;grid-template-columns:74px 1fr auto;gap:6px 12px;align-items:center;padding:9px 8px;border-bottom:1px dashed rgba(255,255,255,.06);cursor:pointer;border-radius:10px}
.evrow:hover,.evrow:focus-visible{background:rgba(255,255,255,.035);outline:none}
[data-theme="light"] .evrow{border-bottom-color:rgba(28,19,3,.07)}
[data-theme="light"] .evrow:hover{background:rgba(28,19,3,.03)}
.evrow .et{font-size:10.5px;color:var(--muted)}
.evrow .ea{font-weight:700;font-size:12px}
.evrow .etg{font-size:10.5px;color:var(--muted)}
.evrow .er{display:flex;gap:6px;align-items:center;justify-content:flex-end}
/* integration rows */
.irow{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px dashed rgba(255,255,255,.06)}
.irow:last-child{border-bottom:none}
[data-theme="light"] .irow{border-bottom-color:rgba(28,19,3,.07)}
.irow .ic{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--muted);flex:none;font-weight:800}
[data-theme="light"] .irow .ic{background:rgba(28,19,3,.04)}
.irow .nm{flex:1;min-width:0}
.irow .nm b{font-size:12.5px}
.irow .meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
/* ranges */
.ranges{display:inline-flex;gap:3px;background:rgba(255,255,255,.04);padding:3px;border-radius:10px;border:1px solid rgba(255,255,255,.06)}
[data-theme="light"] .ranges{background:rgba(28,19,3,.04);border-color:rgba(28,19,3,.08)}
.ranges .chip{border:none;background:transparent;padding:3px 10px;border-radius:8px}
.ranges .chip.on{background:var(--accent-soft);color:var(--accent)}
/* bulk bar */
.bulkbar{position:sticky;bottom:12px;display:none;gap:10px;align-items:center;background:rgba(10,13,22,.94);border:1px solid rgba(233,196,92,.35);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);z-index:6;backdrop-filter:blur(8px);margin-top:10px}
[data-theme="light"] .bulkbar{background:rgba(255,255,255,.97)}
.bulkbar b.num{color:var(--accent);font-size:15px}
.rowchk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text2)}
th.sortable .arr{opacity:.6;font-size:9px}
/* user menu */
.umenu{position:fixed;z-index:80;background:#0c1019;border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:var(--shadow);min-width:200px;padding:5px}
[data-theme="light"] .umenu{background:#fff;border-color:rgba(28,19,3,.12)}
.umenu button{display:flex;gap:9px;width:100%;text-align:start;padding:8px 10px;border-radius:8px;font-size:12px;align-items:center}
.umenu button:hover{background:rgba(233,196,92,.12)}
.umenu button svg{flex:none;opacity:.85}
/* account identity (real /admin/me data — shell refinement) */
.umenu .uid{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);margin-bottom:5px}
.umenu .uid .uav{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(135deg,#ffb703,#d4af37);color:#060a14;font-weight:900;font-size:13px;
 border:2px solid #fff0bd;box-shadow:0 0 12px rgba(255,183,3,.4)}
.umenu .uid .uinfo{display:flex;flex-direction:column;min-width:0}
.umenu .uid .uname{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.umenu .uid .uemail{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;direction:ltr}
.umenu .uid .urole{font-size:10px;color:var(--muted);margin-top:2px}
.umenu .usec{border-top:1px solid var(--border);margin-top:5px;padding-top:5px}
.umenu .usec button{color:var(--text2)}
.umenu .umeta{padding:6px 10px 4px;font-size:9px;color:var(--muted);border-top:1px solid var(--border);margin-top:5px;direction:ltr;text-align:start;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme="light"] .umenu .usec button{color:var(--text2)}
/* dev mode */
.devonly{display:none!important}
body.dev .devonly{display:block!important}
body.dev .devonly.inline{display:inline!important}
/* states gallery */
.stategrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.stategrid .st-cell{border:1px dashed rgba(255,255,255,.12);border-radius:12px;padding:10px;min-height:74px;display:flex;flex-direction:column;gap:7px;justify-content:center}
[data-theme="light"] .stategrid .st-cell{border-color:rgba(28,19,3,.14)}
.stategrid .st-cell>b{font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
/* validation steps */
.vstep .v{transition:opacity .3s}
.vstep.done .v{color:var(--ok)}

/* ===================== v2.1 NAVIGATION & RESPONSIVE LAYER ===================== */
/* collapsible group headers */
.ghead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;
 padding:8px 13px 6px;color:rgba(233,196,92,.55);letter-spacing:.16em;font-size:9.5px;font-weight:800;
 background:transparent;border:none;cursor:pointer;border-radius:9px;text-transform:uppercase}
.ghead:hover{color:var(--text2)}
.ghead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghead .gchev{font-size:9px;transition:transform .15s;transform:rotate(-90deg);color:var(--muted)}
.ghead[aria-expanded="true"] .gchev{transform:rotate(0)}
[dir="rtl"] .ghead .gchev{transform:rotate(90deg)}
[dir="rtl"] .ghead[aria-expanded="true"] .gchev{transform:rotate(0)}
.ghead.has-active .gt{color:var(--accent)}
.ghead.has-active::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(233,196,92,.6)}
.gitems{display:none}
.gitems.show{display:block}
/* stronger active state: bg + accent + icon + weight + inset bar + end-dot (aria-current also set) */
.navitem.active{font-weight:800;border:1px solid rgba(233,196,92,.38);
 background:linear-gradient(90deg,rgba(233,196,92,.20),rgba(233,196,92,.05));
 color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] .navitem.active{box-shadow:inset -3px 0 0 var(--accent)}
.navitem.active .ic{color:var(--accent)}
.navitem.active .cellmain,.navitem.active span{font-weight:800}
.navitem .aind{width:6px;height:6px;border-radius:50%;background:var(--accent);
 box-shadow:0 0 8px rgba(233,196,92,.7);position:absolute;inset-inline-end:12px;top:50%;margin-top:-3px}
.navitem{position:relative}
[data-theme="light"] .navitem.active{background:linear-gradient(90deg,rgba(201,148,43,.20),rgba(201,148,43,.05));
 border-color:rgba(138,106,31,.4);box-shadow:inset 3px 0 0 #8a6a1f;color:#6b4e0e}
[data-theme="light"] [dir="rtl"] .navitem.active{box-shadow:inset -3px 0 0 #8a6a1f}
[data-theme="light"] .navitem .aind{background:#8a6a1f;box-shadow:none}
/* mobile drawer: opaque + backdrop + z-order */
#sbBackdrop{display:none;position:fixed;inset:0;background:rgba(3,4,9,.55);backdrop-filter:blur(2px);z-index:45;border:none;padding:0;cursor:default}
[data-theme="light"] #sbBackdrop{background:rgba(28,19,3,.35)}
body.drawer-open #sbBackdrop{display:block}
body.drawer-open{overflow:hidden}
@media(max-width:768px){
  .sidebar{background:#0a0d16!important;border-inline-end:1px solid rgba(255,255,255,.12);
   box-shadow:0 0 60px rgba(0,0,0,.65);z-index:50}
  [data-theme="light"] .sidebar{background:#fffdf7!important;border-inline-end-color:rgba(28,19,3,.14);
   box-shadow:0 12px 44px rgba(28,19,3,.22)}

.twrap{position:relative}

   header and footer actions always stay reachable (was: overflow:hidden in a

async function usr360DoRevoke(uid,sid){
 const g=$("#f3actgo");if(g){g.disabled=true}
 try{
  const r=await VeloraData.request("/api/v1/admin/users/"+uid+"/sessions/"+sid+"/revoke",{method:"POST"});
  toast(r&&r.changed===false?t("u360.done.revoke.already"):t("u360.done.revoke"));
  f3CloseModal();U36.sess=null;U36.sst="idle";f3RenderIf(u360Cur());f3Load360Sessions(String(uid));   /* server-truthful refresh */
 }catch(e){
  const code=e&&e.code||"";
  toast((code?esc(code)+" · ":"")+(e&&e.message?t("f3.errprefix"):""),"err");
  f3ActErr((code?code+" — ":"")+(e&&e.message?String(e.message):t("f3.load.err")));
 }
}

const IINT_ST={SUCCESS:"ok",AUTH_FAILED:"err",TIMEOUT:"err",NETWORK_ERROR:"err",SERVICE_UNAVAILABLE:"err",NOT_CONFIGURED:"warn",UNKNOWN:"neutral"};
const iintReach=v=>{
 if(!v||v==="unknown")return bdot("neutral",t("iint.reach.unknown"));
 const s=String(v);return bdot(IINT_ST[s]||"neutral",s);
};
const iintResult=(T)=>{ /* T = test object from backend */
 if(!T)return"";
 let h=`<div style="border-top:1px dashed var(--border);margin-top:10px;padding-top:8px"><div class="cellsub">${esc(t("iint.result"))}</div>`;
 h+=`<div class="kv"><span class="k">${esc(t("ah.col.status"))}</span><span class="v">${bdot(IINT_ST[T.status]||"neutral",esc(String(T.status||"—")))}</span></div>`;
 if(T.latencyMs!=null)h+=`<div class="kv"><span class="k">${esc(t("iint.latency"))}</span><span class="v num">${esc(String(T.latencyMs))}ms</span></div>`;
 if(T.checkedAt)h+=`<div class="kv"><span class="k">${esc(t("iint.checked"))}</span><span class="v cellsub">${esc(String(T.checkedAt))}</span></div>`;
 if(T.message)h+=`<div class="kv"><span class="k">${esc(t("iint.msg"))}</span><span class="v cellsub">${esc(String(T.message))}</span></div>`;
 return h+`</div>`;
};
const iintReadonly=()=>`<div class="alert warn" style="margin-top:12px"><span class="amark" aria-hidden="true">!</span><div>${esc(t("iint.readonly"))}<div class="note mono">integrations.manage</div></div></div>`;

const AH={health:null,diag:null,st:"idle",err:null,busy:{},refreshing:false,results:{}};
async function f3LoadAH(){
 AH.st="loading";f3RenderIf("ai-health");
 const jobs=[];
 if(can("system.health.view"))jobs.push(VeloraData.request("/api/v1/admin/system/health").then(d=>{AH.health=d&&d.health?d.health:{};}).catch(e=>{AH.err=e;}));
 else AH.health=null;
 jobs.push(VeloraData.request("/api/v1/admin/system/diagnostics").then(d=>{AH.diag=d&&d.health?d.health:{};}).catch(e=>{if(!AH.err)AH.err=e;}));
 await Promise.all(jobs);
 AH.st=AH.err?"error":"ok";f3RenderIf("ai-health");
}
async function f3AHRefresh(){
 if(AH.refreshing||!can("system.health.view"))return;AH.refreshing=true;f3RenderIf("ai-health");
 try{await VeloraData.request("/api/v1/admin/system/diagnostics/refresh",{method:"POST"});
  const d=await VeloraData.request("/api/v1/admin/system/diagnostics");
  AH.diag=d&&d.health?d.health:AH.diag;toast(t("ah.done.refresh"));}
 catch(e){toast((e&&e.code?e.code+" · ":"")+t("f3.load.err"),"err");}
 AH.refreshing=false;f3RenderIf("ai-health");
}
async function f3AHAction(prov,op){
 if(AH.busy[prov])return;AH.busy[prov]=true;f3RenderIf("ai-health");
 try{const r=await VeloraData.request("/api/v1/admin/providers/"+encodeURIComponent(prov)+"/"+(op==="verify"?"verify":"test-connection"),{method:"POST"});
  AH.results[prov]={ok:true,res:r||{}};}
 catch(e){AH.results[prov]={ok:false,err:e};}
 AH.busy[prov]=false;f3RenderIf("ai-health");
}
function aiHealthPage(){
 if(AH.st==="idle")f3LoadAH();
 let h=pagehead(t("ah.title"),t("ah.desc"));
 if(AH.st==="loading")return h+`<div class="grid g2"><div class="card"><div class="cb">${f3skel(4)}</div></div><div class="card"><div class="cb">${f3skel(4)}</div></div></div>`;
 if(AH.st==="error"&&!AH.diag&&!AH.health)return h+f3errBox(AH.err);
 const H=AH.health||{},D=AH.diag||{};

 if(!Array.isArray(trend)||trend.length<2)return"";
 const vals=trend.map(p=>+p.count||0);const mx=Math.max.apply(null,vals);if(mx<=0)return"";
 const step=100/(vals.length-1);
 const pts=vals.map((v,i)=>`${(i*step).toFixed(2)},${(22-(v/mx)*20).toFixed(2)}`).join(" ");
 return `<svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.6" points="${pts}"/></svg>`;
};
const f3b3dist=(rows)=>{ /* distribution table from [{key,count}] */
 if(!Array.isArray(rows)||!rows.length)return f3unavail();

/* ------------------------------ F-2 router ------------------------------
   Hash router over the canonical registry: dynamic :id segments, query
   params, trailing-slash normalization, browser back/forward, document
   title + breadcrumb via i18n, deterministic velora:route event, honest
   404 (never silently Overview), route-level permission gating, no full
   page reloads, rapid-change safe (render is synchronous; last hash wins). */
let CURRENT={def:null,params:{},query:{},status:"boot"};
let focusNext=false;
function parseHash(){
 let h=location.hash||"#/overview";
 h=h.replace(/^#/,"");
 if(!h.startsWith("/"))h="/"+h;
 h=h.replace(/\/+$/,"");if(h==="")h="/";
 let path=h,query={};
 const qi=h.indexOf("?");
 if(qi>=0){path=h.slice(0,qi);
  new URLSearchParams(h.slice(qi+1)).forEach((v,k)=>{query[k]=v});}
 return {path,seg:path.split("/").filter(Boolean),query};
}
function resolveRoute(p){
 if(!p.seg.length){const d=REG_BY_ROUTE.overview;return d?{def:d,params:{},query:p.query}:null}
 const joined=p.seg.map(x=>decodeURIComponent(x)).join("/");
 let d=REG_BY_ROUTE[joined];
 if(d)return {def:d,params:{},query:p.query};
 for(const dd of REG){if(!dd.dynamic)continue;
  const parts=dd.route.split("/");
  if(parts.length!==p.seg.length)continue;
  const params={};let ok=true;
  parts.forEach((pp,i)=>{const raw=decodeURIComponent(p.seg[i]);
   if(pp.charAt(0)===":")params[pp.slice(1)]=raw;else if(pp!==raw)ok=false});
  if(ok)return {def:dd,params,query:p.query};
 }
 return null;
}
function navTo(hash){if(location.hash===hash)return;location.hash=hash}
function go(id){const d=REG_BY_ROUTE[id];
 if(!d){navTo("#/_not-found");return}
 const target="#/"+(d.dynamic?d.route:id);
 if(CURRENT.def&&CURRENT.def.route===d.route){render();return}   /* same route: no history entry */
 navTo(target);
}
function render(){
 const p=parseHash(),r=resolveRoute(p),v=$("#view");
 CURRENT=r?{def:r.def,params:r.params,query:r.query,status:"ok"}:{def:null,params:{},query:p.query,status:"notfound"};
 let fn,lbl;
 if(!ME.ok){CURRENT.status="boot";
  fn=()=>pagehead(t("shell.boot.title"),t("shell.boot.desc"),"")+`<div class="card"><div class="cb">${'<div class="skel" style="height:14px;margin:11px;width:70%"></div>'.repeat(4)}</div></div>`;
  lbl=t("shell.boot.title");}
 else if(!r){fn=notFoundPage;lbl=t("shell.notfound.title");}
 else if(!canRoute(r.def)){CURRENT.status="denied";fn=()=>deniedPanel(r.def.perm||"");lbl=t("shell.denied.title");}
 else{fn=()=>r.def.dynamic?user360Page(r.params.id):(PAGE_IMPL[r.def.route]?PAGE_IMPL[r.def.route]():pendingPage(r.def));lbl=t(r.def.labelKey);}
 v.innerHTML=fn();
 const g=CURRENT.def&&CURRENT.def.group&&CURRENT.def.group!==CURRENT.def.labelKey?t(CURRENT.def.group):null;
 $("#crumb").innerHTML=`<span>VELORA</span><span>›</span>${g?`<span>${esc(g)}</span><span>›</span>`:""}<b>${esc(lbl)}</b>`;
 document.title=lbl+" · VELORA ADMIN";
 renderNav();syncUserBtn();
 v.classList.remove("viewin");void v.offsetWidth;v.classList.add("viewin");
 if(focusNext){focusNext=false;focusHeading()}
 window.dispatchEvent(new CustomEvent("velora:route",{detail:{route:CURRENT.def?CURRENT.def.route:null,params:CURRENT.params,query:CURRENT.query,status:CURRENT.status}}));
}

   <span class="uinfo"><span class="uname">${esc(nm||t("acct.user"))}</span>
   ${em&&em!==nm?`<span class="uemail">${esc(em)}</span>`:""}
   <span class="urole">${esc(role||"—")} · #${esc(String(m.userId??""))}</span></span></div>
  <button role="menuitem" onclick="setLang(lang==='fa'?'en':'fa');closeUserMenu()">${esc(t("shell.menu.lang"))}</button>
  <button role="menuitem" onclick="setTheme(theme==='dark'?'light':'dark');closeUserMenu()">${esc(t("shell.menu.theme"))}</button>
  <div class="usec"><button role="menuitem" id="exitAdminBtn"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>${esc(t("shell.menu.exit"))}</button></div>
  ${__REL?`<div class="umeta mono">${esc(__REL)}</div>`:""}`;
 document.body.appendChild(el);
 /* Physical anchor that works in both directions: the popover's inline-end
    edge aligns with the button's inline-end edge (RTL flips the topbar, so
    inset-inline-end + getBoundingClientRect().right mis-anchors in FA). */
 const r=$("#userBtn").getBoundingClientRect();
 el.style.top=(r.bottom+8)+"px";
 if(document.documentElement.dir==="rtl"){el.style.left=Math.max(8,r.left)+"px";el.style.right="auto"}
 else{el.style.right=Math.max(8,(window.innerWidth-r.right))+"px";el.style.left="auto"}
 $("#userBtn").setAttribute("aria-expanded","true");
 /* EXIT ADMIN ≠ LOGOUT: plain navigation to the canonical authenticated
    dashboard for the current locale. The session stays fully valid and the
    real logout endpoint is never called from the Admin shell — real logout
    lives on the normal dashboard (its single official trigger). */
 $("#exitAdminBtn").onclick=()=>{closeUserMenu();location.assign("/"+lang+"/dashboard/")};
 el.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();closeUserMenu();const ub=$("#userBtn");if(ub)ub.focus()}});
 const fb=el.querySelector("button");if(fb)fb.focus();
}
function syncUserBtn(){const ub=$("#userBtn");if(!ub)return;
 if(ME.ok){const m=ME.user||{};
  /* Real identity: initials derived from the authenticated /admin/me payload
     (name/username/email — never a generic photo, never fabricated data).
     Numeric text here would be wrapped by the site-wide Latin-digit layer
     (v-latn-num span) and swap the button's hit target mid-click; initials
     avoid that too. Identity details live inside the account menu. */
  const em=identityEmail(),nm=identityName();
  ub.innerHTML=`<span id="userInit" aria-hidden="true">${esc(dashboardAvatarLetter())}</span>`;
  ub.title=nm?(nm+(em?" · "+em:"")):String(m.role||"");ub.disabled=false}
 else{ub.textContent="…";ub.disabled=true}}
document.addEventListener("click",e=>{const m=$("#umenu");if(!m)return;const ub=$("#userBtn");
 if(!m.contains(e.target)&&!(ub&&ub.contains(e.target)))closeUserMenu()});
$("#userBtn").onclick=()=>{if(ME.ok)toggleUserMenu()};

/* ------------------------------ bootstrap (real /admin/me; no fake env) ------------------------------ */
function bootState(title,desc,icon){$("#view").innerHTML=pagehead(title,desc,"")+empty(icon||VI.box,title,desc)}
async function boot(){
 setTheme(document.documentElement.dataset.theme==="light"?"light":"dark");
 try{const sl=localStorage.getItem("velora_locale");if(sl==="en"||sl==="fa")lang=sl}catch(e){}
 const lb=$("#langBtn");if(lb)lb.textContent=lang==="fa"?"FA/EN":"EN/FA";
 syncThemeBtn();setEnv();applyStaticI18n();render();
 if(!window.VeloraData||!window.VeloraData.request||location.protocol==="file:"){
  setConn("demo");bootState(t("shell.nolayer.title"),t("shell.nolayer.desc"));return}
 try{
  const u=await VeloraData.ready();
  if(!u){location.replace("/login");return}      /* 401/anonymous → existing app convention */
  const d=await VeloraData.request("/api/v1/admin/me");
  const m=(d&&d.me)?d.me:(d||{});
  if(m.panel===false){setConn("ready");ME.ok=true;ME.user=m;$("#view").innerHTML=pagehead(t("shell.403.title"),t("shell.403.desc"),`<span class="badge b-err">403</span>`)+empty(VI.ban,t("shell.403.title"),t("shell.403.desc"));renderNav();return}
  ME.ok=true;ME.user=m;ME.perms=new Set(m.permissions||[]);
  ME.recent=Array.isArray(d.recentAdminActions)?d.recentAdminActions:(Array.isArray(m.recentAdminActions)?m.recentAdminActions:[]);
  setConn("ready");render();
 }catch(e){
  if(e&&e.status===401){location.replace("/login");return}
  if(e&&(e.status===403||e.code==="ADMIN_REQUIRED")){setConn("ready");$("#view").innerHTML=pagehead(t("shell.403.title"),t("shell.403.desc"),`<span class="badge b-err">403</span>`)+empty(VI.ban,t("shell.403.title"),t("shell.403.desc"));renderNav();return}
  setConn("offline");bootState(t("shell.offline.title"),t("shell.offline.desc"),VI.ban);
 }
}
boot();
</script>
