<!DOCTYPE html>

<html data-i18n-features="common,errors,auth" data-route-locale="fa" data-velora-prelocalized="fa" dir="rtl" lang="fa">

<style>
:root{--bg:#04050a;--card:rgba(15,27,61,.92);--line:rgba(212,175,55,.34);--gold:#e9c45c;--gold2:#c9972e;--txt:#edeae0;--mut:#a39d8d;--ok:#4CD39A;--err:#F87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(620px 420px at 82% 18%,rgba(212,175,55,.12),transparent 62%),radial-gradient(720px 520px at 15% 8%,rgba(59,130,246,.13),transparent 62%),var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:440px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(15,27,61,.94),rgba(8,13,28,.97));box-shadow:0 40px 90px rgba(0,0,0,.62);padding:34px 30px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-bottom:24px}.brand img{width:42px;height:42px}.brand span{font-size:20px;font-weight:900;letter-spacing:4px;background:linear-gradient(120deg,#fce38a,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}h1{margin:0;font-size:24px;color:#fff}p{color:var(--mut);line-height:2;font-size:13.5px}.field{margin-top:20px}.field label{display:block;margin-bottom:8px;color:#c7d2ea;font-size:12px;font-weight:700}input{width:100%;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(6,10,20,.62);color:#EAF0FA;padding:14px 16px;font-size:14px;outline:none}input:focus{border-color:rgba(212,175,55,.65);box-shadow:0 0 0 4px rgba(212,175,55,.12)}button{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#fce38a 0%,#d4af37 50%,#b88d1d 100%);color:#0b121e;font-weight:900;font-size:14px;cursor:pointer}button:disabled{opacity:.72;cursor:wait}.msg{display:none;margin-top:14px;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.8}.msg.ok{display:block;border:1px solid rgba(76,211,154,.45);background:rgba(16,185,129,.08);color:var(--ok)}.msg.err{display:block;border:1px solid rgba(239,68,68,.45);background:rgba(239,68,68,.08);color:var(--err)}.switch{margin-top:18px;text-align:center;font-size:13px;color:var(--mut)}.switch a{color:var(--gold);font-weight:800;text-decoration:none}</style>
<meta content="fa" name="content-language"/><link href="https://veloratrade.ir/fa/forgot-password/" rel="canonical"/><meta content="https://veloratrade.ir/fa/forgot-password/" property="og:url"/><link href="https://veloratrade.ir/fa/forgot-password/" hreflang="fa" rel="alternate"/><link href="https://veloratrade.ir/en/forgot-password/" hreflang="en" rel="alternate"/><link href="https://veloratrade.ir/en/forgot-password/" hreflang="x-default" rel="alternate"/></head>
<body>
<div class="shell"><main class="card">
<a class="brand" href="/"><img alt="VELORA" data-i18n-alt="common.velora.2e043621" src="/velora-logo.svg"/><span data-i18n="common.velora.2e043621">VELORA</span></a>
<h1 data-i18n="pages.forgot_password.recover.password.c795cbe8">بازیابی رمز عبور</h1>
<p data-i18n="pages.forgot_password.enter.your.account.email.if.an.account.f58bd55b">ایمیل حساب خود را وارد کنید. اگر حسابی با این ایمیل وجود داشته باشد, لینک بازیابی برایتان ارسال می‌شود.</p>
<form id="form" novalidate="">
<div class="field"><label data-i18n="common.email.0cc870ea" for="email">ایمیل</label><input autocomplete="email" id="email" placeholder="you@example.com" required="" type="email"/></div>
<button data-i18n="pages.forgot_password.send.recovery.link.d88ddcda" id="btn" type="submit">ارسال لینک بازیابی</button>
<div class="msg" id="msg"></div>
</form>
<div class="switch"><span data-i18n="pages.forgot_password.remember.your.password.6969160e">رمز را به خاطر آوردید?</span> <a data-i18n="common.login.to.account.8181f948" href="/login">ورود به حساب</a></div>
</main></div>
<script>
(function () {
  var form = document.getElementById('form');
  var email = document.getElementById('email');
  var button = document.getElementById('btn');
  var message = document.getElementById('msg');
  var t = VeloraLocale.t;
  function show(type, text) { message.className = 'msg ' + type; message.textContent = text; }
  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    var value = email.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) { show('err', t('auth.emailInvalid')); return; }
    button.disabled = true;
    button.textContent = t('auth.sendingReset');
    try {
      await VeloraData.request('/api/v1/auth/forgot-password', { method: 'POST', token: '', body: { email: value, notificationLocale: VeloraLocale.locale } });
      show('ok', t('auth.resetSent'));
    } catch (error) {
      show('err', VeloraLocale.errorMessage(error, 'auth.recoveryFailed'));
    }
    button.disabled = false;
    button.textContent = t('auth.sendRecovery');
  });
})();
</script>
<script src="/public/assets/velora-ui-sound.js?v=2026.08.13.2"></script>
<script src="/public/assets/velora-dialog.js?v=2026.08.22.1"></script>
</body>
</html>
